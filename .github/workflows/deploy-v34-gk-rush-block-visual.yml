            const st=m.playersById['H-ST'],gk=m.playersById['A-GK'];for(const p of m.players){p.nextThink=99999;p.vx=p.vy=0;p.hasBall=false;}Object.assign(st,{x:c.sx,y:c.y,tx:c.sx,ty:c.y,bodyAngle:0,faceTargetAngle:0});Object.assign(gk,{x:101,y:c.y,tx:101,ty:c.y,vx:0,vy:0,action:'GK_SAVE_SET',tacticalTask:'GK_SAVE_SET',nextThink:99999});m.ball={mode:'FLIGHT',kind:'SHOT',x:c.bx,y:c.y,z:0,vx:c.speed,vy:0,vz:0,ownerId:null,intendedReceiverId:null,lastTouchTeam:'HOME',lastTouchPlayer:'H-ST',shotTeam:'HOME',shotTargetY:c.y,shotDistance:c.distance,originX:c.bx,originY:c.y,targetX:105,targetY:c.y,shotOneVOne:true,shotClearKeeperChance:true,onTarget:true,airborne:false,age:.4};m.lastTouchTeam='HOME';m.lastTouchPlayer='H-ST';let start=null,block=null,framesBetween=0,startGk=null;for(let i=0;i<80&&['FLIGHT','LOOSE'].includes(m.ball.mode);i++){E.step(m,.05);if(!start){start=(m.events||[]).find(e=>e.type==='GK_RUSH_START')||null;if(start){startGk={x:gk.x,y:gk.y};}}else if(!block)framesBetween++;if(!block)block=(m.events||[]).find(e=>e.type==='RUSH_BLOCK')||null;if(block)break;}return{seed:c.seed,start,block,framesBetween,startGk,contactGk:{x:gk.x,y:gk.y},post:{mode:m.ball.mode,kind:m.ball.kind,owner:m.ball.ownerId,receiver:m.ball.intendedReceiverId,vx:m.ball.vx,vy:m.ball.vy,lastTouch:m.ball.lastTouchPlayer,source:m.ball.shotSourcePlayerId}};
