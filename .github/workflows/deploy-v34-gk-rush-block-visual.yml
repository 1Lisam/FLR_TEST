          replacement="""function runGkRushBlockDebugScenario(key){\n const c=GK_PHASE2_DEBUG_CASES[key];if(!c)return false;clearAutoAdvance();clearTimeout(sceneNoticeTimer);clearOffsideReview();ensurePitchChoice()?.hide();focusPitch();\n const m=E.createMatch(c.seed,{dt:.05});m.time=0;m.restart=null;m.phase='OPEN_PLAY';m.nextShape=99999;m.events=[];m.score={HOME:0,AWAY:0};m.possession='HOME';m.playerAbilityProfiles={};m.v34TestOnlyVisualFixture=true;\n const st=m.playersById['H-ST'],gk=m.playersById['A-GK'];if(!st||!gk)return true;for(const p of m.players){p.hasBall=false;p.nextThink=99999;p.vx=p.vy=0;}\n Object.assign(st,{x:88,y:34,tx:88,ty:34,bodyAngle:0,faceTargetAngle:0,nextThink:99999});Object.assign(gk,{x:101,y:34,tx:101,ty:34,vx:0,vy:0,bodyAngle:Math.PI,action:'GK_SAVE_SET',tacticalTask:'GK_SAVE_SET',nextThink:99999});\n m.playerAbilityProfiles={'A-GK':{handling:45,reaction:60,gk_positioning:60,agility:60,diving:60},'H-ST':{finishing:75}};m.ball={mode:'FLIGHT',kind:'SHOT',x:90,y:34,z:0,vx:20,vy:0,vz:0,ownerId:null,intendedReceiverId:null,lastTouchTeam:'HOME',lastTouchPlayer:'H-ST',shotTeam:'HOME',shotTargetY:34,shotDistance:15,originX:90,originY:34,targetX:105,targetY:34,shotOneVOne:true,shotClearKeeperChance:true,onTarget:true,airborne:false,age:.4};m.lastTouchTeam='HOME';m.lastTouchPlayer='H-ST';\n const frames=[deep(E.snapshot(m))];let rushStart=null,block=null,tail=0;for(let i=0;i<80;i++){E.step(m,.05);frames.push(deep(E.snapshot(m)));if(!rushStart)rushStart=(m.events||[]).find(e=>e?.type==='GK_RUSH_START')||null;if(!block)block=(m.events||[]).find(e=>e?.type==='RUSH_BLOCK')||null;if(block){tail++;if(tail>=30)break;}if(!['FLIGHT','LOOSE'].includes(m.ball.mode)&&!block)break;}\n const actual=block?.npcGkOutcome||null;developerScenarioActive={key,label:c.label,instruction:c.instruction,seed:c.seed};developerScenarioLast={key,label:c.label,instruction:c.instruction,seed:c.seed,highResSeed:c.seed,frames:deep(frames),debug:null};latestIntegratedDebug=null;session=null;opened=null;activeBoundary=null;beforeHybrid=null;world=null;selectedStepResults=[];phase='SEARCHING';$('heroPlayer').value='H-ST';if($('heroRecentFixSelect'))$('heroRecentFixSelect').value=key;renderRecentFixGuide();$('heroPlayback').textContent=`개발자 강제 검증 · ${c.label}`;$('heroState').textContent='V34 GK RUSH_BLOCK TEST_ONLY · 실제 러시 접근부터 블록 후 세컨드볼까지';const status=actual===c.expected?`이번 검증: ${c.label} · 실제 결과 ${actual} · ${c.instruction}`:`강제 검증 불일치 · 기대 ${c.expected} / 실제 ${actual||'NONE'}`;if($('heroRecentFixStatus'))$('heroRecentFixStatus').textContent=status;$('heroEventLog').innerHTML+=`<div class=\"major-match-event\"><strong>GK RUSH_BLOCK 강제 검증 · ${c.label}</strong> · 기대 ${c.expected} / 실제 ${actual||'NONE'}<br><small>TEST_ONLY seed=${c.seed} · 실제 FLIGHT → GK 전진 → 근접 블록 → LOOSE continuation</small></div>`;$('heroDebugSummary').textContent=`DEV ${key}\\nseed=${c.seed}\\nexpected=${c.expected}\\nactual=${actual||'NONE'}\\nrushStart=${rushStart?.t??'-'}\\nblockAt=${block?.t??'-'}\\nfuturePrecomputed=false`;if($('heroRecentFixReplay'))$('heroRecentFixReplay').disabled=!frames.length;if(actual!==c.expected){developerScenarioActive=null;phase='IDLE';draw(frames.at(-1));renderMeta(frames.at(-1));return true;}startReplay(frames,'DEV_SCENARIO',`${c.label} · 러시부터 강제 재현`,c.replayRate||1);return true;\n}\nfunction runRecentFixScenario(key=selectedRecentFixKey(),opts={}){\n clearAutoAdvance();clearTimeout(sceneNoticeTimer);clearOffsideReview();ensurePitchChoice()?.hide();focusPitch();\n if(GK_PHASE2_DEBUG_CASES[key]){if(GK_PHASE2_DEBUG_CASES[key].rushFixture)runGkRushBlockDebugScenario(key);else runGkPhase2DebugScenario(key);return;}"""
