if(c.terminal&&!terminal)terminal=[...m.events].reverse().find(e=>e?.type===c.terminal)||null;if(outcome&&(!c.terminal||terminal))break;}return{outcome:outcome?.npcGkOutcome||null,terminal:terminal?.type||null};}
          const cases=[
