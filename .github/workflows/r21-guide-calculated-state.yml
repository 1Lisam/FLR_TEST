name: R21 clarify calculated-state test guide
on:
  push:
    branches: [r21-guide-calculated-state]
    paths:
      - '.github/workflows/r21-guide-calculated-state.yml'
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r21-guide-calculated-state
          fetch-depth: 0
      - name: Clarify test criterion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='1번에서는 우리 공격 중 CB/FB가 수비 기본 포메이션에 박혀 있다가 출발하지 않고 이미 올라온 세컨드볼 대비 위치에서 시작하는지, 2~3번에서는 수비수가 공격수 감속에 맞춰 제동하며 투우사처럼 미끄러지지 않는지 확인해 주세요.'
          new='1번에서는 선택 장면이 시작될 때 22명이 특정 포메이션이나 세컨드볼 위치로 다시 배치되지 않고 직전까지 계산된 실제 위치·속도를 그대로 이어받는지, 그리고 새 SEED에서는 다른 경기 경로만큼 시작 배치도 달라지는지 확인해 주세요. 2~3번에서는 수비수가 공격수 감속에 맞춰 제동하며 투우사처럼 미끄러지지 않는지 확인해 주세요.'
          if s.count(old)!=1: raise SystemExit('guide source mismatch')
          p.write_text(s.replace(old,new))
          PY
          grep -q '특정 포메이션이나 세컨드볼 위치로 다시 배치되지 않고' index.html
          grep -q '새 SEED에서는 다른 경기 경로만큼 시작 배치도 달라지는지' index.html
          rm -f .github/workflows/r21-guide-calculated-state.yml
          git config user.name 'FLR R21 Guide Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Clarify R21 calculated-state continuity test guide'
          git push origin HEAD:r21-guide-calculated-state
