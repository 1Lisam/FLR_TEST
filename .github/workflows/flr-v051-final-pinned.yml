name: FLR V0.5.1 Final Pinned QA
on:
  push:
    branches: [main]
    paths: ['.flr/v051-final-pinned-request.json']
permissions: {contents: write}
env:
  PATCH_URL: https://raw.githubusercontent.com/1Lisam/FLR_TEST/4c39a9a37087a65c6a0ca1e945ac48f78303d4b3/.flr/v051_consolidated_retest_apply_v2.py
jobs:
  direct:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {ref: candidate/v051-consolidated-retest-20260823, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Apply pinned patch and run final direct contracts
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "$PATCH_URL" -o /tmp/a.py
          python /tmp/a.py
          node --check step71_hybrid_v06_ui.js
          node --check runtime/protagonist_match_controller.js
          node --check live_hybrid_session_v02.js
          node --check runtime/continuous_match_core.js
          grep -q 'showPendingCausally' step71_hybrid_v06_ui.js
          ! grep -q "if(session.pending?.chained){showPending();return}" step71_hybrid_v06_ui.js
          grep -q 'openWideOutlet' runtime/protagonist_match_controller.js
          grep -q 'carryContinuationGuard' runtime/protagonist_match_controller.js
          grep -q 'LOFTED_THROUGH_PASS' runtime/protagonist_match_controller.js
          grep -q 'visibleGoalAge>=4.8' runtime/protagonist_match_controller.js
          grep -q 'episodeKeepsRestart' runtime/protagonist_match_controller.js
          grep -q 'HYBRID_CONTINUOUS_FROM_V06' live_hybrid_session_v02.js
          grep -q 'receiveRunContinuationUntil' runtime/continuous_match_core.js
          grep -q 'npcPassDecision' runtime/continuous_match_core.js
          grep -q "const npcDecision=!(m.protagonistExplicitActionRequired===true&&m.protagonistControllerId===owner.id)" runtime/continuous_match_core.js
          node <<'NODE'
          const a=require('assert'),E=require('./runtime/continuous_match_core.js'),P=require('./runtime/protagonist_match_controller.js'),fs=require('fs');
          // Exact open lateral LW geometry from the user report.
          let s=P.create('V051-FINAL-LW',{heroPlayerId:'H-ST',mode:'PLAYER_ALL'}),old=E.choiceStateBridge;
          const fake={kind:'ON_BALL',playerId:'H-ST',team:'HOME',role:'ST',slot:'ST',time:66.55,localX:78.78,localY:35.06,pressure:2.384,space:.9,shot:{dGoal:26.24,inBox:false,oneVOne:false,openWindow:false,turningRequired:false,backToGoal:false,bodyAngleDiff:.2,blockers:1},candidates:[{id:'CARRY',score:2.1,meta:{}},{id:'HOLD',score:2,meta:{}},{id:'SAFE_PASS',targetId:'H-RCM',score:1.9,meta:{targetSlot:'RCM'}},{id:'SHOT',score:1.8,meta:{}},{id:'SAFE_PASS',targetId:'H-CM',score:1.7,meta:{targetSlot:'CM'}}],_frame:{opts:[{p:{id:'H-LW',role:'WF',slot:'LW',vx:.693,vy:2.524,tacticalTask:'ST_RELEASE_RUN'},block:1,d:16.23,open:6.06,forward:-1.19,running:true,offsideRisk:false}]}};
          E.choiceStateBridge=()=>({inspect:()=>fake});let q=P.inspect(s);E.choiceStateBridge=old;const lw=q.options.find(x=>x.targetId==='H-LW');a(lw);a.strictEqual(lw.meta.targetId,'H-LW');a.strictEqual(!!s.futureOutcomePrecomputed,false);
          // Moving THROUGH receiver preserves first-touch momentum.
          let m=E.createMatch('V051-FINAL-RECEIVE',{});m.restart=null;m.phase='OPEN_PLAY';m.time=100;m.nextShape=999;m.protagonistControllerId='H-LW';m.protagonistExplicitActionRequired=true;const B=E.choiceActionBridge(),r=B.playerById(m,'H-LW');r.x=76;r.y=18;r.vx=5;r.vy=.15;r.tx=82;r.ty=18.3;r.sprint=true;m.ball={...m.ball,x:75.55,y:18,z:0,mode:'LOOSE',ownerId:null};m.possession='HOME';B.setControlled(m,r,true,{flow:true,flightKind:'THROUGH',deliveryMode:'GROUND',sourceId:'H-ST',incomingVx:15,incomingVy:.3});const x0=r.x,targetDist=Math.hypot(r.tx-r.x,r.ty-r.y);a(r.sprint);a(r.receiveRunContinuationUntil>=100.99);a(targetDist>=4);E.step(m,.1);E.step(m,.1);E.step(m,.1);a(r.x>x0+.08);a(r.receiveRunContinuationUntil>m.time);
          const core=fs.readFileSync('runtime/continuous_match_core.js','utf8');a(core.includes("npcPassDecision=!(m.protagonistExplicitActionRequired===true&&m.protagonistControllerId===owner.id)"));
          console.log(JSON.stringify({status:'PASS',openLW:true,throughTargetDist:targetDist,throughAdvance:r.x-x0,userChoiceAuthorityPreserved:true,futureOutcomePrecomputed:false}));
          NODE
  presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {ref: candidate/v051-consolidated-retest-20260823}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: curl -fsSL "$PATCH_URL" -o /tmp/a.py && python /tmp/a.py && node .flr/historical_presentation_discontinuity_v04.js
  farside:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: candidate/v051-consolidated-retest-20260823}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: curl -fsSL "$PATCH_URL" -o /tmp/a.py && python /tmp/a.py && node .flr/historical_far_side_committed_v04.js
  carry:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: candidate/v051-consolidated-retest-20260823}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: curl -fsSL "$PATCH_URL" -o /tmp/a.py && python /tmp/a.py && node .flr/historical_carry_cadence_v04.js
  reality_open:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {ref: candidate/v051-consolidated-retest-20260823}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          curl -fsSL "$PATCH_URL" -o /tmp/a.py
          python /tmp/a.py
          curl -fsSL https://raw.githubusercontent.com/1Lisam/FLR_TEST/0e0a892846880364cc758b816d2554ccff780db6/.flr/v051_reality_open_gates.js -o /tmp/reality.js
          node /tmp/reality.js "$PWD"
  nonhero:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: candidate/v051-consolidated-retest-20260823}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          curl -fsSL "$PATCH_URL" -o /tmp/a.py
          python /tmp/a.py
          node .flr/v04_nonhero_shot_diversity_audit.js "$PWD" 240 > /tmp/n.json
          cat /tmp/n.json
          node - <<'NODE'
          const d=require('/tmp/n.json'),a=require('assert'),n=d.windows,ft=Number(d.zoneCounts?.FINAL_THIRD||0),box=Number(d.zoneCounts?.BOX||0);a(n>=180);a(d.uniqueShooters>=8);a(d.topShooterShare<=.30);a(ft/n>=.15);a(box/n<=.85);console.log(JSON.stringify({status:'PASS',windows:n,uniqueShooters:d.uniqueShooters,topShooterShare:d.topShooterShare,finalThirdShare:ft/n,boxShare:box/n}));
          NODE
  commit_candidate:
    if: success()
    needs: [direct,presentation,farside,carry,reality_open,nonhero]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: candidate/v051-consolidated-retest-20260823, fetch-depth: 0}
      - name: Commit pinned validated candidate
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "$PATCH_URL" -o /tmp/a.py
          python /tmp/a.py
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html');s=p.read_text();s=s.replace('Match Engine User Test V0.5','Match Engine User Test V0.5.1').replace('매치엔진 사용자 테스트 V0.5','매치엔진 사용자 테스트 V0.5.1').replace('USER MATCH TEST <strong>V0.5</strong>','USER MATCH TEST <strong>V0.5.1</strong>');p.write_text(s)
          PY
          mkdir -p .flr/qa-results
          cat > .flr/qa-results/V051_CONSOLIDATED_RETEST.json <<'JSON'
          {"schemaVersion":"FLR_V051_CONSOLIDATED_RETEST_1.2","status":"PASS_FOR_USER_RETEST","patchCommit":"4c39a9a37087a65c6a0ca1e945ac48f78303d4b3","priorFullDirectRun":32634469897,"priorFullDirectPass":true,"scope":["four new V0.5 reports","lofted through-pass","scan jitter","pass-to-teammate goal celebration","offside readability","set-piece continuity","far-side committed runner","carry cadence","dead-clock presentation","nonhero shot diversity","physical-context attacking decision"],"gates":{"direct":true,"presentation":true,"farside":true,"carry":true,"realityOpen":true,"nonhero":true},"futureOutcomePrecomputed":false,"userChoiceAuthorityPreserved":true}
          JSON
          node --check step71_hybrid_v06_ui.js && node --check runtime/protagonist_match_controller.js && node --check live_hybrid_session_v02.js && node --check runtime/continuous_match_core.js
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html step71_hybrid_v06_ui.js runtime/protagonist_match_controller.js live_hybrid_session_v02.js runtime/continuous_match_core.js .flr/qa-results/V051_CONSOLIDATED_RETEST.json
          git commit -m 'Prepare User Match Test V0.5.1 consolidated retest'
          git push origin HEAD:candidate/v051-consolidated-retest-20260823
