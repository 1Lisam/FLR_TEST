name: FLR R23 Defence Stability Fix
on:
  push:
    branches: [r23-r22-report-fixes]
    paths: ['.github/workflows/flr-r23-defence-stability-fix.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {ref: r23-r22-report-fixes}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Keep wide-run ownership and CB semantic task
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('runtime/tactical_movement.js');s=p.read_text(encoding='utf-8')
          old="  for(const fb of outfield(m,team).filter(p=>p.role==='FB')){\n    if(fb.id===lock.pressId)continue;\n    const sg=sideSign(fb.slot),wf=attackers.map(a=>({a,l:worldToLocal(team,a.x,a.y)})).filter(o=>(o.l.y<34?-1:1)===sg&&o.l.x<=52).sort((a,b)=>a.l.x-b.l.x)[0];\n    if(!wf)continue;"
          new="  for(const fb of outfield(m,team).filter(p=>p.role==='FB')){\n    const sg=sideSign(fb.slot),wf=attackers.map(a=>({a,l:worldToLocal(team,a.x,a.y)})).filter(o=>(o.l.y<34?-1:1)===sg&&o.l.x<=52).sort((a,b)=>a.l.x-b.l.x)[0];\n    if(!wf)continue;\n    // A full-back may press the actual wide carrier, but must not abandon a live same-side winger\n    // merely because the generic press lock briefly nominated him against another ball carrier.\n    if(fb.id===lock.pressId&&owner.id===wf.a.id)continue;"
          if s.count(old)!=1: raise SystemExit(f'FB responsibility block expected once, found {s.count(old)}')
          s=s.replace(old,new)
          old2="      const familyChanged=prev.family!==family,markChanged=prev.markTargetId!==proposed.markTargetId;\n      const holdActive=m.time<Number(prev.minUntil||0);\n      if(holdActive&&!semanticEmergency&&(familyChanged||(markChanged&&oldMarkRelevant))){p.tacticalTask=prev.task;p.action=prev.action;p.markTargetId=prev.markTargetId||null;}"
          new2="      const familyChanged=prev.family!==family,markChanged=prev.markTargetId!==proposed.markTargetId,taskChanged=prev.task!==proposed.task;\n      const holdActive=m.time<Number(prev.minUntil||0);\n      if(holdActive&&!semanticEmergency&&(familyChanged||(markChanged&&oldMarkRelevant)||(p.role==='CB'&&taskChanged))){p.tacticalTask=prev.task;p.action=prev.action;p.markTargetId=prev.markTargetId||null;}"
          if s.count(old2)!=1: raise SystemExit(f'CB stability block expected once, found {s.count(old2)}')
          s=s.replace(old2,new2)
          p.write_text(s,encoding='utf-8')
          PY
          node --check runtime/tactical_movement.js
          grep -q "owner.id===wf.a.id" runtime/tactical_movement.js
          grep -q "p.role==='CB'&&taskChanged" runtime/tactical_movement.js
      - name: Commit and clean diagnostic workflow
        run: |
          rm -f .github/workflows/flr-r23-defence-stability-fix.yml .github/workflows/flr-r23-qa-finaldiag.yml
          git config user.name 'FLR R23 Candidate Bot'; git config user.email 'actions@users.noreply.github.com'; git add -A; git commit -m 'candidate: stabilize wide runner and CB responsibility'; git push origin HEAD:r23-r22-report-fixes
