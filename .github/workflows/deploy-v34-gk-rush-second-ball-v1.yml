name: deploy-v34-gk-rush-chase-pace-v4
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-v34-gk-rush-second-ball-v1.yml'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gated chase pace deploy
        shell: bash
        run: bash .github/scripts/deploy-v34-gk-rush-chase-pace-v2.sh
