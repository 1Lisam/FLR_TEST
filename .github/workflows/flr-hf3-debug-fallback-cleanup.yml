name: FLR HF3 Debug Fallback Cleanup

on:
  push:
    branches: [main]
    paths: ['.flr/hf3-debug-fallback-cleanup.json']

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Replace stale fallback key
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('step71_hybrid_v06_ui.js');s=p.read_text(encoding='utf-8')
          old1="return sel?.value||'BALL_DEPTH_SYNC'"
          new1="return sel?.value||'DEFENSIVE_ROLE_STABILITY'"
          old2="DEV_RECENT_GUIDES[key]||DEV_RECENT_GUIDES.BALL_DEPTH_SYNC"
          new2="DEV_RECENT_GUIDES[key]||DEV_RECENT_GUIDES.DEFENSIVE_ROLE_STABILITY"
          for old,new in [(old1,new1),(old2,new2)]:
              if s.count(old)!=1: raise SystemExit(f'fallback anchor count={s.count(old)} {old}')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check step71_hybrid_v06_ui.js
          ! grep -q "DEV_RECENT_GUIDES.BALL_DEPTH_SYNC" step71_hybrid_v06_ui.js
      - name: Commit and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FLR HF3 Debug Panel Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add step71_hybrid_v06_ui.js
          git rm -f .flr/hf3-debug-fallback-cleanup.json .github/workflows/flr-hf3-debug-fallback-cleanup.yml
          git commit -m 'Clean stale HF3 debug fallback key'
          git pull --rebase origin main
          git push origin HEAD:main
