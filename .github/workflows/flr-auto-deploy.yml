name: FLR validated TT auto deploy

on:
  push:
    branches:
      - automation/tt-deploy
    paths:
      - '.flr/deploy.json'

permissions:
  contents: write

concurrency:
  group: flr-validated-tt-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout incoming payload
        uses: actions/checkout@v4
        with:
          ref: automation/tt-deploy
          path: _incoming
          fetch-depth: 1

      - name: Validate deploy metadata
        shell: bash
        run: |
          set -euo pipefail
          test -f _incoming/.flr/deploy.json
          python - <<'PY'
          import json, pathlib, subprocess
          m=json.loads(pathlib.Path('_incoming/.flr/deploy.json').read_text(encoding='utf-8'))
          head=subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          if head != m['baseCommit']:
              raise SystemExit(f"BASE_COMMIT_MISMATCH expected={m['baseCommit']} actual={head}")
          if m.get('validationStatus') != 'PASS_FOR_USER_VISUAL_RETEST':
              raise SystemExit('VALIDATION_STATUS_NOT_PASS')
          if m.get('step79Started') is not False:
              raise SystemExit('STEP79_MUST_REMAIN_FALSE')
          if not m.get('changedFiles'):
              raise SystemExit('CHANGED_FILES_EMPTY')
          if not m.get('patchSha256') and not m.get('assembledFiles') and not m.get('base64TarGz'):
              raise SystemExit('NO_DEPLOY_PAYLOAD')
          pathlib.Path('/tmp/flr_deploy.json').write_text(json.dumps(m), encoding='utf-8')
          print(f"Validated {m['fromBuild']} -> {m['toBuild']}")
          PY

      - name: Apply validated payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, io, json, pathlib, subprocess, tarfile
          m=json.load(open('/tmp/flr_deploy.json'))
          if m.get('patchSha256'):
              parts=sorted(pathlib.Path('_incoming/.flr').glob('incoming.patch.part*'))
              if not parts:
                  raise SystemExit('PATCH_PARTS_MISSING')
              data=b''.join(p.read_bytes() for p in parts)
              actual=hashlib.sha256(data).hexdigest()
              if actual != m['patchSha256']:
                  raise SystemExit(f"PATCH_SHA_MISMATCH expected={m['patchSha256']} actual={actual}")
              patch=pathlib.Path('/tmp/incoming.patch')
              patch.write_bytes(data)
              subprocess.check_call(['git','apply','--check',str(patch)])
              subprocess.check_call(['git','apply',str(patch)])
          for spec in m.get('assembledFiles', []):
              dest=pathlib.Path(spec['path'])
              parts=[pathlib.Path('_incoming')/x for x in spec['parts']]
              missing=[str(p) for p in parts if not p.is_file()]
              if missing:
                  raise SystemExit('ASSEMBLED_PART_MISSING:'+','.join(missing))
              data=b''.join(p.read_bytes() for p in parts)
              actual=hashlib.sha256(data).hexdigest()
              if actual != spec['sha256']:
                  raise SystemExit(f"ASSEMBLED_SHA_MISMATCH path={dest} expected={spec['sha256']} actual={actual}")
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(data)
              print(f"Assembled {dest} bytes={len(data)} sha256={actual}")
          if m.get('base64TarGz'):
              spec=m['base64TarGz']
              root=pathlib.Path('_incoming')
              def read_parts(names):
                  paths=[root/x for x in names]
                  absent=[str(p) for p in paths if not p.is_file()]
                  if absent:
                      raise SystemExit('ARCHIVE_PART_MISSING:'+','.join(absent))
                  return b''.join(p.read_bytes() for p in paths)
              head=read_parts(spec['headParts'])
              bridge=read_parts(spec['bridgeParts'])
              middle=read_parts(spec['middleParts'])
              split=int(spec['bridgeSplit'])
              if split < 0 or split > len(bridge):
                  raise SystemExit('ARCHIVE_BRIDGE_SPLIT_INVALID')
              encoded=head + bridge[:split] + middle + bridge[split:]
              try:
                  data=base64.b64decode(encoded, validate=True)
              except Exception as exc:
                  raise SystemExit(f'ARCHIVE_BASE64_INVALID:{exc}')
              actual=hashlib.sha256(data).hexdigest()
              if actual != spec['sha256']:
                  raise SystemExit(f"ARCHIVE_SHA_MISMATCH expected={spec['sha256']} actual={actual}")
              expected=set(m['changedFiles'])
              with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as tf:
                  members=tf.getmembers()
                  files=[]
                  normalized={}
                  for member in members:
                      name=member.name
                      while name.startswith('./'):
                          name=name[2:]
                      if not name:
                          continue
                      pp=pathlib.PurePosixPath(name)
                      if pp.is_absolute() or '..' in pp.parts:
                          raise SystemExit(f'ARCHIVE_UNSAFE_PATH:{name}')
                      if member.isdir():
                          continue
                      if not member.isfile():
                          raise SystemExit(f'ARCHIVE_NONREGULAR:{name}')
                      files.append(name)
                      normalized[member.name]=name
                  if set(files) != expected or len(files) != len(expected):
                      raise SystemExit(f'ARCHIVE_MEMBER_MISMATCH expected={sorted(expected)} actual={sorted(files)}')
                  for member in members:
                      if member.name not in normalized:
                          continue
                      source=tf.extractfile(member)
                      if source is None:
                          raise SystemExit(f'ARCHIVE_EXTRACT_FAILED:{member.name}')
                      dest=pathlib.Path(normalized[member.name])
                      dest.parent.mkdir(parents=True, exist_ok=True)
                      dest.write_bytes(source.read())
              print(f"Archive applied files={len(expected)} sha256={actual}")
          PY
          rm -rf _incoming

      - name: Syntax check changed JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/flr_changed_files
          import json
          for p in json.load(open('/tmp/flr_deploy.json'))['changedFiles']:
              print(p)
          PY
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if [[ "$f" == *.js && -f "$f" ]]; then node --check "$f"; fi
          done < /tmp/flr_changed_files

      - name: Commit TT build to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FLR Test Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          python - <<'PY' > /tmp/flr_stage_files
          import json
          m=json.load(open('/tmp/flr_deploy.json'))
          for p in m['changedFiles']:
              print(p)
          for p in m.get('removedFiles', []):
              print(p)
          PY
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            git add -- "$f"
          done < /tmp/flr_stage_files
          MSG=$(python -c "import json; print(json.load(open('/tmp/flr_deploy.json'))['commitMessage'])")
          git diff --cached --quiet && { echo 'NO_STAGED_CHANGES'; exit 1; }
          git commit -m "$MSG"
          git push origin main
