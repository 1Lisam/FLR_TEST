name: FLR validated TT auto deploy

on:
  push:
    branches:
      - automation/tt-deploy
    paths:
      - '.flr/deploy.json'

permissions:
  contents: write

concurrency:
  group: flr-validated-tt-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout incoming patch
        uses: actions/checkout@v4
        with:
          ref: automation/tt-deploy
          path: _incoming
          fetch-depth: 1

      - name: Decode and validate patch metadata
        shell: bash
        run: |
          set -euo pipefail
          base64 -d _incoming/.flr/incoming.patch.gz.b64 | gzip -d > /tmp/incoming.patch
          python - <<'PY'
          import hashlib, json, pathlib, subprocess
          manifest=json.loads(pathlib.Path('_incoming/.flr/deploy.json').read_text(encoding='utf-8'))
          patch=pathlib.Path('/tmp/incoming.patch').read_bytes()
          actual=hashlib.sha256(patch).hexdigest()
          if actual != manifest['patchSha256']:
              raise SystemExit(f"PATCH_SHA_MISMATCH expected={manifest['patchSha256']} actual={actual}")
          head=subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          if head != manifest['baseCommit']:
              raise SystemExit(f"BASE_COMMIT_MISMATCH expected={manifest['baseCommit']} actual={head}")
          if manifest.get('validationStatus') != 'PASS_FOR_USER_VISUAL_RETEST':
              raise SystemExit('VALIDATION_STATUS_NOT_PASS')
          if manifest.get('step79Started') is not False:
              raise SystemExit('STEP79_MUST_REMAIN_FALSE')
          if not manifest.get('changedFiles'):
              raise SystemExit('CHANGED_FILES_EMPTY')
          pathlib.Path('/tmp/flr_deploy.json').write_text(json.dumps(manifest), encoding='utf-8')
          print(f"Validated {manifest['fromBuild']} -> {manifest['toBuild']}")
          PY

      - name: Apply validated patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/incoming.patch
          git apply /tmp/incoming.patch
          rm -rf _incoming

      - name: Syntax check changed JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/flr_changed_files
          import json
          for p in json.load(open('/tmp/flr_deploy.json'))['changedFiles']:
              print(p)
          PY
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if [[ "$f" == *.js && -f "$f" ]]; then node --check "$f"; fi
          done < /tmp/flr_changed_files

      - name: Commit TT build to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FLR Test Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          python - <<'PY' > /tmp/flr_stage_files
          import json
          m=json.load(open('/tmp/flr_deploy.json'))
          for p in m['changedFiles']:
              print(p)
          for p in m.get('removedFiles', []):
              print(p)
          PY
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            git add -- "$f"
          done < /tmp/flr_stage_files
          MSG=$(python -c "import json; print(json.load(open('/tmp/flr_deploy.json'))['commitMessage'])")
          git diff --cached --quiet && { echo 'NO_STAGED_CHANGES'; exit 1; }
          git commit -m "$MSG"
          git push origin main
