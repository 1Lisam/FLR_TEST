name: FLR HF2 Secret And Summary Audit

on:
  push:
    branches: [main]
    paths:
      - '.flr/hf2-secret-summary-audit-request.json'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Query Worker secret names only
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          cd bug-report-worker
          npx --yes wrangler@latest secret list --name flr-bug-reporter > /tmp/flr_secret_list.txt 2> /tmp/flr_secret_list.err
          rc=$?
          cd ..
          printf '%s' "$rc" > /tmp/flr_secret_rc.txt
          exit 0

      - name: Build compact report summary and secret diagnosis
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re
          from pathlib import Path
          d=json.load(open('.flr/hf2-user-fail-deep-audit.json',encoding='utf-8'))
          out=[]
          for r in d.get('reports',[]):
            b=r.get('boundary') or {}; ss=b.get('stateSnapshot') or {}; fm=r.get('frameMetrics') or {}
            slots=fm.get('slots') or {}
            keep_slots={k:v for k,v in slots.items() if k in {'GK','LB','LCB','RCB','RB','LCM','CM','RCM','LW','ST','RW'} or k.startswith('H-') or k.startswith('A-')}
            out.append({
              'reportId':r.get('reportId'),
              'description':r.get('description'),
              'seeds':r.get('seeds'),
              'currentReportScope':r.get('currentReportScope'),
              'futureOutcomePrecomputed':r.get('futureOutcomePrecomputed'),
              'selectedChoice':r.get('selectedChoice'),
              'actualResult':r.get('actualResult'),
              'boundary':{
                'id':b.get('id'),'type':b.get('type'),'sceneId':b.get('sceneId'),'atSecond':b.get('atSecond'),'reason':b.get('reason'),'heroPlayerId':b.get('heroPlayerId'),'heroRole':b.get('heroRole'),'heroTeam':b.get('heroTeam'),
                'snapshot':{'second':ss.get('second'),'possession':ss.get('possession'),'zone':ss.get('zone'),'phase':ss.get('phase'),'danger':ss.get('danger'),'ball':ss.get('ball'),'structure':ss.get('structure')}
              },
              'frameMetrics':{
                'count':fm.get('count'),'firstTime':fm.get('firstTime'),'lastTime':fm.get('lastTime'),'minOpponentDistance':fm.get('minOpponentDistance'),'minSameTeamDistance':fm.get('minSameTeamDistance'),'maxPlayersWithin3mOfBall':fm.get('maxPlayersWithin3mOfBall'),'longestControlledOwnerFreezeNearOpponentSeconds':fm.get('longestControlledOwnerFreezeNearOpponentSeconds'),'topLateralJitter':fm.get('topLateralJitter'),'slots':keep_slots
              },
              'events':r.get('events'),
              'previousPresent':r.get('previousPresent')
            })
          rc=int(Path('/tmp/flr_secret_rc.txt').read_text() or '1')
          txt=Path('/tmp/flr_secret_list.txt').read_text(encoding='utf-8',errors='replace') if Path('/tmp/flr_secret_list.txt').exists() else ''
          err=Path('/tmp/flr_secret_list.err').read_text(encoding='utf-8',errors='replace') if Path('/tmp/flr_secret_list.err').exists() else ''
          names=sorted(set(re.findall(r'\b[A-Z][A-Z0-9_]{2,}\b',txt)))
          secret={'schemaVersion':'FLR_HF2_GITHUB_ISSUE_SECRET_AUDIT_1.0','queryExitCode':rc,'querySucceeded':rc==0,'githubIssueTokenPresent':('GITHUB_ISSUE_TOKEN' in txt),'secretNames':names,'errorExcerpt':err[-1200:] if rc!=0 else None}
          Path('/tmp/hf2-user-fail-summary.json').write_text(json.dumps({'schemaVersion':'FLR_HF2_USER_FAIL_COMPACT_SUMMARY_1.0','status':'PASS','reportCount':len(out),'reports':out},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          Path('/tmp/hf2-github-issue-secret-audit.json').write_text(json.dumps(secret,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(secret,ensure_ascii=False))
          PY

      - name: Persist audit results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FLR HF2 Audit Bot'
          git config user.email 'actions@users.noreply.github.com'
          git reset --hard HEAD
          git pull --rebase origin main || git reset --hard origin/main
          cp /tmp/hf2-user-fail-summary.json .flr/hf2-user-fail-summary.json
          cp /tmp/hf2-github-issue-secret-audit.json .flr/hf2-github-issue-secret-audit.json
          git add .flr/hf2-user-fail-summary.json .flr/hf2-github-issue-secret-audit.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record HF2 report summary and issue secret audit'
          git push origin HEAD:main
