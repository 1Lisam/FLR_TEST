name: Deploy V34 GK touch deflection visual fixtures

on:
  push:
    branches: [main]
    paths: [.github/workflows/deploy-v34-gk-touch-deflection-v1.yml]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply issue 56 live touch deflection TEST_ONLY
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # Runtime: replace issue #51 future-named contact with issue #56 neutral live continuation.
          p=Path('runtime/continuous_match_core.js')
          s=p.read_text()
          start_marker='  // TEST_ONLY issue #51: insufficient glove touch resolved only at live contact.\n'
          end_marker='  const dangerEligible=dangerBand>=4.8;\n'
          if s.count(start_marker)!=1: raise SystemExit(f'touch start marker count={s.count(start_marker)}')
          start=s.index(start_marker)
          end=s.index(end_marker,start)
          new_touch="""  // TEST_ONLY issue #56: neutral live glove deflection. No future GOAL/CORNER is cached here.
          {
            const incomingLocal={x:gk.team===HOME?(b.vx||0):-(b.vx||0),y:gk.team===HOME?(b.vy||0):-(b.vy||0)},
              touchEligible=incomingLocal.x<0&&speed>=16&&speed<=28&&offset<=3.5&&dangerBand>=2.0&&dangerBand<4.8,
              touchRoll=(hash32(`${key}|TOUCH_DEFLECT_CONTACT`)%1000000)/1000000,
              touchChance=touchEligible?clamp(.34+(dangerBand-2.0)*.045+(speed-16)*.012,.34,.58):0;
            if(touchEligible&&touchRoll<touchChance){
              const incomingUnit=norm(incomingLocal.x,incomingLocal.y),contactLocal={x:contactStage.sweep.x,y:contactStage.sweep.y},gkLocal=worldToLocal(gk.team,gk.x,gk.y),
                contactOffset=contactLocal.y-gkLocal.y,noise=(((hash32(`${key}|TOUCH_DEFLECT_NOISE`)%10001)/10000)-.5)*.28,
                lateralImpulse=clamp(contactOffset*3.2+incomingUnit.y*speed*.10+noise,-3.8,3.8),
                postLocalSpeed=clamp(speed*.52,7.0,14.0),postLocalVx=postLocalSpeed*incomingUnit.x,
                postLocalVy=postLocalSpeed*(incomingUnit.y*.94)+lateralImpulse,
                postWorld=gk.team===HOME?{x:postLocalVx,y:postLocalVy}:{x:-postLocalVx,y:-postLocalVy},ballVelocityBefore={x:b.vx,y:b.vy};
              b.npcGkResolved='TOUCH_CONTINUE';b.gkParryReach=null;b.lastTouchTeam=gk.team;b.lastTouchPlayer=gk.id;m.lastTouchTeam=gk.team;m.lastTouchPlayer=gk.id;b.noCaptureIds=[gk.id];b.noCaptureUntil=.70;b.vx=postWorld.x;b.vy=postWorld.y;
              gk.action='GK_SAVE_RECOVER';gk.tacticalTask='GK_SAVE_RECOVER';gk.sprint=false;gk.tx=gk.x;gk.ty=gk.y;gk.nextThink=m.time+.55;
              event(m,'TOUCH_DEFLECT',`${subjectName(gk.name)} 장갑에 맞고 공의 궤도가 바뀌어 계속 살아 있습니다.`,{npcGkOutcome:'TOUCH_CONTINUE',npcGkPhase:2,sharedContactStage:{ready:contactStage.contactReady,contactGap:Number(contactStage.sweep.distance.toFixed(3)),envelope:Number(contactStage.contactEnvelope.toFixed(3)),approachStartEnvelope:contactStage.approachStartEnvelope,reachDisplacement:contactStage.reachDisplacement,reachState:contactStage.reachState,previous:{x:prev?.x??b.x,y:prev?.y??b.y},current:{x:b.x,y:b.y},gkBefore:contactStage.gkBefore,gkAfter:contactStage.gkAfter,presentationReach:contactStage.presentationReach},ballVelocityBefore,ballVelocityAfter:{x:b.vx,y:b.vy},preSpeed:speed,postSpeed:Math.hypot(b.vx,b.vy),localVelocityBefore:{x:incomingLocal.x,y:incomingLocal.y},localVelocityAfter:{x:postLocalVx,y:postLocalVy},contactOffset:Number(contactOffset.toFixed(3)),lateralImpulse:Number(lateralImpulse.toFixed(3)),ballState:{mode:b.mode,kind:b.kind,ownerId:b.ownerId||null,intendedReceiverId:b.intendedReceiverId||null,lastTouchTeam:b.lastTouchTeam,lastTouchPlayer:b.lastTouchPlayer},scoreAtContact:{HOME:m.score.HOME,AWAY:m.score.AWAY},goalsAtContact:m.stats.goals,touchRoll:Number(touchRoll.toFixed(6)),touchChance:Number(touchChance.toFixed(6)),touchBand:Number(dangerBand.toFixed(3))});
              return{outcome:'TOUCH_CONTINUE',routine:false,sharedContactStage:contactStage,ballVelocityBefore,ballVelocityAfter:{x:b.vx,y:b.vy},touchRoll,touchChance};
            }
          }
          """
          s=s[:start]+new_touch+s[end:]

          # Issue #56 auxiliary live-contact protections. Apply only from the known pre-#56 form.
          old="    if(isShot&&p.role==='GK'){\n      const saveSet=(p.action==='GK_SAVE_SET'||p.tacticalTask==='GK_SAVE_SET');"
          new="    if(isShot&&p.role==='GK'){\n      // Keep the shared multi-frame reach authoritative until final contact.\n      if(m.ball.gkParryReach&&shotSweep.distance>1.45)continue;\n      const saveSet=(p.action==='GK_SAVE_SET'||p.tacticalTask==='GK_SAVE_SET');"
          if old in s: s=s.replace(old,new,1)
          elif new not in s: raise SystemExit('GK capture guard anchor missing')

          old="      const gp=worldToLocal(p.team,p.x,p.y),bp=worldToLocal(p.team,m.ball.x,m.ball.y),dx=Math.abs(bp.x-gp.x),dy=Math.abs(bp.y-gp.y);"
          new="      const gp=worldToLocal(p.team,p.x,p.y),bp=worldToLocal(p.team,m.ball.x,m.ball.y),sweep=shotSweep||goalkeeperShotContactSweep(m,p,contactPrev||{x:m.ball.x,y:m.ball.y}),dx=sweep.dx,dy=sweep.dy;"
          if old in s: s=s.replace(old,new,1)
          elif new not in s: raise SystemExit('GK sweep anchor missing')

          old="      const lateralDive=saveSet&&dive.reacted&&m.ball.onTarget!==false&&dx<=depthReach&&dy<=lateralDiveReach&&((dx/depthReach)*(dx/depthReach)+(dy/lateralDiveReach)*(dy/lateralDiveReach)<=1.0);"
          new="      const lateralDive=(saveSet||dive.reacted)&&m.ball.onTarget!==false&&dx<=depthReach&&dy<=lateralDiveReach&&((dx/depthReach)*(dx/depthReach)+(dy/lateralDiveReach)*(dy/lateralDiveReach)<=1.0);"
          if old in s: s=s.replace(old,new,1)
          elif new not in s: raise SystemExit('GK lateralDive anchor missing')

          old="  const prev={x:m.ball.x,y:m.ball.y};m.ball.age=(m.ball.age||0)+dt;"
          new="  const prev={x:m.ball.x,y:m.ball.y};m.ball.contactPrevAge=m.ball.age||0;m.ball.contactDt=dt;m.ball.age=(m.ball.age||0)+dt;"
          if old in s: s=s.replace(old,new,1)
          elif new not in s: raise SystemExit('contact dt anchor missing')
          p.write_text(s)

          # UI: replace one old touch-goal fixture with three issue #56 fixtures.
          p=Path('step71_hybrid_v06_ui.js');s=p.read_text()
          old=" GK_PHASE2_PLAUSIBILITY_TOUCH_GOAL:{label:'GK Phase2 · 장갑 맞고 실점',watch:'슈팅이 골키퍼에게 닿기도 전에 꺾이거나, 닿은 순간 바로 득점 처리되는지 봅니다.',normal:'정상: 실제 GK 접촉 뒤 공 속도와 방향이 조금 변하고도 FLIGHT 상태로 계속 움직이며, 이후 실제 골라인을 넘어야 GOAL이 됩니다.'},"
          new=" GK_PHASE2_PLAUSIBILITY_TOUCH_LEFT_GOAL:{label:'GK Phase2 · 장갑 굴절 좌측 실점',watch:'실제 장갑 접촉 뒤 공이 왼쪽으로 굴절하고도 살아서 골문 안으로 들어가는지 봅니다.',normal:'정상: TOUCH_DEFLECT/TOUCH_CONTINUE 후 FLIGHT/SHOT이 유지되고 나중 실제 골라인 통과가 GOAL을 만듭니다.'},\n GK_PHASE2_PLAUSIBILITY_TOUCH_RIGHT_GOAL:{label:'GK Phase2 · 장갑 굴절 우측 실점',watch:'반대 방향 접촉에서는 공이 오른쪽으로 굴절하고도 살아서 골문 안으로 들어가는지 봅니다.',normal:'정상: 접촉 위치에 따른 반대 방향 굴절 뒤 나중 골라인 통과로 GOAL이 됩니다.'},\n GK_PHASE2_PLAUSIBILITY_TOUCH_CORNER:{label:'GK Phase2 · 장갑 굴절 코너',watch:'더 큰 장갑 굴절 뒤 공이 포스트 바깥 골라인으로 나가 실제 코너킥이 되는지 봅니다.',normal:'정상: 접촉 순간 코너를 예약하지 않고 GK 마지막 터치가 기록된 살아 있는 공이 골라인 밖을 통과한 뒤 CORNER가 됩니다.'},"
          if s.count(old)!=1: raise SystemExit(f'guide old touch count={s.count(old)}')
          s=s.replace(old,new,1)

          old="const DEV_RECENT_VISIBLE_KEYS=['DEFENSIVE_ROLE_STABILITY','MARK_TARGET_STABILITY','FORMATION_CONTINUITY','GK_PHASE2_PLAUSIBILITY_CATCH','GK_PHASE2_PLAUSIBILITY_SAFE','GK_PHASE2_PLAUSIBILITY_DANGER','GK_PHASE2_PLAUSIBILITY_TOUCH_GOAL'];"
          new="const DEV_RECENT_VISIBLE_KEYS=['DEFENSIVE_ROLE_STABILITY','MARK_TARGET_STABILITY','FORMATION_CONTINUITY','GK_PHASE2_PLAUSIBILITY_CATCH','GK_PHASE2_PLAUSIBILITY_SAFE','GK_PHASE2_PLAUSIBILITY_DANGER','GK_PHASE2_PLAUSIBILITY_TOUCH_LEFT_GOAL','GK_PHASE2_PLAUSIBILITY_TOUCH_RIGHT_GOAL','GK_PHASE2_PLAUSIBILITY_TOUCH_CORNER'];"
          if s.count(old)!=1: raise SystemExit('visible keys anchor mismatch')
          s=s.replace(old,new,1)

          old=" GK_PHASE2_PLAUSIBILITY_TOUCH_GOAL:{seed:'TOUCH-GOAL-013',label:'GK Phase2 · 장갑 맞고 실점',expected:'TOUCH_GOAL',distance:18,speed:24,offset:2,gk:40,handling:40,visualStartX:83,gkX:100.5,gkY:34,exactTouchFixture:true,ballStartX:83,ballStartY:36,straightShot:true,replayRate:.75,instruction:'실제 접촉 뒤 공이 느려지고 조금 꺾인 채 살아서 움직인 다음, 나중에 골라인을 넘어 득점하는지 확인합니다.'}"
          new=" GK_PHASE2_PLAUSIBILITY_TOUCH_LEFT_GOAL:{seed:'TOUCH-GOAL-013',label:'GK Phase2 · 장갑 굴절 좌측 실점',expected:'TOUCH_CONTINUE',expectedTerminal:'GOAL',distance:18,speed:24,offset:-.55,gk:40,handling:40,visualStartX:83,gkX:100.5,gkY:34,exactTouchFixture:true,ballStartX:83,ballStartY:33.45,straightShot:true,replayRate:.75,instruction:'장갑 접촉 뒤 왼쪽 굴절 → 공이 계속 살아서 이동 → 실제 골라인 통과 뒤 GOAL인지 확인합니다.'},\n GK_PHASE2_PLAUSIBILITY_TOUCH_RIGHT_GOAL:{seed:'TOUCH-GOAL-086',label:'GK Phase2 · 장갑 굴절 우측 실점',expected:'TOUCH_CONTINUE',expectedTerminal:'GOAL',distance:19,speed:23,offset:.55,gk:40,handling:40,visualStartX:83,gkX:100.5,gkY:34,exactTouchFixture:true,ballStartX:83,ballStartY:34.55,straightShot:true,replayRate:.75,instruction:'장갑 접촉 뒤 오른쪽 굴절 → 공이 계속 살아서 이동 → 실제 골라인 통과 뒤 GOAL인지 확인합니다.'},\n GK_PHASE2_PLAUSIBILITY_TOUCH_CORNER:{seed:'TOUCH-GOAL-013',label:'GK Phase2 · 장갑 굴절 코너',expected:'TOUCH_CONTINUE',expectedTerminal:'CORNER',distance:19,speed:23,offset:2.5,gk:40,handling:40,visualStartX:83,gkX:100.5,gkY:34.5,exactTouchFixture:true,ballStartX:83,ballStartY:36.5,straightShot:true,replayRate:.75,instruction:'장갑 접촉 뒤 큰 측면 굴절 → 포스트 바깥 골라인 통과 → GK 마지막 터치에 의해 CORNER인지 확인합니다.'}"
          if s.count(old)!=1: raise SystemExit(f'case old touch count={s.count(old)}')
          s=s.replace(old,new,1)

          old="Object.assign(gk,{x:c.gkX??99.5,y:gkY,tx:99.5,ty:gkY,vx:0,vy:0,bodyAngle:Math.PI,action:'GK_SAVE_SET',tacticalTask:'GK_SAVE_SET',nextThink:9999});"
          new="Object.assign(gk,{x:c.gkX??99.5,y:gkY,tx:c.exactTouchFixture?(c.gkX??99.5):99.5,ty:gkY,vx:0,vy:0,bodyAngle:Math.PI,action:'GK_SAVE_SET',tacticalTask:'GK_SAVE_SET',nextThink:9999});"
          if s.count(old)!=1: raise SystemExit('GK UI placement anchor mismatch')
          s=s.replace(old,new,1)

          old="B.executeShot(m,st,c.exactTouchFixture?'TOUCH_GOAL_FORCED':'DEV_GK_PHASE2',{releaseNow:true,decisionOrientation:{turningRequired:false,backToGoal:false,facingAlignment:1,bodyAngleDiff:0}});"
          new="B.executeShot(m,st,c.exactTouchFixture?'TOUCH_DEFLECT_FORCED':'DEV_GK_PHASE2',{releaseNow:true,decisionOrientation:{turningRequired:false,backToGoal:false,facingAlignment:1,bodyAngleDiff:0}});"
          if s.count(old)!=1: raise SystemExit('forced action anchor mismatch')
          s=s.replace(old,new,1)

          old="slow=['GK_PHASE2_PLAUSIBILITY_DANGER','GK_PHASE2_PLAUSIBILITY_TOUCH_GOAL'].includes(developerScenarioLast.key)"
          new="slow=['GK_PHASE2_PLAUSIBILITY_DANGER','GK_PHASE2_PLAUSIBILITY_TOUCH_LEFT_GOAL','GK_PHASE2_PLAUSIBILITY_TOUCH_RIGHT_GOAL','GK_PHASE2_PLAUSIBILITY_TOUCH_CORNER'].includes(developerScenarioLast.key)"
          if s.count(old)!=1: raise SystemExit('replay slow anchor mismatch')
          s=s.replace(old,new,1)
          p.write_text(s)

          # Index: expose 9 total debug items.
          p=Path('index.html');s=p.read_text()
          reps=[
            ('최근 핵심 장면 검증 · 7개 항목','최근 핵심 장면 검증 · 9개 항목'),
            ('<b>4~7번은 V34 GK Phase2 TEST_ONLY</b> 강제 장면입니다. 4번은 쉬운 정면 슛 캐칭, 5번은 측면 안전 패링, 6번은 어려운 슛 뒤 위험한 전방 세컨드볼, 7번은 실제 장갑 접촉 뒤에도 공이 살아서 골라인을 넘어가는 TOUCH_GOAL을 실제 resolver로 재현합니다.','<b>4~9번은 V34 GK Phase2 TEST_ONLY</b> 강제 장면입니다. 4번은 쉬운 정면 슛 캐칭, 5번은 측면 안전 패링, 6번은 위험한 세컨드볼, 7번은 장갑 맞고 왼쪽 굴절 후 실점, 8번은 반대 방향 굴절 후 실점, 9번은 장갑 굴절 뒤 포스트 바깥으로 나가 코너킥이 되는 live continuation을 실제 resolver로 재현합니다.'),
            ('<select id="heroRecentFixSelect" size="7"','<select id="heroRecentFixSelect" size="9"'),
            ('<option value="GK_PHASE2_PLAUSIBILITY_TOUCH_GOAL">7. GK Phase2 · 장갑 맞고 실점</option></select>','<option value="GK_PHASE2_PLAUSIBILITY_TOUCH_LEFT_GOAL">7. GK Phase2 · 장갑 굴절 좌측 실점</option><option value="GK_PHASE2_PLAUSIBILITY_TOUCH_RIGHT_GOAL">8. GK Phase2 · 장갑 굴절 우측 실점</option><option value="GK_PHASE2_PLAUSIBILITY_TOUCH_CORNER">9. GK Phase2 · 장갑 굴절 코너</option></select>')
          ]
          for old,new in reps:
            if s.count(old)!=1: raise SystemExit(f'index anchor count={s.count(old)} for {old[:35]}')
            s=s.replace(old,new,1)
          p.write_text(s)
          PY

          node --check runtime/continuous_match_core.js
          node --check step71_hybrid_v06_ui.js
          grep -q "npcGkResolved='TOUCH_CONTINUE'" runtime/continuous_match_core.js
          grep -q "event(m,'TOUCH_DEFLECT'" runtime/continuous_match_core.js
          grep -q '9. GK Phase2 · 장갑 굴절 코너' index.html

          # Deterministic public regression + issue #56 causal fixtures.
          node - <<'NODE'
          const E=require('./runtime/continuous_match_core.js'),B=E.choiceActionBridge();
          function profile(m,gk,g,h){m.playerAbilityProfiles[gk.id]={reaction:g,gk_positioning:g,diving:g,handling:h};}
          function normalize(m){for(const p of m.players){p.hasBall=false;p.nextThink=9999;p.vx=p.vy=0;if(p.role!=='GK'){p.x=70;p.y=7;p.tx=p.x;p.ty=p.y;}}}
          function touchSetup(c){const m=E.createMatch(c.seed,{dt:.05});m.time=100;m.restart=null;m.phase='OPEN_PLAY';m.nextShape=999;m.events=[];m.score={HOME:0,AWAY:0};m.possession='HOME';m.playerAbilityProfiles={};const st=m.playersById['H-ST'],gk=m.playersById['A-GK'];normalize(m);Object.assign(st,{x:83,y:34,tx:83,ty:34,bodyAngle:0,faceTargetAngle:0,nextThink:9999});Object.assign(gk,{x:100.5,y:c.gkY,tx:100.5,ty:c.gkY,vx:0,vy:0,action:'GK_SAVE_SET',tacticalTask:'GK_SAVE_SET',nextThink:9999});profile(m,gk,40,40);B.setControlled(m,st);m.ball.x=83;B.executeShot(m,st,'TOUCH_DEFLECT_FORCED',{releaseNow:true});Object.assign(m.ball,{x:83,y:34+c.offset,z:.08,vx:c.speed,vy:0,vz:0,age:0,originX:83,originY:34,targetX:105,targetY:34+c.offset,shotTargetY:34+c.offset,shotTeam:'HOME',lastTouchTeam:'HOME',lastTouchPlayer:'H-ST',onTarget:true,shotDistance:c.distance,shotOneVOne:false,shotClearKeeperChance:false,airborne:false,strikeStyle:'POWER',arcProfile:null,npcGkResolved:null});m.lastTouchTeam='HOME';m.lastTouchPlayer='H-ST';return{m,gk};}
          function finishTouch(c){const {m,gk}=touchSetup(c);let contact=null,terminal=null,restartAtContact=null;for(let i=0;i<220;i++){E.step(m,.05);if(!contact){const e=[...m.events].reverse().find(e=>e&&e.type==='TOUCH_DEFLECT');if(e){contact={t:e.t,outcome:e.npcGkOutcome,score:{...m.score},mode:m.ball.mode,kind:m.ball.kind,lastTouchTeam:m.ball.lastTouchTeam,lastTouchPlayer:m.ball.lastTouchPlayer,vBefore:e.ballVelocityBefore,vAfter:e.ballVelocityAfter};restartAtContact=m.restart?{...m.restart}:null;}}if(contact&&!terminal){const e=[...m.events].reverse().find(e=>e&&e.t>contact.t&&(e.type==='GOAL'||e.type==='CORNER'));if(e)terminal={t:e.t,type:e.type,score:{...m.score},restart:m.restart?.kind||null};}if(terminal)break;}return{contact,terminal,finalScore:{...m.score},restart:m.restart?.kind||null,gk:{x:gk.x,y:gk.y},restartAtContact};}
          const touches=[
            {id:'A-LEFT-GOAL',seed:'TOUCH-GOAL-013',offset:-.55,gkY:34,speed:24,distance:18,terminal:'GOAL'},
            {id:'B-RIGHT-GOAL',seed:'TOUCH-GOAL-086',offset:.55,gkY:34,speed:23,distance:19,terminal:'GOAL'},
            {id:'C-OUTSIDE-CORNER',seed:'TOUCH-GOAL-013',offset:2.5,gkY:34.5,speed:23,distance:19,terminal:'CORNER'}
          ];
