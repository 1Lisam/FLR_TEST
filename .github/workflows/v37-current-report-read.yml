name: V37 Current Report Read

on:
  push:
    branches: [main]
    paths:
      - '.flr/v37-current-report-read.json'

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read current V37 reports
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --max-time 30 -sS 'https://flr-bug-reporter.sikarops.workers.dev/report-list?limit=50&since=2026-09-01T06:00:00Z' -o /tmp/report-list.json
          python - <<'PY'
          import json, subprocess, tempfile, os
          data=json.load(open('/tmp/report-list.json',encoding='utf-8'))
          print('REPORT_LIST_COUNT', data.get('count'))
          print('REPORT_LIST_BEGIN')
          print(json.dumps(data,ensure_ascii=False,indent=2))
          print('REPORT_LIST_END')
          terms=('seed','scenario','boundary','choice','target','canon','future','hero','ball','score','phase','event','pending','forced','report','match','frame','entry','exit','shot','keeper','gk','cross','corner','free','setpiece','set_piece')
          def slim(v,depth=0):
              if depth>3:return '<depth>'
              if isinstance(v,dict):
                  keep={}
                  for k,val in v.items():
                      if depth==0 or any(t in k.lower() for t in terms): keep[k]=slim(val,depth+1)
                  return keep
              if isinstance(v,list):
                  if len(v)<=24:return [slim(x,depth+1) for x in v]
                  return [slim(x,depth+1) for x in v[:10]]+['<%d more>'%(len(v)-20)]+[slim(x,depth+1) for x in v[-10:]]
              if isinstance(v,str) and len(v)>1000:return v[:1000]+'<truncated>'
              return v
          for i,rep in enumerate(data.get('reports',[]),1):
              out={'index':i,**{k:rep.get(k) for k in ('reportId','createdAt','build','category','priority','description','summary','hasDebug','jsonUrl')}}
              url=rep.get('jsonUrl')
              if url:
                  p=subprocess.run(['curl','--fail','--max-time','30','-sS',url],capture_output=True,text=True)
                  if p.returncode==0:
                      try:
                          dbg=json.loads(p.stdout)
                          out['debugTopKeys']=list(dbg.keys()) if isinstance(dbg,dict) else None
                          out['debugRelevant']=slim(dbg)
                      except Exception as e: out['debugError']='json:'+repr(e)
                  else: out['debugError']='curl:'+p.stderr[-500:]
              print('REPORT_DETAIL_BEGIN',i)
              print(json.dumps(out,ensure_ascii=False,indent=2))
              print('REPORT_DETAIL_END',i)
          PY
