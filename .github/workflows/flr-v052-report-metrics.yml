name: FLR V0.5.2 Report Metrics

on:
  push:
    branches: [main]
    paths:
      - '.flr/v052-report-metrics-request.json'

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Build tiny evidence metrics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, math
          s=json.loads(pathlib.Path('.flr/current-report-inspect-status.json').read_text(encoding='utf-8'))
          R={r.get('meta',{}).get('report_id'):r for r in s.get('reports',[])}
          ids={
            'off1':'umt052-65749ef0-a4fb-420a-af16-f3cff1ebf37e','off2':'umt052-d90cd322-0396-4521-9382-0581b3e5f5f3',
            'cm':'umt052-31984cc7-cba8-4a12-9ec5-ec0d85aad37d','deep':'umt052-95ad81d7-096b-45ec-b464-d9ac2bdbffb3','lb':'umt052-33b9e4a8-7f53-4fce-93f2-fccc560faa99'}
          def bd(cur):
            b=(cur or {}).get('boundary') or {}; st=b.get('stateSnapshot') or {}; ball=st.get('ball') or {}
            return {'id':b.get('id'),'atSecond':b.get('atSecond'),'reason':b.get('reason'),'hero':b.get('heroPlayerId'),'phase':st.get('phase'),'zone':st.get('zone'),'possession':st.get('possession'),'ballOwner':ball.get('ownerId'),'ballProgress':ball.get('progress'),'ballLane':ball.get('lane')}
          def spatial(cur):
            b=(cur or {}).get('boundary') or {}; return ((((b.get('stateSnapshot') or {}).get('spatial') or {}).get('players')) or {})
          def pmini(p):
            if not p:return None
            return {k:p.get(k) for k in ['x','y','vx','vy','intentKind','intentTargetId','intentTargetX','intentTargetY','sourceTask','lastPossession'] if p.get(k) is not None}
          def fsamples(cur):
            out=[]
            for label in ['preActionSamples','postActionSamples','episodeSamples']:
              for f in (cur or {}).get(label) or []: out.append((label,f))
            return out
          def fp(f,key):
            return next((p for p in (f or {}).get('players',[]) if p.get('id')==key or p.get('slot')==key),None)
          def dist(a,b):
            try:return round(math.hypot(float(a['x'])-float(b['x']),float(a['y'])-float(b['y'])),2)
            except:return None
          out={'build':s.get('build'),'metrics':{}}
          # CM report
          r=R[ids['cm']]; cur=r.get('current') or {}; sp=spatial(cur); cm={}
          for k in ['H-LCM','H-CM','H-RCM']:
            seq=[]
            for label,f in fsamples(cur):
              p=fp(f,k); ball=(f or {}).get('ball') or {}
              if p: seq.append({'t':f.get('time'),'src':label,'x':p.get('x'),'y':p.get('y'),'dBall':dist(p,ball),'task':p.get('tacticalTask'),'action':p.get('action')})
            cm[k]={'boundaryIntent':pmini(sp.get(k)),'sampleSequence':seq}
          out['metrics']['cm_chase']={'description':r.get('meta',{}).get('description'),'boundary':bd(cur),'midfielders':cm}
          # Shape reports
          for name,rid in [('deep_start_cm',ids['deep']),('lb_gk_start',ids['lb'])]:
            r=R[rid]; cur=r.get('current') or {}; sp=spatial(cur); slots=['H-GK','H-LB','H-LCB','H-RCB','H-RB','H-LCM','H-CM','H-RCM','H-LW','H-ST','H-RW']
            entry=cur.get('entrySnapshot') or {}; last=(fsamples(cur)[-1][1] if fsamples(cur) else None)
            out['metrics'][name]={'description':r.get('meta',{}).get('description'),'boundary':bd(cur),'boundarySpatial':{k:pmini(sp.get(k)) for k in slots if sp.get(k)},'entry':{'t':entry.get('time'),'ball':entry.get('ball'),'players':{k:pmini(fp(entry,k)) for k in slots if fp(entry,k)}},'lastSample':{'t':(last or {}).get('time'),'possession':(last or {}).get('possession'),'ball':(last or {}).get('ball'),'players':{k:pmini(fp(last,k)) for k in slots if fp(last,k)}}}
          # Offside
          for name,rid in [('offside_end',ids['off1']),('offside_replay',ids['off2'])]:
            r=R[rid]; cur=r.get('current') or {}; hero=(cur.get('boundary') or {}).get('heroPlayerId')
            ev=[]
            pools=[cur.get('actualEvents') or [],(cur.get('hybridBeforeState') or {}).get('resolvedEvents') or [],(cur.get('hybridAfterState') or {}).get('resolvedEvents') or []]
            for pool in pools:
              for e in pool:
                txt=json.dumps(e,ensure_ascii=False).upper()
                if 'OFFSIDE' in txt or 'RESTART' in txt:
                  sig=json.dumps(e,sort_keys=True,ensure_ascii=False)
                  if sig not in [x[0] for x in ev]:ev.append((sig,e))
            seq=[]
            for label,f in fsamples(cur):
              p=fp(f,hero); seq.append({'src':label,'t':f.get('time'),'phase':f.get('phase'),'possession':f.get('possession'),'ball':f.get('ball'),'hero':pmini(p)})
            out['metrics'][name]={'description':r.get('meta',{}).get('description'),'boundary':bd(cur),'selectedChoice':cur.get('selectedChoice'),'actualResult':cur.get('actualResult'),'events':[x[1] for x in ev[-20:]],'sampleCounts':{k:len(cur.get(k) or []) for k in ['preActionSamples','postActionSamples','episodeSamples']},'sampleSequence':seq,'hybridAfter':cur.get('hybridAfterState')}
          pathlib.Path('.flr/v052-report-metrics.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit metrics
        shell: bash
        run: |
          git config user.name 'FLR Report Metrics Bot'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase origin main || true
          git add .flr/v052-report-metrics.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record V0.5.2 report evidence metrics'
          git push origin HEAD:main
