name: FLR one-time validated promote

on:
  push:
    branches: [main]
    paths:
      - '.flr/direct-promote-request.json'

permissions:
  contents: write

concurrency:
  group: flr-one-time-validated-promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify and apply exact validated patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib,subprocess,hashlib
          req=json.loads(pathlib.Path('.flr/direct-promote-request.json').read_text(encoding='utf-8'))
          baseline=req['validatedBaselineCommit']
          changed=req['changedFiles']
          p=subprocess.run(['git','diff','--quiet',baseline,'HEAD','--',*changed])
          if p.returncode!=0:
              raise SystemExit('VALIDATED_TARGET_FILES_DRIFTED_SINCE_QA')
          subprocess.check_call(['git','fetch','origin',req['candidateBranch']])
          data=subprocess.check_output(['git','show',f"FETCH_HEAD:{req['patchPath']}"])
          actual=hashlib.sha256(data).hexdigest()
          if actual!=req['patchSha256']:
              raise SystemExit(f"PATCH_SHA_MISMATCH expected={req['patchSha256']} actual={actual}")
          patch=pathlib.Path('/tmp/flr-validated.patch'); patch.write_bytes(data)
          subprocess.check_call(['git','apply','--check',str(patch)])
          subprocess.check_call(['git','apply',str(patch)])
          PY
      - name: Syntax check
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module --check < bug-report-worker/worker.js
          node --check live_v06_scene_authority_browser.js
      - name: Commit validated build and remove one-time controls
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FLR Test Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- .github/workflows/flr-cloudflare-bug-reporter.yml bug-report-worker/schema.sql bug-report-worker/worker.js bug-report-worker/wrangler.toml live_v06_scene_authority_browser.js
          git rm -- .github/workflows/flr-direct-validated-promote.yml .flr/direct-promote-request.json
          git commit -m 'Deploy TT-0.51 D1 reports and live entry context'
          git push origin HEAD:main
