name: FLR V0.5.2 one-off report inspect

on:
  push:
    branches: [automation/v052-report-inspect]
    paths:
      - '.github/workflows/flr-v052-report-inspect.yml'
      - '.flr/v052-report-inspect-request.json'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/v052-report-inspect
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch latest V0.5.2 attached reports
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest d1 list --json > /tmp/dbs.json
          dbid="$(python -c "import json; j=json.load(open('/tmp/dbs.json')); print(next(((r.get('uuid') or r.get('id') or '') for r in j if r.get('name')=='flr-bug-reports'),''))")"
          test -n "$dbid"
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${dbid}/query" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data '{"sql":"SELECT report_id, build, created_at, category, priority, description, size_bytes, chunk_count FROM bug_reports WHERE build = 'USER-MATCH-TEST-V0.5.2' ORDER BY created_at DESC LIMIT 10"}' \
            > /tmp/query.json
          mkdir -p /tmp/reports
          python - <<'PY' > /tmp/ids.txt
          import json
          q=json.load(open('/tmp/query.json'))
          rows=((q.get('result') or [{}])[0].get('results') or [])
          for r in rows:
              if int(r.get('chunk_count') or 0)>0:
                  print(r['report_id'])
          PY
          while IFS= read -r rid; do
            [ -n "$rid" ] || continue
            curl -fsS "https://flr-bug-reporter.sikarops.workers.dev/reports/USER-MATCH-TEST-V0.5.2/${rid}.json" > "/tmp/reports/${rid}.json"
          done < /tmp/ids.txt
      - name: Build compact diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, math
          q=json.load(open('/tmp/query.json'))
          rows=((q.get('result') or [{}])[0].get('results') or [])
          byid={r['report_id']:r for r in rows}
          def n(v, digits=3):
              try:
                  x=float(v)
                  return round(x,digits) if math.isfinite(x) else None
              except: return None
          def player(p):
              if not isinstance(p,dict): return None
              return {k:v for k,v in {
                  'id':p.get('id'),'team':p.get('team'),'slot':p.get('slot'),'role':p.get('role'),
                  'x':n(p.get('x')),'y':n(p.get('y')),'vx':n(p.get('vx')),'vy':n(p.get('vy')),
                  'speed':n(math.hypot(float(p.get('vx') or 0),float(p.get('vy') or 0))),
                  'tacticalTask':p.get('tacticalTask'),'action':p.get('action'),'markTargetId':p.get('markTargetId'),
                  'intent':p.get('intent'),'targetId':p.get('targetId')
              }.items() if v is not None}
          def frame(f):
              if not isinstance(f,dict): return None
              b=f.get('ball') or {}
              return {
                  'time':n(f.get('time')),'phase':f.get('phase'),'possession':f.get('possession'),'score':f.get('score'),
                  'ball':{k:v for k,v in {'mode':b.get('mode'),'x':n(b.get('x')),'y':n(b.get('y')),'z':n(b.get('z')),'vx':n(b.get('vx')),'vy':n(b.get('vy')),'vz':n(b.get('vz')),'ownerId':b.get('ownerId')}.items() if v is not None},
                  'players':[x for x in (player(p) for p in (f.get('players') or [])) if x]
              }
          def samples(a):
              if not isinstance(a,list) or not a:return []
              idx=sorted(set([0,len(a)//4,len(a)//2,(3*len(a))//4,len(a)-1]))
              return [frame(a[i]) for i in idx]
          def state(s):
              if not isinstance(s,dict):return None
              b=s.get('ball') or {}
              return {'second':n(s.get('second')),'phase':s.get('phase'),'possession':s.get('possession'),'score':s.get('score'),'ball':{k:v for k,v in {'mode':b.get('mode'),'x':n(b.get('x')),'y':n(b.get('y')),'z':n(b.get('z')),'ownerId':b.get('ownerId')}.items() if v is not None},'resolvedEvents':(s.get('resolvedEvents') or [])[-20:],'chain':(s.get('chain') or [])[-20:]}
          def situation(d):
              if not isinstance(d,dict):return None
              hb=d.get('hybridBefore') or {}; hr=d.get('highResolution') or {}; ha=d.get('hybridAfter') or {}
              return {
                  'reportScope':d.get('reportScope'),'keys':list(d.keys()),
                  'boundary':hb.get('boundary'),'hybridBeforeState':state(hb.get('state')),
                  'entrySnapshot':frame(hr.get('entrySnapshot')),
                  'selectedChoice':hr.get('selectedChoice'),'decision':hr.get('decision'),'actualResult':hr.get('actualResult'),
                  'actualEvents':(hr.get('actualEvents') or [])[-30:],
                  'preActionSamples':samples(hr.get('preActionFrames')),
                  'postActionSamples':samples(hr.get('postActionFrames')),
                  'episodeSamples':samples(hr.get('episodeFrames')),
                  'hybridAfterState':state(ha.get('state'))
              }
          out={'schemaVersion':'FLR_V052_REPORT_INSPECT_1.0','reports':[]}
          for p in sorted(pathlib.Path('/tmp/reports').glob('*.json')):
              d=json.load(open(p,encoding='utf-8')); rid=p.stem
              out['reports'].append({'meta':byid.get(rid,{}),'bundleContext':d.get('bugReportContext'),'scope':d.get('scope'),'current':situation(d.get('currentSituation')),'previous':situation(d.get('previousSituation'))})
          pathlib.Path('.flr/v052-user-report-inspect.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('reports',len(out['reports']))
          PY
      - name: Commit diagnostic to audit branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FLR V052 Report Inspect Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .flr/v052-user-report-inspect.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record V0.5.2 user report diagnostic'
          git push origin HEAD:automation/v052-report-inspect
