name: FLR R23 Focused Final Diagnostics
on:
  push:
    branches: [r23-r22-report-fixes]
    paths: ['.github/workflows/flr-r23-qa-finaldiag.yml']
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with: {ref: r23-r22-report-fixes}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Diagnose fullback task phases and recheck hard guards
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const path=require('path'),H=require('./live_hybrid_session_v02.js'),A=require('./live_v06_scene_authority_browser.js'),C=require('./runtime/action_candidate_engine.js'),E=require('./runtime/continuous_match_core.js');
          const rd=path.join(process.cwd(),'runtime'),mk=(k,s)=>H.createDeveloperScenario({key:k,seed:s}),hi=d=>A.seedMatch(d.boundary,{runtimeDir:rd,seed:'R23-DIAG-'+d.seed,explicitHeroChoiceRequired:true}),p=(m,id)=>m.players.find(x=>x.id===id),l=(t,q)=>t==='HOME'?{x:q.x,y:q.y}:{x:105-q.x,y:68-q.y};
          // Fullback task-stratified relation.
          const d=mk('DEFENSIVE_ROLE_STABILITY','DEV-RECENT-1787734197888-15'),h=hi(d),m=h.state.m,pairs=[['A-RB','H-LW'],['A-LB','H-RW']],z={};
          for(const[df,at]of pairs)z[df]={all:{n:0,in:0,goal:0,maxOut:0},responsible:{n:0,in:0,goal:0,maxOut:0},byTask:{},lostWhileThreat:0};
          for(let i=0;i<100;i++){E.step(m,.05);for(const[df,at]of pairs){const D=p(m,df),T=p(m,at),dl=l('AWAY',D),tl=l('AWAY',T),q=z[df],inside=Math.abs(tl.y-34)-Math.abs(dl.y-34),goal=dl.x<=tl.x+.2,task=D.tacticalTask||'NONE',responsible=D.markTargetId===at||task==='WIDE_RUN_TRACK'||task==='MARK_LANE_SCREEN';
            const add=o=>{o.n++;if(inside>=-.05)o.in++;else o.maxOut=Math.max(o.maxOut,-inside);if(goal)o.goal++;};add(q.all);q.byTask[task]??={n:0,in:0,goal:0,maxOut:0};add(q.byTask[task]);if(responsible)add(q.responsible);const threat=tl.x<=52&&Math.abs(tl.y-34)>=10;if(threat&&!responsible)q.lostWhileThreat++;}}
          const fin=o=>{if(o.n){o.insideRate=o.in/o.n;o.goalRate=o.goal/o.n;}return o};for(const q of Object.values(z)){fin(q.all);fin(q.responsible);for(const o of Object.values(q.byTask))fin(o)}console.log('R23_FB_DIAG',JSON.stringify(z,null,2));
          // CB hard improvement floor from R22 7/5, 9/4 to <=5 per CB.
          {const d3=mk('MARK_TARGET_STABILITY','DEV-RECENT-1787734342252-19'),h3=hi(d3),m3=h3.state.m,ids=['A-LCB','A-RCB'],s={};for(const id of ids){const q=p(m3,id);s[id]={task:0,mark:0,lastT:q.tacticalTask,lastM:q.markTargetId||null,maxLat:0}}for(let i=0;i<180;i++){E.step(m3,.05);const st=p(m3,'H-ST');for(const id of ids){const q=p(m3,id),o=s[id];if(q.tacticalTask!==o.lastT){o.task++;o.lastT=q.tacticalTask}if((q.markTargetId||null)!==(o.lastM||null)){o.mark++;o.lastM=q.markTargetId||null}o.maxLat=Math.max(o.maxLat,Math.abs(q.y-st.y));}}console.log('R23_CB_DIAG',JSON.stringify(s));for(const o of Object.values(s))if(o.task>5||o.mark>3)throw new Error('CB responsibility churn regression');}
          // Close-goal candidate and execution recheck.
          {const ds=mk('ST_SHOT_VISIBILITY','DEV-RECENT-1787734444350-28'),hs=hi(ds),ins=hs.P.inspect(hs.state),opts=(ins?.options||[]).map(x=>x.id||x.choice||x.key).filter(Boolean),hero=p(hs.state.m,'H-ST'),hx=l('HOME',hero).x,near=C.generate({role:'ST',localX:92.75,wide:false,pressure:2,space:2,held:.5,shot:{inBox:true,dGoal:12,centrality:0,openWindow:true,blockers:0,oneVOne:true},pass:{}}).map(x=>x.id);if(hx>=91.2&&opts.includes('CARRY'))throw new Error('exact close-goal scene exposes CARRY');if(near.includes('CARRY'))throw new Error('pure close-goal candidate exposes CARRY');const exec=[];for(const[team,id,x]of[['HOME','H-ST',92.75],['AWAY','A-ST',12.25]]){const mm=E.createMatch('R23-GUARD-'+team),B=E.choiceActionBridge(),q=B.playerById(mm,id);q.x=x;q.y=34;q.tx=x;q.ty=34;q.vx=q.vy=0;B.setControlled(mm,q,true);const before=l(team,q).x;B.executeCarry(mm,q,{userCommitted:true});const after=l(team,{x:q.tx,y:q.ty}).x;if(after<before-1e-6)throw new Error(`${team} backward carry ${before}->${after}`);exec.push({team,before,after});}console.log('R23_CARRY_GUARD',JSON.stringify({hx,opts,near,exec}));}
          // Carry continuity preservation.
          {const dc=mk('CARRY_CONTINUITY','DEV-RECENT-1787734397122-26'),hc=hi(dc),mc=hc.state.m;let back=0,n=0,stops=0,prev=null;for(let i=0;i<80;i++){E.step(mc,.05);const q=p(mc,mc.ball.ownerId);if(!q||q.team!=='HOME')continue;n++;if(q.vx<-.15)back++;const sp=Math.hypot(q.vx,q.vy);if(prev!=null&&prev>2&&sp<.25)stops++;prev=sp;}console.log('R23_CARRY_PRESERVE',JSON.stringify({n,back,stops}));if(back>Math.max(2,Math.floor(n*.08)))throw new Error('carry continuity regression');}
          console.log('R23_FINALDIAG_HARD: PASS');
          NODE
      - name: Clean workflow
        run: |
          rm -f .github/workflows/flr-r23-qa-finaldiag.yml
          git config user.name 'FLR R23 QA Bot'; git config user.email 'actions@users.noreply.github.com'; git add -A; git commit -m 'chore: remove temporary R23 final diagnostic workflow'; git push origin HEAD:r23-r22-report-fixes
