name: FLR R21 Calculated State Apply V2

on:
  push:
    branches: [r21-r20-feedback-start-shape]
    paths:
      - '.flr/r21calc-apply-request.json'

permissions:
  contents: write

concurrency:
  group: flr-r21-calculated-state-apply-v2
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout R21 branch
        uses: actions/checkout@v4
        with:
          ref: r21-r20-feedback-start-shape
          fetch-depth: 0

      - name: Verify exact R20 production baseline
        shell: bash
        run: |
          set -euo pipefail
          test ! -e runtime/formation_definition.js
          echo 'b3971c21b7e9f60827b17d92598a7ec6bc712e881e05cfe63cd3fed0968126ea  index.html' | sha256sum -c -
          echo '2375d7e042fa0816dd75909a80397df5c18786623ecadb4a8d7e935f1faa9990  live_hybrid_session_v02.js' | sha256sum -c -
          echo 'c4a7fab1b20996d7c301d27c9bc6981fa7852d69bd8106db90ca432f907f5760  runtime/continuous_match_core.js' | sha256sum -c -
          echo '2110e87158c5db64eb7ff5fd664ae5c4a554f54176f226bbbfb4dfe1a23f7d0c  runtime/hybrid_spatial_intent_v2.js' | sha256sum -c -
          echo '39c70529a95c54e4525a0a4d8cfb0c6caa9ad298b7b842c10a6b1d4c7988ab91  step71_hybrid_v06_ui.js' | sha256sum -c -

      - name: Verify every staged byte and reconstruct patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib
          m=json.loads(pathlib.Path('.flr/r21calc-manifest.json').read_text())
          parts=[]
          for i,want in enumerate(m['chunkSha256']):
              p=pathlib.Path(f'.flr/r21calc/chunk-{i:02d}')
              b=p.read_bytes()
              got=hashlib.sha256(b).hexdigest()
              if got != want: raise SystemExit(f'chunk {i:02d} sha mismatch: {got} != {want}')
              parts.append(b)
          enc=b''.join(parts)
          if len(enc)!=m['encodedBytes']: raise SystemExit(f'encoded size mismatch {len(enc)}')
          if hashlib.sha256(enc).hexdigest()!=m['encodedSha256']: raise SystemExit('encoded sha mismatch')
          pathlib.Path('/tmp/r21.patch.gz.b64').write_bytes(enc)
          PY
          base64 -d /tmp/r21.patch.gz.b64 > /tmp/r21.patch.gz
          echo '703699605ea467b2783d51027e0546ee222146b9f516c5e4bf148be58a0492ff  /tmp/r21.patch.gz' | sha256sum -c -
          gzip -dc /tmp/r21.patch.gz > /tmp/r21.patch
          test "$(wc -c < /tmp/r21.patch)" -eq 69239
          echo 'aff5fe8c1bf67f356ae3b075fee20eb4104c8ad8aa19733cd2c869cd0f305ff7  /tmp/r21.patch' | sha256sum -c -

      - name: Apply and verify exact R21 candidate
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/r21.patch
          git apply /tmp/r21.patch
          node --check runtime/formation_definition.js
          node --check runtime/hybrid_spatial_intent_v2.js
          node --check runtime/continuous_match_core.js
          node --check live_hybrid_session_v02.js
          node --check step71_hybrid_v06_ui.js
          grep -q 'USER-MATCH-TEST-V0.5.4-R21' index.html
          grep -q 'USER-MATCH-TEST-V0.5.4-R21' step71_hybrid_v06_ui.js
          ! grep -q 'restDefenceLine' runtime/formation_definition.js
          echo '6a49e182fcd3f37c9914bd2753f541dad44f359ef1d3de705b653d48c0a63fa3  index.html' | sha256sum -c -
          echo '09f3bd4a0d53efc19676ede9e196428946cd3c0ce23e82ffad725c4aade5a971  live_hybrid_session_v02.js' | sha256sum -c -
          echo '728ae8a68fba85b419a99ebc415aa98de0fd5fc510a8b405beba756a589024f2  runtime/continuous_match_core.js' | sha256sum -c -
          echo 'e671ed7b17eb89138be49a0db91be21047deff2bfa4f9af00f00c6cdda959801  runtime/formation_definition.js' | sha256sum -c -
          echo 'd94cf494819f931a47b2fe0a2357c2fd675c4ad394377165714db795aac3d2bf  runtime/hybrid_spatial_intent_v2.js' | sha256sum -c -
          echo '5bd84f6c35815d664e5424eb5d0f9016303e22dff0c8105a8f73a117c910d7ef  step71_hybrid_v06_ui.js' | sha256sum -c -

      - name: Remove temporary deployment staging
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .flr/r21calc
          rm -f .flr/r21calc-manifest.json .flr/r21calc-apply-request.json
          rm -f .github/workflows/flr-r21-calculated-state-apply-v2.yml

      - name: Commit exact six-file R21 production delta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FLR R21 Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Deploy USER-MATCH-TEST V0.5.4 R21 calculated-state continuity'
          git push origin HEAD:r21-r20-feedback-start-shape
