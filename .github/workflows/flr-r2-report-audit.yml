name: FLR R2 Report Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.flr/report-audit-request.json'
      - '.github/workflows/flr-r2-report-audit.yml'

permissions:
  contents: write
  actions: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Read TT-0.51 reports from R2
        id: audit
        continue-on-error: true
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          mkdir -p audit/reports
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/flr-bug-reports/objects"
          curl -sS -G "$base" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --data-urlencode 'prefix=reports/TT-0.51/' \
            --data-urlencode 'per_page=1000' \
            -o audit/list.json
          python - <<'PY'
          import json, pathlib, datetime
          p=pathlib.Path('audit/list.json')
          j=json.loads(p.read_text(encoding='utf-8'))
          if not j.get('success'):
              pathlib.Path('/tmp/audit_error.txt').write_text(json.dumps(j.get('errors') or [], ensure_ascii=False), encoding='utf-8')
              raise SystemExit('R2_LIST_FAILED')
          rows=sorted(j.get('result') or [], key=lambda x: x.get('uploaded') or x.get('last_modified') or '')
          slim=[{k:r.get(k) for k in ('key','size','uploaded','last_modified','custom_metadata')} for r in rows]
          idx={'schemaVersion':'FLR_REPORT_AUDIT_INDEX_1.0','build':'TT-0.51','generatedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'count':len(slim),'objects':slim}
          pathlib.Path('audit/index.json').write_text(json.dumps(idx,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          pathlib.Path('audit/keys.txt').write_text('\n'.join(r['key'] for r in slim if r.get('key'))+'\n',encoding='utf-8')
          print(f'R2 TT-0.51 reports found: {len(slim)}')
          PY
          while IFS= read -r key; do
            [ -z "$key" ] && continue
            name="${key##*/}"
            curl -fsS "${base}/${key}" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -o "audit/reports/${name}"
          done < audit/keys.txt
          rm -f audit/list.json audit/keys.txt

      - name: Publish audit status and sanitized index
        if: always()
        shell: bash
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          set -euo pipefail
          git pull --rebase origin main
          mkdir -p .flr
          python - <<'PY'
          import json, os, pathlib, datetime
          err=pathlib.Path('/tmp/audit_error.txt').read_text(encoding='utf-8') if pathlib.Path('/tmp/audit_error.txt').is_file() else None
          idx_path=pathlib.Path('audit/index.json')
          count=None
          if idx_path.is_file():
              idx=json.loads(idx_path.read_text(encoding='utf-8'))
              count=idx.get('count')
              pathlib.Path('.flr/report-audit-index.json').write_text(json.dumps(idx,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          status={'schemaVersion':'FLR_REPORT_AUDIT_STATUS_1.0','generatedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'outcome':os.environ.get('AUDIT_OUTCOME'),'count':count,'error':err}
          pathlib.Path('.flr/report-audit-status.json').write_text(json.dumps(status,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'FLR Report Audit Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .flr/report-audit-status.json
          [ ! -f .flr/report-audit-index.json ] || git add .flr/report-audit-index.json
          git diff --cached --quiet || {
            git commit -m 'Record TT-0.51 bug report audit status'
            git push origin HEAD:main
          }

      - name: Upload private audit artifact
        if: steps.audit.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: flr-tt051-report-audit
          path: audit/
          retention-days: 1
          if-no-files-found: error
