name: FLR TT051 Batch Feedback Diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.flr/tt051-batch-feedback-diag-request.json'

permissions:
  contents: write

concurrency:
  group: flr-tt051-batch-feedback-diag
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fetch latest two reports and extract compact issue facts
        id: diag
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/flr_batch
          for rid in \
            tt051-f42d0a99-3280-4119-9879-06117a3fca9c \
            tt051-f7f30898-f3b1-423c-a9e6-94d5c6972ab2; do
            curl --max-time 30 -fsS "https://flr-bug-reporter.sikarops.workers.dev/reports/TT-0.51/${rid}.json" > "/tmp/flr_batch/${rid}.json"
          done
          python .flr/tt051_issue_facts.py /tmp/flr_batch/*.json > /tmp/flr_issue_facts.json
      - name: Record result safely
        if: always()
        continue-on-error: true
        shell: bash
        env:
          OUTCOME: ${{ steps.diag.outcome }}
        run: |
          set +e
          if [ "${OUTCOME}" != success ] || [ ! -s /tmp/flr_issue_facts.json ]; then
            printf '{"schemaVersion":"FLR_TT051_ISSUE_FACTS_1.0","status":"FAILED","reports":[]}\n' > /tmp/flr_issue_facts.json
          fi
          git config user.name 'FLR Batch Feedback Bot'
          git config user.email 'actions@users.noreply.github.com'
          git reset --hard HEAD
          git pull --rebase origin main || git reset --hard origin/main
          cp /tmp/flr_issue_facts.json .flr/tt051-issue-facts.json
          git add .flr/tt051-issue-facts.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record latest two FLR issue facts' || exit 0
          git push origin HEAD:main || exit 0
