name: FLR D1 Report Audit

on:
  push:
    branches: [main]
    paths:
      - '.flr/d1-report-audit-request.json'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Query recent D1 reports and inspect latest bundle
        id: audit
        continue-on-error: true
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          mkdir -p .flr
          npx --yes wrangler@latest d1 list --json > /tmp/flr_d1_list.json
          dbid="$(python -c "import json; j=json.load(open('/tmp/flr_d1_list.json',encoding='utf-8')); print(next(((r.get('uuid') or r.get('id') or '') for r in j if r.get('name')=='flr-bug-reports'),''))")"
          test -n "$dbid"
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${dbid}/query" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data '{"sql":"SELECT report_id, build, created_at, category, priority, description, size_bytes, chunk_count FROM bug_reports ORDER BY created_at DESC LIMIT 10"}' \
            > /tmp/flr_d1_query.json
          rid="$(python -c "import json; j=json.load(open('/tmp/flr_d1_query.json',encoding='utf-8')); rows=((j.get('result') or [{}])[0].get('results') or []); print(rows[0]['report_id'] if rows else '')")"
          build="$(python -c "import json; j=json.load(open('/tmp/flr_d1_query.json',encoding='utf-8')); rows=((j.get('result') or [{}])[0].get('results') or []); print(rows[0]['build'] if rows else '')")"
          if [ -n "$rid" ]; then
            curl -fsS "https://flr-bug-reporter.sikarops.workers.dev/reports/${build}/${rid}.json" > /tmp/flr_latest_report.json
          else
            printf '{}\n' > /tmp/flr_latest_report.json
          fi
          python -c "import json,pathlib; q=json.load(open('/tmp/flr_d1_query.json',encoding='utf-8')); assert q.get('success') is True; rows=((q.get('result') or [{}])[0].get('results') or []); d=json.load(open('/tmp/flr_latest_report.json',encoding='utf-8')); cur=d.get('currentSituation'); prev=d.get('previousSituation'); slim={'schemaVersion':'FLR_D1_REPORT_AUDIT_1.1','status':'PASS','count':len(rows),'reports':rows,'latestBundle':{'schemaVersion':d.get('schemaVersion'),'scope':d.get('scope'),'bugReportContext':d.get('bugReportContext'),'currentSituationPresent':cur is not None,'previousSituationPresent':prev is not None,'currentSituationKeys':list(cur.keys()) if isinstance(cur,dict) else [],'previousSituationKeys':list(prev.keys()) if isinstance(prev,dict) else [],'currentReportScope':cur.get('reportScope') if isinstance(cur,dict) else None,'previousReportScope':prev.get('reportScope') if isinstance(prev,dict) else None,'currentSerializedBytes':len(json.dumps(cur,ensure_ascii=False).encode()) if cur is not None else 0,'previousSerializedBytes':len(json.dumps(prev,ensure_ascii=False).encode()) if prev is not None else 0}}; pathlib.Path('.flr/d1-report-audit-status.json').write_text(json.dumps(slim,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')"

      - name: Record audit result
        if: always()
        shell: bash
        env:
          OUTCOME: ${{ steps.audit.outcome }}
        run: |
          set -euo pipefail
          if [ "${OUTCOME}" != 'success' ]; then
            printf '{"schemaVersion":"FLR_D1_REPORT_AUDIT_1.1","status":"FAILED","count":0,"reports":[]}\n' > .flr/d1-report-audit-status.json
          fi
          git config user.name 'FLR D1 Audit Bot'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase origin main
          git add .flr/d1-report-audit-status.json
          git diff --cached --quiet || {
            git commit -m 'Record latest FLR D1 bug reports'
            git push origin HEAD:main
          }
