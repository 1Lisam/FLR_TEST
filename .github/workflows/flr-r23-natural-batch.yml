name: FLR R23 Natural Short Batch
on:
  push:
    branches: [r23-r22-report-fixes]
    paths: ['.github/workflows/flr-r23-natural-batch.yml']
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with: {ref: r23-r22-report-fixes}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Natural ST selection-window batch
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const path=require('path'),H=require('./live_hybrid_session_v02.js'),A=require('./live_v06_scene_authority_browser.js');
          const rd=path.join(process.cwd(),'runtime'),local=(team,p)=>team==='HOME'?{x:p.x,y:p.y}:{x:105-p.x,y:68-p.y};
          let protagonist=0,incoherent=0,seamMaxPos=0,seamMaxVel=0;const rows=[];
          for(let i=0;i<24;i++){
            const seed=`R23-NATURAL-${String(i+1).padStart(2,'0')}`,s=H.createSession({seed,heroTeam:'HOME',heroRole:'ST',heroPlayerId:'H-ST',durationSeconds:900,stepMin:4,stepMax:12}),r=H.advanceUntilBoundary(s,{maxActions:600}),b=r.boundary;
            if(!b||b.type!=='PROTAGONIST_2D_WINDOW')continue;protagonist++;
            const snap=b.stateSnapshot,sp=snap.spatial?.players,st=sp?.['H-ST'],lw=sp?.['H-LW'],rw=sp?.['H-RW'],cms=['H-LCM','H-CM','H-RCM'].map(id=>sp?.[id]).filter(Boolean);
            let bad=false,detail=null;
            if(sp&&st&&lw&&rw&&cms.length===3&&snap.phase!=='TRANSITION'){
              const sx=local('HOME',st).x,wingAvg=(local('HOME',lw).x+local('HOME',rw).x)/2,cmAvg=cms.reduce((a,p)=>a+local('HOME',p).x,0)/3;
              bad=sx<68&&Math.abs(sx-cmAvg)<5&&wingAvg>68;detail={sx,cmAvg,wingAvg,phase:snap.phase};
            }
            if(bad)incoherent++;
            const hi=A.seedMatch(b,{runtimeDir:rd,seed:`R23-NATURAL-HR-${i}`,explicitHeroChoiceRequired:true}),m=hi.state.m;
            for(const [id,q] of Object.entries(sp||{})){const p=m.players.find(x=>x.id===id);if(!p)continue;seamMaxPos=Math.max(seamMaxPos,Math.hypot(p.x-q.x,p.y-q.y));seamMaxVel=Math.max(seamMaxVel,Math.hypot(p.vx-q.vx,p.vy-q.vy));}
            rows.push({seed,at:b.atSecond,reason:b.reason,detail,bad});
          }
          console.log('R23_NATURAL_BATCH',JSON.stringify({sessions:24,protagonist,incoherent,seamMaxPos,seamMaxVel,rows},null,2));
          if(incoherent)throw new Error(`natural ST incoherent windows ${incoherent}`);
          if(seamMaxPos>1e-9||seamMaxVel>1e-9)throw new Error(`Hybrid->2D seam mismatch ${seamMaxPos}/${seamMaxVel}`);
          if(protagonist<3)throw new Error(`natural sample too small: ${protagonist}`);
          console.log('R23_NATURAL_BATCH: PASS');
          NODE
      - name: Clean workflow
        run: |
          rm -f .github/workflows/flr-r23-natural-batch.yml
          git config user.name 'FLR R23 QA Bot'; git config user.email 'actions@users.noreply.github.com'; git add -A; git commit -m 'chore: remove temporary R23 natural QA workflow'; git push origin HEAD:r23-r22-report-fixes
