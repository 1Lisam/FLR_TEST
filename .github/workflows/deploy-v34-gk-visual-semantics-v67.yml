name: deploy-v34-gk-visual-semantics-v67
on:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-v34-gk-visual-semantics-v67.yml']
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch #67 semantics and run bounded GK QA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          rp=Path('runtime/continuous_match_core.js')
          s=rp.read_text()
          old="  const side=cross.y<33.0?'골문 왼쪽':cross.y>35.0?'골문 오른쪽':'골문 중앙';"
          new="  // 7.32m goal mouth: keep the central call broad and reserve side wording for clearly lateral crossings.\n  const GOAL_HALF_WIDTH=7.32/2,CENTRE_HALF_WIDTH=GOAL_HALF_WIDTH*0.68;\n  const side=cross.y<34-CENTRE_HALF_WIDTH?'골문 왼쪽':cross.y>34+CENTRE_HALF_WIDTH?'골문 오른쪽':'골문 중앙';"
          if s.count(old)!=1: raise SystemExit(f'goal threshold anchor count={s.count(old)}')
          s=s.replace(old,new,1)
          rp.write_text(s)

          up=Path('step71_hybrid_v06_ui.js')
          u=up.read_text()
          old="GK_PHASE2_PLAUSIBILITY_TOUCH_LEFT_GOAL:{seed:'SEARCH--0.75-34-24',label:'GK Phase2 · 장갑 굴절 좌측 실점',expected:'TOUCH_CONTINUE',expectedTerminal:'GOAL',distance:19,speed:24,offset:-1.5,gk:40,handling:40,visualStartX:83,gkX:100.5,gkY:34,exactTouchFixture:true,ballStartX:83,ballStartY:32.5,straightShot:true,replayRate:.75"
          new="GK_PHASE2_PLAUSIBILITY_TOUCH_LEFT_GOAL:{seed:'SEARCH--0.75-34-24',label:'GK Phase2 · 장갑 굴절 좌측 실점',expected:'TOUCH_CONTINUE',expectedTerminal:'GOAL',distance:19,speed:24,offset:-1.7,gk:40,handling:40,visualStartX:83,gkX:100.5,gkY:34,exactTouchFixture:true,ballStartX:83,ballStartY:32.3,straightShot:true,replayRate:.75"
          if u.count(old)!=1: raise SystemExit(f'left fixture anchor count={u.count(old)}')
          u=u.replace(old,new,1)
          up.write_text(u)
          PY

          node --check runtime/continuous_match_core.js
          node --check step71_hybrid_v06_ui.js
          git diff --check

          node <<'NODE'
          const E=require('./runtime/continuous_match_core.js');
          const B=E.choiceActionBridge();
          const cases=[
            {name:'CATCH',seed:'GKDBG-CATCH-1',expected:'CATCH',distance:22,speed:18,offset:0,gk:60,handling:60},
            {name:'SAFE',seed:'GKDBG-SAFE-1',expected:'PARRY_SAFE',distance:19,speed:23,offset:3.0,gk:60,handling:50},
            {name:'DANGER',seed:'PH2-DANGER-05',expected:'PARRY_DANGER',distance:18,speed:26,offset:2.5,gk:60,handling:35,visualStartX:83,gkX:100.5,gkY:34},
            {name:'LEFT',seed:'SEARCH--0.75-34-24',expected:'TOUCH_CONTINUE',terminal:'GOAL',distance:19,speed:24,offset:-1.7,gk:40,handling:40,visualStartX:83,gkX:100.5,gkY:34,exact:true,ballStartX:83,ballStartY:32.3,straight:true},
            {name:'RIGHT',seed:'SEARCH-1.5-34-23',expected:'TOUCH_CONTINUE',terminal:'GOAL',distance:19,speed:23,offset:1.5,gk:40,handling:40,visualStartX:83,gkX:100.5,gkY:34,exact:true,ballStartX:83,ballStartY:35.5,straight:true},
            {name:'CORNER',seed:'TOUCH-GOAL-013',expected:'TOUCH_CONTINUE',terminal:'CORNER',distance:19,speed:23,offset:2.5,gk:40,handling:40,visualStartX:83,gkX:100.5,gkY:34.5,exact:true,ballStartX:83,ballStartY:36.5,straight:true}
          ];
          function run(c){
            const m=E.createMatch(c.seed,{dt:.05});
            m.time=100;m.restart=null;m.phase='OPEN_PLAY';m.nextShape=9999;m.events=[];m.score={HOME:0,AWAY:0};m.possession='HOME';m.playerAbilityProfiles={};m.v34TestOnlyVisualFixture=!!c.exact;
            const st=m.playersById['H-ST'],gk=m.playersById['A-GK'];
            for(const p of m.players){p.hasBall=false;p.nextThink=9999;p.vx=p.vy=0;if(p.role!=='GK'){if(c.exact){p.x=70;p.y=7;}else{p.x=70+(p.slot.includes('L')?0:1);p.y=p.slot.includes('L')?7:p.slot.includes('R')?61:54;}p.tx=p.x;p.ty=p.y;}}
            const shotX=c.visualStartX??(105-c.distance);Object.assign(st,{x:shotX,y:34,tx:shotX,ty:34,bodyAngle:0,faceTargetAngle:0,nextThink:9999});
            const gkY=c.gkY??(34+(c.offset?Math.sign(c.offset)*Math.min(1.8,Math.abs(c.offset)*.45):0));Object.assign(gk,{x:c.gkX??99.5,y:gkY,tx:c.exact?(c.gkX??99.5):99.5,ty:gkY,vx:0,vy:0,bodyAngle:Math.PI,action:'GK_SAVE_SET',tacticalTask:'GK_SAVE_SET',nextThink:9999});
            m.playerAbilityProfiles[gk.id]={reaction:c.gk,gk_positioning:c.gk,diving:c.gk,handling:c.handling};
            B.setControlled(m,st,true);
            B.executeShot(m,st,c.exact?'TOUCH_DEFLECT_FORCED':'DEV_GK_PHASE2',{releaseNow:true,decisionOrientation:{turningRequired:false,backToGoal:false,facingAlignment:1,bodyAngleDiff:0}});
            const tx=105,ty=34+c.offset,ballX=c.ballStartX??m.ball.x,ballY=c.ballStartY??m.ball.y,dx=tx-ballX,dy=ty-ballY,n=Math.hypot(dx,dy)||1;
            Object.assign(m.ball,{kind:'SHOT',mode:'FLIGHT',ownerId:null,x:ballX,y:ballY,z:.08,vx:c.straight?c.speed:dx/n*c.speed,vy:c.straight?0:dy/n*c.speed,vz:0,age:0,originX:shotX,originY:34,targetX:tx,targetY:ty,shotTargetY:ty,shotTeam:'HOME',lastTouchTeam:'HOME',lastTouchPlayer:'H-ST',onTarget:true,shotDistance:c.distance,shotOneVOne:false,shotClearKeeperChance:false,airborne:false,strikeStyle:'POWER',arcProfile:null,npcGkResolved:null});m.lastTouchTeam='HOME';m.lastTouchPlayer='H-ST';
            let outcome=null,terminal=null,contact=null,cornerPost=[];
            for(let i=0;i<220;i++){
              const before={x:m.ball.x,y:m.ball.y,vx:m.ball.vx,vy:m.ball.vy,mode:m.ball.mode};
              E.step(m,.05);
              if(!outcome){const e=[...m.events].reverse().find(e=>e&&e.npcGkOutcome);if(e){outcome=e;const px=before.vx?before.y+before.vy*((105-before.x)/before.vx):before.y;contact={time:m.time,y:m.ball.y,preProjectedY:px,preVy:before.vy,postVy:m.ball.vy,score:{...m.score},lastTouch:m.ball.lastTouchPlayer,mode:m.ball.mode,kind:m.ball.kind};}}
              if(c.terminal&&!terminal){const e=[...m.events].reverse().find(e=>e&&e.type===c.terminal);if(e)terminal=e;}
              if(c.name==='CORNER'&&terminal&&cornerPost.length<5){
                if(m.ball.x>105.0001)cornerPost.push({x:m.ball.x,y:m.ball.y,vx:m.ball.vx,vy:m.ball.vy,visualTime:m.visualReplayTime});
              }
              if(outcome&&!c.terminal&&i>20)break;
              if(terminal&&c.name!=='CORNER')break;
              if(c.name==='CORNER'&&terminal&&cornerPost.length>=5)break;
            }
            return {name:c.name,outcome:outcome?.npcGkOutcome||null,terminal:terminal?.type||null,crossing:terminal?.crossing||null,text:terminal?.text||'',actorId:terminal?.actorId||null,contact,cornerPost};
          }
          const rows=cases.map(run);const by=Object.fromEntries(rows.map(r=>[r.name,r]));
          const checks={
            catch:by.CATCH.outcome==='CATCH',safe:by.SAFE.outcome==='PARRY_SAFE',danger:by.DANGER.outcome==='PARRY_DANGER',
            leftOutcome:by.LEFT.outcome==='TOUCH_CONTINUE',leftGoal:by.LEFT.terminal==='GOAL',leftLive:by.LEFT.contact?.mode==='FLIGHT'&&by.LEFT.contact?.kind==='SHOT'&&by.LEFT.contact?.score?.HOME===0,
            leftTurn:by.LEFT.contact?.preVy===0&&by.LEFT.contact?.postVy<0,
            leftClear:by.LEFT.crossing?.y<31.5112&&by.LEFT.crossing?.y>30.34,
            leftDelta:by.LEFT.crossing&&by.LEFT.contact?(by.LEFT.contact.preProjectedY-by.LEFT.crossing.y)>=1.0:false,
            leftText:by.LEFT.text.includes('골문 왼쪽'),leftActor:by.LEFT.actorId==='H-ST',
            rightOutcome:by.RIGHT.outcome==='TOUCH_CONTINUE',rightGoal:by.RIGHT.terminal==='GOAL',rightClear:by.RIGHT.crossing?.y>36.4888&&by.RIGHT.crossing?.y<37.66,rightText:by.RIGHT.text.includes('골문 오른쪽'),rightActor:by.RIGHT.actorId==='H-ST',
            cornerOutcome:by.CORNER.outcome==='TOUCH_CONTINUE',cornerTerminal:by.CORNER.terminal==='CORNER',cornerLastTouch:by.CORNER.contact?.lastTouch==='A-GK',
            cornerFive:by.CORNER.cornerPost.length===5,
            cornerMonotonic:by.CORNER.cornerPost.length===5&&by.CORNER.cornerPost.every((p,i,a)=>p.x>105&&(i===0||p.x>a[i-1].x)),
            cornerCadence:by.CORNER.cornerPost.length===5&&by.CORNER.cornerPost.every((p,i,a)=>i===0||Math.abs((p.visualTime-a[i-1].visualTime)-.05)<1e-6)
          };
          console.log(JSON.stringify({verdict:Object.values(checks).every(Boolean)?'PASS_FOR_VISUAL_RETEST':'FAIL',checks,rows},null,2));
          if(!Object.values(checks).every(Boolean))process.exit(1);
          NODE

          # #8 public fixture must remain byte-for-byte on its accepted inputs.
          grep -F "GK_PHASE2_PLAUSIBILITY_TOUCH_RIGHT_GOAL:{seed:'SEARCH-1.5-34-23'" step71_hybrid_v06_ui.js
          grep -F "offset:1.5,gk:40,handling:40,visualStartX:83,gkX:100.5,gkY:34,exactTouchFixture:true,ballStartX:83,ballStartY:35.5" step71_hybrid_v06_ui.js

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add runtime/continuous_match_core.js step71_hybrid_v06_ui.js
          git diff --cached --quiet && { echo 'no gameplay changes'; exit 1; }
          git commit -m 'Deploy GK visual semantics no-stutter retest (TEST_ONLY)'
          git push origin HEAD:main
