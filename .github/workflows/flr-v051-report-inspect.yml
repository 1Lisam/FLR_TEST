name: FLR V0.5.1 Report Inspect

on:
  push:
    branches: [main]
    paths: ['.flr/v051-report-inspect-request.json']

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - name: Download V0.5.1 report bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v051
          base='https://flr-bug-reporter.sikarops.workers.dev/reports/USER-MATCH-TEST-V0.5.1'
          for rid in \
            umt051-c61b317e-68bb-485c-b15d-8c51592bdab5 \
            umt051-aa3cf94e-e023-4f23-a446-88038e5babfb \
            umt051-4666b14a-cb73-44db-a2a6-1b62961f8d9c \
            umt051-8e44fd09-7ae9-4587-8fc1-ef3c856c0e8a; do
            curl -fsS "$base/$rid.json" > "/tmp/v051/$rid.json"
            python -m json.tool "/tmp/v051/$rid.json" >/dev/null
          done
      - name: Compact causal inspection
        shell: bash
        run: |
          python - <<'PY'
          import json,math,pathlib
          ids=[
            'umt051-c61b317e-68bb-485c-b15d-8c51592bdab5',
            'umt051-aa3cf94e-e023-4f23-a446-88038e5babfb',
            'umt051-4666b14a-cb73-44db-a2a6-1b62961f8d9c',
            'umt051-8e44fd09-7ae9-4587-8fc1-ef3c856c0e8a']
          def n(v,d=0):
            try:return float(v)
            except:return d
          def pl(f,pid):return next((p for p in ((f or {}).get('players') or []) if p.get('id')==pid),None)
          def cp(p):
            if not p:return None
            return {k:p.get(k) for k in ('id','team','role','slot','x','y','vx','vy','action','tacticalTask','bodyAngle','markTargetId') if p.get(k) is not None}
          def speed(p):return round(math.hypot(n((p or {}).get('vx')),n((p or {}).get('vy'))),3) if p else None
          def frame(f,hero='H-ST'):
            if not isinstance(f,dict):return None
            b=f.get('ball') or {};h=pl(f,hero)
            return {'t':f.get('time'),'phase':f.get('phase'),'possession':f.get('possession'),'ball':{k:b.get(k) for k in ('mode','x','y','z','ownerId','intendedReceiverId','lastTouchTeam')},'hero':cp(h),'heroSpeed':speed(h)}
          def segdist(p,a,b):
            px,py=n(p.get('x')),n(p.get('y'));ax,ay=n(a.get('x')),n(a.get('y'));bx,by=n(b.get('x')),n(b.get('y'));dx,dy=bx-ax,by-ay;den=dx*dx+dy*dy
            if den<1e-9:return math.hypot(px-ax,py-ay),0
            u=max(0,min(1,((px-ax)*dx+(py-ay)*dy)/den));return math.hypot(px-(ax+u*dx),py-(ay+u*dy)),u
          def lwgeom(f,hero='H-ST'):
            h=pl(f,hero);t=pl(f,'H-LW')
            if not h or not t:return None
            opp=[p for p in (f.get('players') or []) if p.get('team')!=h.get('team')]
            near=min((math.hypot(n(p.get('x'))-n(t.get('x')),n(p.get('y'))-n(t.get('y'))) for p in opp),default=None)
            blocks=[]
            for p in opp:
              d,u=segdist(p,h,t)
              if .08<u<.96 and d<1.8:blocks.append({'id':p.get('id'),'d':round(d,2),'u':round(u,2)})
            return {'hero':cp(h),'lw':cp(t),'distance':round(math.hypot(n(h.get('x'))-n(t.get('x')),n(h.get('y'))-n(t.get('y'))),2),'nearestOpponent':round(near,2) if near is not None else None,'laneBlockers':blocks}
          def position_metrics(f,hero='H-ST'):
            ps=(f or {}).get('players') or []
            out={}
            for team in ('HOME','AWAY'):
              q=[p for p in ps if p.get('team')==team]
              out[team]={'movingGt0_75':sum(speed(p)>.75 for p in q),'movingGt2':sum(speed(p)>2 for p in q),'avgSpeed':round(sum(speed(p) for p in q)/len(q),3) if q else None,'players':[cp(p) for p in q]}
            return out
          def times(fs):
            ts=[n(f.get('time'),None) for f in (fs or []) if isinstance(f,dict) and f.get('time') is not None]
            if not ts:return None
            drops=[{'i':i,'prev':ts[i-1],'cur':ts[i]} for i in range(1,len(ts)) if ts[i]<ts[i-1]-1e-6]
            return {'count':len(ts),'start':ts[0],'end':ts[-1],'duration':round(ts[-1]-ts[0],3),'timeReversals':drops[:10]}
          def sit(s):
            if not isinstance(s,dict):return None
            hb=s.get('hybridBefore') or {};hr=s.get('highResolution') or {};dec=hr.get('decision') or {};hero=(hb.get('boundary') or {}).get('heroPlayerId') or 'H-ST';pre=hr.get('preActionFrames') or [];post=hr.get('postActionFrames') or [];entry=hr.get('entrySnapshot') or {};df=dec.get('state') if isinstance(dec.get('state'),dict) and dec.get('state',{}).get('players') else (pre[-1] if pre else entry);opts=dec.get('options') or [];events=hr.get('actualEvents') or []
            goals=[e for e in events if e.get('type')=='GOAL']
            return {'boundary':hb.get('boundary'),'spatialSource':((hb.get('state') or {}).get('spatial') or {}).get('source'),'entry':frame(entry,hero),'entryPositionMetrics':position_metrics(entry,hero),'preTimes':times(pre),'postTimes':times(post),'decisionAt':dec.get('at'),'decisionKind':dec.get('kind'),'decisionFrame':frame(df,hero),'lwGeometry':lwgeom(df,hero),'options':[{'id':o.get('id'),'targetId':o.get('targetId'),'label':o.get('label'),'meta':o.get('meta')} for o in opts],'optionsToLW':[{'id':o.get('id'),'targetId':o.get('targetId'),'label':o.get('label'),'meta':o.get('meta')} for o in opts if o.get('targetId')=='H-LW'],'actualResult':hr.get('actualResult'),'goalEvents':goals,'actualEventsTail':events[-12:],'postTail':[frame(f,hero) for f in post[-12:]],'replayFramesTimes':times((s.get('replayFrames') or hr.get('replayFrames') or []))}
          out=[]
          for rid in ids:
            d=json.loads((pathlib.Path('/tmp/v051')/(rid+'.json')).read_text())
            out.append({'reportId':rid,'bugReportContext':d.get('bugReportContext'),'topKeys':list(d.keys()),'current':sit(d.get('currentSituation')),'previous':sit(d.get('previousSituation'))})
          pathlib.Path('/tmp/v051-report-inspect-status.json').write_text(json.dumps({'schemaVersion':'FLR_V051_REPORT_INSPECT_1.0','count':len(out),'reports':out},ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Persist compact inspection
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FLR V0.5.1 Report Inspector'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase origin main
          cp /tmp/v051-report-inspect-status.json .flr/v051-report-inspect-status.json
          git add .flr/v051-report-inspect-status.json
          git commit -m 'Record V0.5.1 user report inspection' || exit 0
          git push origin HEAD:main
