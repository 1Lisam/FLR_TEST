name: FLR V0.5 Feedback Fix Candidate

on:
  push:
    branches: [main]
    paths:
      - '.flr/v05-followup-candidate-request.json'

permissions:
  contents: write

concurrency:
  group: flr-v05-followup-candidate
  cancel-in-progress: false

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/v05-followup-20260823
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply three V0.5 user-feedback corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          # 1) Chained incoming-ball decisions must replay the ball departure/flight before options appear.
          p=Path('step71_hybrid_v06_ui.js')
          s=p.read_text(encoding='utf-8')
          marker='\nfunction choose(id,targetId,inputMeta={source:\'USER_UI_CLICK\'})'
          assert marker in s
          helper="""
function showPendingCausally(){
  const p=session?.pending;if(!p)return;
  if(p.kind==='INCOMING_BALL'&&p.chained){
    const rows=(p.replayFrames||[]).map(deep);
    if(rows.length>=2){
      const hid=$('heroPlayer').value;let flight=rows.findIndex(f=>f?.ball?.mode==='FLIGHT'&&f?.ball?.intendedReceiverId===hid);
      const start=flight>=0?Math.max(0,flight-5):Math.max(0,rows.length-24),clip=rows.slice(start);
      if(clip.length>=2){startReplay(clip,'CHOICE','다가오는 공 → 선택 직전 실제 경기');return;}
    }
  }
  showPending();
}
"""
          s=s.replace(marker,'\n'+helper+marker.lstrip('\n'),1)
          n=s.count("if(session.pending?.chained){showPending();return}")
          assert n==2,n
          s=s.replace("if(session.pending?.chained){showPending();return}","if(session.pending?.chained){showPendingCausally();return}")
          n=s.count("if(session.pending){showPending();return}")
          assert n==1,n
          s=s.replace("if(session.pending){showPending();return}","if(session.pending){showPendingCausally();return}")
          p.write_text(s,encoding='utf-8')

          # 2) A genuinely open wide outlet may be slightly lateral/backward and still be a player option.
          p=Path('runtime/protagonist_match_controller.js')
          s=p.read_text(encoding='utf-8')
          marker="  // PLAYER risk floor: the raw live pass geometry, not NPC ranking, decides whether a risky\n"
          assert marker in s
          block="""  // V0.5 follow-up: an obviously open wide outlet is a PLAYER option even when it is
  // slightly lateral/backward.  NPC forward-progress preference may rank it low, but it must
  // not erase a real winger with receiving space.  Execution still re-checks live geometry,
  // so a blocker may intercept it and no success outcome is preselected here.
  const openWideOutlet=(frame?._frame?.opts||[]).filter(o=>o?.p&&o.p.role==='WF'&&o.d>=3&&o.d<=32&&o.block<=1&&o.open>=3.0&&o.forward>=-5.0&&!o.offsideRisk)
    .sort((a,b)=>(b.open-a.open)+(b.forward-a.forward)*.05+(Number(b.running)-Number(a.running))*.35)[0]||null;
  if(openWideOutlet&&!out.some(o=>o.family==='패스'&&o.targetId===openWideOutlet.p.id)){
    if(out.length>=6){const ix=out.findIndex(o=>o.id==='HOLD'||o.id==='CARRY'||o.id==='RECYCLE');if(ix>=0)out.splice(ix,1);}
    if(out.length<6){const c={id:'AVAILABLE_PASS',targetId:openWideOutlet.p.id,targetName:`같은 팀 ${openWideOutlet.p.slot}`,meta:{targetId:openWideOutlet.p.id,targetSlot:openWideOutlet.p.slot,forward:Number(openWideOutlet.forward||0),d:Number(openWideOutlet.d||0),receiverPressure:Number(openWideOutlet.open||0),contested:openWideOutlet.block>0,laneBlockers:Number(openWideOutlet.block||0),offsideRisk:false,lateralOutlet:true}};const row={id:c.id,targetId:c.targetId,targetName:c.targetName,family:'패스',label:labelFor(c),meta:deep(c.meta)};row.hint=tooltipFor(c,frame);row.tooltip=row.hint;out.push(row);}
  }
"""
          s=s.replace(marker,block+marker,1)
          p.write_text(s,encoding='utf-8')

          # 3) Hybrid spatial state must retain causal asymmetry instead of snapping all off-ball
          # players back toward identical 4-3-3 anchor lines every 4-12 abstract seconds.
          p=Path('live_hybrid_session_v02.js')
          s=p.read_text(encoding='utf-8')
          old_re=r"function spatialBase\(state,id\)\{.*?\}\nfunction createSpatialState"
          m=re.search(old_re,s,flags=re.S)
          assert m, 'spatialBase block not found'
          old=m.group(0)
          base_old=old[:-len('\nfunction createSpatialState')]
          # Keep the established base rules, then add deterministic ball-side staggering.
          assert "const width=clamp(Number(st.width||50)/50,.75,1.25);y=34+(y-34)*width;return localToWorld" in base_old
          base_new=base_old.replace(
            "const width=clamp(Number(st.width||50)/50,.75,1.25);y=34+(y-34)*width;return localToWorld(team,clamp(x,4,101),clamp(y,4,64));",
            "const width=clamp(Number(st.width||50)/50,.75,1.25);y=34+(y-34)*width;const bw=abstractBallWorld(state),bly=team==='HOME'?bw.y:68-bw.y,nearLeft=bly<27,nearRight=bly>41,nearSide=(nearLeft&&['LB','LCM','LW'].includes(slot))||(nearRight&&['RB','RCM','RW'].includes(slot));if(role==='CM')x+=poss?(slot==='CM'?-1.1:(nearSide?2.2:.7)):(slot==='CM'?.4:(nearSide?-1.0:.8));else if(role==='FB')x+=poss?(nearSide?2.0:-.5):(nearSide?.6:-.3);else if(role==='WF')x+=poss?(nearSide?1.4:2.4):(nearSide?-1.0:.4);if(role!=='GK')y+=(bly-y)*(poss?.06:.12);return localToWorld(team,clamp(x,4,101),clamp(y,4,64));"
          )
          s=s.replace(old,base_new+'\nfunction createSpatialState',1)
          adv_re=r"function advanceSpatial\(session,dt\)\{.*?\}\nfunction spatialSnapshot"
          m=re.search(adv_re,s,flags=re.S)
          assert m, 'advanceSpatial block not found'
          adv_new="""function advanceSpatial(session,dt){
 const s=session.state,sp=s.spatial||(s.spatial=createSpatialState(s)),last=s.chain.at(-1),actor=last?.detail?.actorId||null,target=last?.detail?.targetId||null,owner=s.ball.ownerId||null,bw=abstractBallWorld(s),seconds=Math.max(.1,Number(dt)||.1),fromExact=sp.source==='V06_HANDOFF_EXACT';
 for(const id of spatialPlayerIds()){
  const q=sp.players[id]||(sp.players[id]={id,...spatialBase(s,id),vx:0,vy:0}),base=spatialBase(s,id),team=teamOfPlayer(id),role=roleOf(id),inPoss=s.possession===team,attack=team==='HOME'?1:-1;let tx=base.x,ty=base.y;
  if(id===owner){tx=bw.x;ty=bw.y;}
  else if(id===target){tx=base.x+attack*2.4;ty=base.y+(bw.y-base.y)*.18;}
  else if(id===actor){tx=base.x+(bw.x-base.x)*.18;ty=base.y+(bw.y-base.y)*.18;}
  else{
   if(s.phase==='TRANSITION'){tx+=inPoss?attack*2.4:-attack*2.0;ty+=(bw.y-ty)*.08;}
   else if(inPoss){const prog=clamp(Number(s.ball.progress||.5),.02,.99),push=role==='WF'?2.8:role==='CM'?1.8:role==='FB'?1.2:role==='ST'?2.0:.4;tx+=attack*push*clamp((prog-.42)/.45,0,1);}
   else{const pull=role==='CB'?.10:role==='CM'?.13:role==='FB'?.11:.06;tx+=(bw.x-tx)*pull;}
   const retain=fromExact?.82:.50,window=Math.min(seconds,3.0);tx+=clamp(Number(q.vx||0)*window*retain,-4.5,4.5);ty+=clamp(Number(q.vy||0)*window*retain,-3.8,3.8);
  }
  const tau=(id===owner||id===actor||id===target)?3.2:(fromExact?24:18),alpha=1-Math.exp(-seconds/tau),ox=q.x,oy=q.y;q.x=clamp(ox+(tx-ox)*alpha,3,102);q.y=clamp(oy+(ty-oy)*alpha,3,65);q.vx=(q.x-ox)/seconds;q.vy=(q.y-oy)/seconds;
 }
 const op=sp.players[owner];if(op)sp.ball={x:op.x,y:op.y,ownerId:owner};else{const a=.35;sp.ball={x:(sp.ball?.x??bw.x)+(bw.x-(sp.ball?.x??bw.x))*a,y:(sp.ball?.y??bw.y)+(bw.y-(sp.ball?.y??bw.y))*a,ownerId:null};}sp.atSecond=s.second;if(fromExact)sp.source='HYBRID_CONTINUOUS_FROM_V06';return sp;
}
function spatialSnapshot"""
          s=s[:m.start()]+adv_new+s[m.end():]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Syntax checks
        run: |
          node --check step71_hybrid_v06_ui.js
          node --check runtime/protagonist_match_controller.js
          node --check live_hybrid_session_v02.js
      - name: Targeted V0.5 follow-up regression
        shell: bash
        run: |
          cat > /tmp/v05-followup-regression.js <<'NODE'
          const fs=require('fs'),assert=require('assert');
          const E=require('./runtime/continuous_match_core.js');
          const P=require('./runtime/protagonist_match_controller.js');
          const H=require('./live_hybrid_session_v02.js');
          const results=[];const ok=(name,detail={})=>results.push({name,pass:true,...detail});

          // A. Chained incoming-ball UI must invoke causal replay before showPending.
          const ui=fs.readFileSync('step71_hybrid_v06_ui.js','utf8');
          assert(ui.includes("function showPendingCausally()"));
          assert(ui.includes("p.kind==='INCOMING_BALL'&&p.chained"));
          assert(ui.includes("f?.ball?.mode==='FLIGHT'&&f?.ball?.intendedReceiverId===hid"));
          assert((ui.match(/showPendingCausally\(\)/g)||[]).length>=4);
          assert(ui.includes("if(target>=end-.001){replayList=[];const ret=replayReturn;if(ret==='CHOICE')showPending();"));
          ok('CHAINED_INCOMING_REPLAY_BEFORE_OPTIONS');

          // B. Reproduce the user-reported open LW geometry at option-building level.
          const s=P.create('V05-OPEN-LW',{heroPlayerId:'H-ST',mode:'PLAYER_ALL'});
          const originalBridge=E.choiceStateBridge;
          const fake={kind:'ON_BALL',playerId:'H-ST',team:'HOME',role:'ST',slot:'ST',time:66.55,localX:78.78,localY:35.06,pressure:2.384,space:.90,shot:{dGoal:26.24,inBox:false,oneVOne:false,openWindow:false,longRange:false,turningRequired:false,backToGoal:false,bodyAngleDiff:.2,blockers:1},candidates:[
            {id:'TAKE_ON',score:2.3,meta:{defenderId:'A-RCB',defenderDistance:2.384,spaceBehind:9.5,wide:false}},
            {id:'CARRY',score:2.1,meta:{space:.90,pressure:2.384,clearRunway:false}},
            {id:'HOLD',score:2.0,meta:{}},
            {id:'SAFE_PASS',targetId:'H-RCM',targetName:'블루팀 RCM',score:1.9,meta:{targetSlot:'RCM'}},
            {id:'SHOT',score:1.8,meta:{dGoal:26.24,inBox:false,oneVOne:false,openWindow:false,longRange:false}},
            {id:'SAFE_PASS',targetId:'H-CM',targetName:'블루팀 CM',score:1.7,meta:{targetSlot:'CM',forward:-18.8,d:18.83,receiverPressure:9.2,directSafe:true}}
          ],_frame:{opts:[{p:{id:'H-LW',role:'WF',slot:'LW',tacticalTask:'ST_RELEASE_RUN',vx:.693,vy:2.524},block:1,d:16.23,open:6.06,forward:-1.19,running:true,offsideRisk:false,offsideMargin:0}]}};
          E.choiceStateBridge=()=>({inspect:()=>fake});
          const q=P.inspect(s);E.choiceStateBridge=originalBridge;
          const lw=q.options.find(o=>o.targetId==='H-LW');
          assert(lw,'open LW must be visible');assert.strictEqual(lw.id,'AVAILABLE_PASS');assert.strictEqual(lw.meta.laneBlockers,1);assert.strictEqual(lw.meta.lateralOutlet,true);assert.strictEqual(q.futureOutcomePrecomputed,false);
          ok('OPEN_LATERAL_WIDE_OUTLET_VISIBLE',{choice:lw.id,target:lw.targetId});

          // C. V0.6 handoff asymmetry must survive a meaningful low-res interval instead of
          // collapsing immediately onto formation rails.
          const w=H.createSession({seed:'V05-SPATIAL-RETENTION',durationSeconds:6,heroRole:'GK',heroPlayerId:'H-GK',stepMin:4,stepMax:4});
          let r=H.advanceUntilBoundary(w);assert(r.boundary&&r.boundary.type==='FINAL_2D_WINDOW');
          const slots=['GK','LB','LCB','RCB','RB','LCM','CM','RCM','LW','ST','RW'];
          const roles={GK:'GK',LB:'FB',LCB:'CB',RCB:'CB',RB:'FB',LCM:'CM',CM:'CM',RCM:'CM',LW:'WF',ST:'ST',RW:'WF'};
          const base={GK:[6,34],LB:[25,9],LCB:[22,25],RCB:[22,43],RB:[25,59],LCM:[45,20],CM:[45,34],RCM:[45,48],LW:[65,8],ST:[70,34],RW:[65,60]};
          const players=[];
          for(const team of ['HOME','AWAY'])for(let i=0;i<slots.length;i++){const slot=slots[i],a=base[slot],sg=team==='HOME'?1:-1,wx=team==='HOME'?a[0]:105-a[0],wy=team==='HOME'?a[1]:68-a[1];let ox=((i%3)-1)*4,oy=((i%4)-1.5)*2;if(slot==='GK'){ox=team==='HOME'?12:-12;oy=team==='HOME'?-7:7;}players.push({id:`${team==='HOME'?'H':'A'}-${slot}`,name:slot,team,role:roles[slot],slot,x:wx+ox,y:wy+oy,vx:team==='HOME'?.8:-.8,vy:(i%2?.35:-.35)});}
          const snap={time:2,score:{HOME:0,AWAY:0},phase:'PROGRESSION',possession:'HOME',ball:{x:55,y:46,ownerId:'H-CM'},players};
          w.durationSeconds=22;H.resumeFromHighRes(w,{snapshot:snap,hadChoice:true,result:null,actualEvents:[]});
          const startX=w.state.spatial.players['H-GK'].x;assert.strictEqual(w.state.spatial.source,'V06_HANDOFF_EXACT');
          let guard=0;while(w.status!=='FINISHED'&&guard++<10){const z=H.advanceUntilBoundary(w);if(z.status==='PAUSED'){throw new Error('unexpected intermediate boundary '+z.boundary?.type)}}
          assert.strictEqual(w.status,'FINISHED');
          const sp=w.state.spatial,gk=sp.players['H-GK'];
          const pr=Number(w.state.ball.progress||.5)*100,lh=Number(w.state.structure.HOME.lineHeight||50);const gkBase=6+Math.max(-8,Math.min(10,(pr-50)*.18))+(lh-50)*.08;
          const residual=Math.abs(gk.x-gkBase),mids=['H-LCM','H-CM','H-RCM'].map(id=>sp.players[id].x),midSpread=Math.max(...mids)-Math.min(...mids),maxSpeed=Math.max(...Object.values(sp.players).map(p=>Math.hypot(p.vx||0,p.vy||0)));
          assert(residual>2.0,`GK causal offset collapsed: ${residual}`);assert(midSpread>1.5,`midfield rail spread too small: ${midSpread}`);assert(maxSpeed<8.5,`hybrid spatial speed spike: ${maxSpeed}`);assert.strictEqual(sp.source,'HYBRID_CONTINUOUS_FROM_V06');
          ok('HYBRID_SPATIAL_ASYMMETRY_RETENTION',{startGKX:startX,endGKX:gk.x,gkBase,residual,midSpread,maxSpeed});

          // D. Canonical guards must remain explicit in modified sources.
          const ctrl=fs.readFileSync('runtime/protagonist_match_controller.js','utf8'),hyb=fs.readFileSync('live_hybrid_session_v02.js','utf8');
          assert(ctrl.includes('futureOutcomePrecomputed:false'));assert(hyb.includes('futureOutcomePrecomputed:false'));assert(hyb.includes('choicePrecomputed:false'));
          ok('CANONICAL_NO_FUTURE_PRECOMPUTE');
          console.log(JSON.stringify({status:'PASS',count:results.length,results},null,2));
          NODE
          node /tmp/v05-followup-regression.js | tee /tmp/v05-followup-qa.json
      - name: Commit passing candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FLR V0.5 Follow-up Candidate'
          git config user.email 'actions@users.noreply.github.com'
          mkdir -p .flr
          cp /tmp/v05-followup-qa.json .flr/v05-followup-qa-status.json
          git add step71_hybrid_v06_ui.js runtime/protagonist_match_controller.js live_hybrid_session_v02.js .flr/v05-followup-qa-status.json
          git commit -m 'Fix three V0.5 user retest regressions'
          git push origin HEAD:candidate/v05-followup-20260823
