name: Build R25 user-test branch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r25-branch-apply-from-main.yml'

permissions:
  contents: write

jobs:
  build-r25-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r25-user-test
          fetch-depth: 0

      - name: Verify R23 lineage and apply R25
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor ecec4a51f25f396d6640d9762c10fe2bb33c3579 HEAD
          cat .flr/r25_patch_*.b64part | base64 -d | gunzip > /tmp/r25.patch
          patch --dry-run -p0 < /tmp/r25.patch
          patch -p0 < /tmp/r25.patch

      - name: Verify exact R25 hashes and syntax
        shell: bash
        run: |
          set -euo pipefail
          echo 'e8bf5ec8e71aba767e2dacfad2563d96e6b29b3e13f82c909d5c840cfd5bae92  index.html' | sha256sum -c -
          echo 'a8bbd8be0890786a424d01fc38d8c949a55b80067bb8314ef4fda9fbf95ad917  live_hybrid_session_v02.js' | sha256sum -c -
          echo '288a5021f172892d6b92e34bf2b18537028ebedf47fe1c199eb56f1540f99baf  runtime/hybrid_spatial_intent_v2.js' | sha256sum -c -
          echo 'fb57473cc9d9c5ab37f68f9b9ea70f21ab1d52f2c2409eebe5c1caf7d044dc4d  runtime/tactical_movement.js' | sha256sum -c -
          echo '325a9a9836a1685db6b6f10d91e4cecf9efa47f939f6e858978f1e1eb5f5a79d  scene_debug_export.js' | sha256sum -c -
          echo '6a1bdb951dee7365974069e36303ed5ccb0fe36f42f1144f3f288468089bdc86  step71_hybrid_v06_ui.js' | sha256sum -c -
          grep -q 'V0.5.4 R25 TEST' index.html
          node --check live_hybrid_session_v02.js
          node --check runtime/hybrid_spatial_intent_v2.js
          node --check runtime/tactical_movement.js
          node --check scene_debug_export.js
          node --check step71_hybrid_v06_ui.js

      - name: Commit clean R25 branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .flr/r25_patch_*.b64part .github/workflows/r25-apply.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Build R25 user test from R23 accepted baseline'
          git push origin HEAD:r25-user-test

