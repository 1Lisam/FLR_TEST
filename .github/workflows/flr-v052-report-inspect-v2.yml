name: FLR V0.5.2 report inspect v2

on:
  push:
    branches: [automation/v052-report-inspect]
    paths:
      - '.github/workflows/flr-v052-report-inspect-v2.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/v052-report-inspect
          fetch-depth: 0
      - name: Fetch five submitted report bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/reports
          for rid in \
            umt052-65749ef0-a4fb-420a-af16-f3cff1ebf37e \
            umt052-d90cd322-0396-4521-9382-0581b3e5f5f3 \
            umt052-31984cc7-cba8-4a12-9ec5-ec0d85aad37d \
            umt052-95ad81d7-096b-45ec-b464-d9ac2bdbffb3 \
            umt052-33b9e4a8-7f53-4fce-93f2-fccc560faa99; do
            curl -fsS "https://flr-bug-reporter.sikarops.workers.dev/reports/USER-MATCH-TEST-V0.5.2/${rid}.json" > "/tmp/reports/${rid}.json"
          done
      - name: Build compact diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, math
          desc={
          'umt052-65749ef0-a4fb-420a-af16-f3cff1ebf37e':'오프사이드 이후 즉시 뒤로 이동/상황 종료, 오프사이드 선 표시 요청',
          'umt052-d90cd322-0396-4521-9382-0581b3e5f5f3':'다시보기 재생 안 됨, 오프사이드 후 경기 진행 문제',
          'umt052-31984cc7-cba8-4a12-9ec5-ec0d85aad37d':'CM 및 선수들이 공을 졸졸 쫓는 느낌',
          'umt052-95ad81d7-096b-45ec-b464-d9ac2bdbffb3':'공격 시작 위치가 너무 깊고 종료 즈음 CM이 수비보다 아래로 내려감',
          'umt052-33b9e4a8-7f53-4fce-93f2-fccc560faa99':'LB에서 공 시작 시 플레이어/공격진이 GK 옆에서 시작'
          }
          def num(v):
              try:
                  x=float(v); return round(x,3) if math.isfinite(x) else None
              except: return None
          def pslim(p):
              if not isinstance(p,dict): return None
              vx,vy=num(p.get('vx')) or 0,num(p.get('vy')) or 0
              return {k:v for k,v in {'id':p.get('id'),'team':p.get('team'),'slot':p.get('slot'),'role':p.get('role'),'x':num(p.get('x')),'y':num(p.get('y')),'vx':num(p.get('vx')),'vy':num(p.get('vy')),'speed':round((vx*vx+vy*vy)**.5,3),'tacticalTask':p.get('tacticalTask'),'action':p.get('action'),'markTargetId':p.get('markTargetId'),'intent':p.get('intent'),'targetId':p.get('targetId')}.items() if v is not None}
          def fslim(f):
              if not isinstance(f,dict): return None
              b=f.get('ball') or {}
              return {'time':num(f.get('time')),'phase':f.get('phase'),'possession':f.get('possession'),'score':f.get('score'),'ball':{k:v for k,v in {'mode':b.get('mode'),'x':num(b.get('x')),'y':num(b.get('y')),'z':num(b.get('z')),'vx':num(b.get('vx')),'vy':num(b.get('vy')),'vz':num(b.get('vz')),'ownerId':b.get('ownerId')}.items() if v is not None},'players':[x for x in (pslim(p) for p in (f.get('players') or [])) if x]}
          def sample(a):
              if not isinstance(a,list) or not a:return []
              ids=sorted(set([0,len(a)//4,len(a)//2,3*len(a)//4,len(a)-1]))
              return [fslim(a[i]) for i in ids]
          def st(s):
              if not isinstance(s,dict):return None
              b=s.get('ball') or {}
              return {'second':num(s.get('second')),'phase':s.get('phase'),'possession':s.get('possession'),'score':s.get('score'),'ball':{k:v for k,v in {'mode':b.get('mode'),'x':num(b.get('x')),'y':num(b.get('y')),'z':num(b.get('z')),'ownerId':b.get('ownerId')}.items() if v is not None},'events':(s.get('resolvedEvents') or [])[-30:],'chain':(s.get('chain') or [])[-20:]}
          def sit(d):
              if not isinstance(d,dict):return None
              hb=d.get('hybridBefore') or {}; hr=d.get('highResolution') or {}; ha=d.get('hybridAfter') or {}
              return {'reportScope':d.get('reportScope'),'boundary':hb.get('boundary'),'hybridBeforeState':st(hb.get('state')),'entrySnapshot':fslim(hr.get('entrySnapshot')),'selectedChoice':hr.get('selectedChoice'),'decision':hr.get('decision'),'actualResult':hr.get('actualResult'),'actualEvents':(hr.get('actualEvents') or [])[-40:],'pre':sample(hr.get('preActionFrames')),'post':sample(hr.get('postActionFrames')),'episode':sample(hr.get('episodeFrames')),'hybridAfterState':st(ha.get('state'))}
          out={'schemaVersion':'FLR_V052_REPORT_INSPECT_1.1','reports':[]}
          for p in sorted(pathlib.Path('/tmp/reports').glob('*.json')):
              d=json.load(open(p,encoding='utf-8')); rid=p.stem
              out['reports'].append({'reportId':rid,'description':desc.get(rid),'context':d.get('bugReportContext'),'scope':d.get('scope'),'current':sit(d.get('currentSituation')),'previous':sit(d.get('previousSituation'))})
          pathlib.Path('.flr/v052-user-report-inspect.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('reports',len(out['reports']))
          PY
      - name: Commit diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FLR V052 Report Inspect Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .flr/v052-user-report-inspect.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record V0.5.2 user report diagnostic'
          git push origin HEAD:automation/v052-report-inspect
