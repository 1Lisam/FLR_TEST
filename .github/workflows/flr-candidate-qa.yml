name: FLR Candidate QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.flr/candidate-qa-request.json'

permissions:
  contents: write

concurrency:
  group: flr-candidate-qa
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout QA control
        uses: actions/checkout@v4
        with:
          ref: main
          path: control
          fetch-depth: 1

      - name: Read QA request
        id: cfg
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json,re
          p='control/.flr/candidate-qa-request.json'
          c=json.load(open(p,encoding='utf-8'))
          vals={'version':c['version'],'branch':c['candidateBranch'],'baseline':c.get('baselineRef','main'),'result_dir':c['resultDir']}
          pat=re.compile(r'^[A-Za-z0-9._/\-]+$')
          for k,v in vals.items():
              if not isinstance(v,str) or not v or not pat.fullmatch(v) or '..' in v.split('/'):
                  raise SystemExit(f'unsafe config {k}={v!r}')
              print(f'{k}={v}')
          PY

      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.cfg.outputs.branch }}
          path: candidate
          fetch-depth: 1

      - name: Checkout baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.cfg.outputs.baseline }}
          path: baseline
          fetch-depth: 1

      - name: Run candidate QA
        id: qa
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python control/.flr/candidate_qa_runner.py \
            --config control/.flr/candidate-qa-request.json \
            --candidate candidate \
            --baseline baseline \
            --work qa-work \
            --out qa-out
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Persist QA result on candidate branch
        if: always()
        shell: bash
        env:
          RESULT_DIR: ${{ steps.cfg.outputs.result_dir }}
          VERSION: ${{ steps.cfg.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "candidate/$RESULT_DIR"
          cp -f qa-out/CI_RESULT.json "candidate/$RESULT_DIR/CI_RESULT.json" 2>/dev/null || true
          cp -f qa-out/validation.json "candidate/$RESULT_DIR/validation.json" 2>/dev/null || true
          cp -f qa-out/baseline.json "candidate/$RESULT_DIR/baseline.json" 2>/dev/null || true
          cp -f qa-out/candidate.patch "candidate/$RESULT_DIR/candidate.patch" 2>/dev/null || true
          cp -f qa-out/candidate.patch.sha256 "candidate/$RESULT_DIR/candidate.patch.sha256" 2>/dev/null || true
          git -C candidate config user.name "FLR Candidate QA"
          git -C candidate config user.email "actions@users.noreply.github.com"
          git -C candidate add "$RESULT_DIR"
          git -C candidate diff --cached --quiet || {
            git -C candidate commit -m "Record ${VERSION} candidate QA result"
            git -C candidate push origin "HEAD:${{ steps.cfg.outputs.branch }}"
          }

      - name: Publish QA status without expected-failure email
        if: always()
        shell: bash
        env:
          RESULT_DIR: ${{ steps.cfg.outputs.result_dir }}
          QA_CODE: ${{ steps.qa.outputs.code }}
        run: |
          set -euo pipefail
          result="candidate/$RESULT_DIR/CI_RESULT.json"
          if [ ! -s "$result" ]; then
            echo "::error::Candidate QA infrastructure failed: CI_RESULT.json was not produced."
            exit 1
          fi
          status="$(python -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="utf-8")).get("workflowStatus","UNKNOWN"))' "$result")"
          if [ "${QA_CODE:-99}" != "0" ] || [ "$status" != "PASS" ]; then
            echo "::warning::Candidate did not pass QA (status=$status, code=${QA_CODE:-99}). This is recorded in CI_RESULT.json and is not treated as a workflow failure."
          else
            echo "Candidate QA passed."
          fi

      - name: Promote passing candidate when explicitly requested
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib,shutil,subprocess
          cfg=json.loads(pathlib.Path('control/.flr/candidate-qa-request.json').read_text(encoding='utf-8'))
          if cfg.get('promoteValidated') is not True:
              print('Promotion not requested.'); raise SystemExit(0)
          result=json.loads(pathlib.Path('qa-out/CI_RESULT.json').read_text(encoding='utf-8'))
          if result.get('workflowStatus')!='PASS' or result.get('validationExitCode')!=0:
              raise SystemExit('PROMOTION_BLOCKED_QA_NOT_PASS')
          expected=cfg.get('expectedPatchSha256')
          if expected and result.get('patchSha256')!=expected:
              raise SystemExit(f"PROMOTION_PATCH_SHA_MISMATCH expected={expected} actual={result.get('patchSha256')}")
          subprocess.check_call(['git','-C','baseline','fetch','origin','main'])
          head=subprocess.check_output(['git','-C','baseline','rev-parse','HEAD'],text=True).strip()
          remote=subprocess.check_output(['git','-C','baseline','rev-parse','origin/main'],text=True).strip()
          if head!=remote:
              raise SystemExit(f'PROMOTION_MAIN_MOVED baseline={head} remote={remote}')
          changed=result.get('changedFiles') or []
          allowed=cfg.get('changedFiles') or []
          if set(changed)!=set(allowed):
              raise SystemExit('PROMOTION_CHANGED_FILES_MISMATCH')
          for rel in changed:
              src=pathlib.Path('qa-work')/rel; dst=pathlib.Path('baseline')/rel
              if src.exists():
                  dst.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(src,dst)
              elif dst.exists():
                  dst.unlink()
          pathlib.Path('/tmp/flr_promote_files').write_text('\n'.join(changed)+'\n',encoding='utf-8')
          PY
          promote="$(python -c 'import json; print("true" if json.load(open("control/.flr/candidate-qa-request.json",encoding="utf-8")).get("promoteValidated") is True else "false")')"
          [ "$promote" = true ] || exit 0
          git -C baseline config user.name 'FLR Test Deploy Bot'
          git -C baseline config user.email 'actions@users.noreply.github.com'
          while IFS= read -r f; do [ -z "$f" ] || git -C baseline add -- "$f"; done < /tmp/flr_promote_files
          git -C baseline diff --cached --quiet && { echo 'PROMOTION_NO_CHANGES'; exit 1; }
          msg="$(python -c 'import json; print(json.load(open("control/.flr/candidate-qa-request.json",encoding="utf-8")).get("promotionCommitMessage") or "Promote validated FLR candidate")')"
          git -C baseline commit -m "$msg"
          git -C baseline push origin HEAD:main
