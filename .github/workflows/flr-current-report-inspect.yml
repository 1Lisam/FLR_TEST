name: FLR Current Report Inspect

on:
  push:
    branches: [main]
    paths:
      - '.flr/current-report-inspect-request.json'

permissions:
  contents: write

concurrency:
  group: flr-current-report-inspect
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Query D1 and fetch requested build bundles
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          r=json.loads(pathlib.Path('.flr/current-report-inspect-request.json').read_text(encoding='utf-8'))
          pathlib.Path('/tmp/request.json').write_text(json.dumps(r),encoding='utf-8')
          pathlib.Path('/tmp/query_payload.json').write_text(json.dumps({'sql':'SELECT report_id, build, created_at, category, priority, description, size_bytes, chunk_count FROM bug_reports ORDER BY created_at DESC LIMIT 100'}),encoding='utf-8')
          PY
          npx --yes wrangler@latest d1 list --json > /tmp/dbs.json
          dbid="$(python -c "import json; j=json.load(open('/tmp/dbs.json')); print(next(((r.get('uuid') or r.get('id') or '') for r in j if r.get('name')=='flr-bug-reports'),''))")"
          test -n "$dbid"
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${dbid}/query" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/query_payload.json > /tmp/query.json
          mkdir -p /tmp/reports
          python - <<'PY' > /tmp/rows.tsv
          import json
          req=json.load(open('/tmp/request.json')); q=json.load(open('/tmp/query.json'))
          assert q.get('success') is True
          rows=((q.get('result') or [{}])[0].get('results') or [])
          build=req['build']; limit=int(req.get('limit',10)); picked=[r for r in rows if r.get('build')==build][:limit]
          for r in picked:
              if int(r.get('chunk_count') or 0)>0:
                  print(r['report_id']+'\t'+r['build'])
          json.dump(picked,open('/tmp/picked.json','w'),ensure_ascii=False)
          PY
          while IFS=$'\t' read -r rid build; do
            [ -n "$rid" ] || continue
            curl -fsS "https://flr-bug-reporter.sikarops.workers.dev/reports/${build}/${rid}.json" > "/tmp/reports/${rid}.json"
          done < /tmp/rows.tsv
      - name: Build compact diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, math
          req=json.load(open('/tmp/request.json')); rows=json.load(open('/tmp/picked.json')); byid={r['report_id']:r for r in rows}
          def num(v):
              try:
                  x=float(v); return round(x,3) if math.isfinite(x) else None
              except: return None
          def pslim(p):
              if not isinstance(p,dict): return None
              vx,vy=num(p.get('vx')) or 0,num(p.get('vy')) or 0
              d={'id':p.get('id'),'team':p.get('team'),'slot':p.get('slot'),'role':p.get('role'),'x':num(p.get('x')),'y':num(p.get('y')),'vx':num(p.get('vx')),'vy':num(p.get('vy')),'speed':round((vx*vx+vy*vy)**0.5,3),'tacticalTask':p.get('tacticalTask'),'action':p.get('action'),'markTargetId':p.get('markTargetId'),'intent':p.get('intent'),'targetId':p.get('targetId')}
              return {k:v for k,v in d.items() if v is not None}
          def fslim(f):
              if not isinstance(f,dict): return None
              b=f.get('ball') or {}
              bd={'mode':b.get('mode'),'x':num(b.get('x')),'y':num(b.get('y')),'z':num(b.get('z')),'vx':num(b.get('vx')),'vy':num(b.get('vy')),'vz':num(b.get('vz')),'ownerId':b.get('ownerId')}
              return {'time':num(f.get('time')),'phase':f.get('phase'),'possession':f.get('possession'),'score':f.get('score'),'ball':{k:v for k,v in bd.items() if v is not None},'players':[x for x in (pslim(p) for p in (f.get('players') or [])) if x]}
          def samples(a):
              if not isinstance(a,list) or not a:return []
              idx=sorted(set([0,len(a)//4,len(a)//2,3*len(a)//4,len(a)-1]))
              return [fslim(a[i]) for i in idx]
          def st(s):
              if not isinstance(s,dict): return None
              b=s.get('ball') or {}; bd={'mode':b.get('mode'),'x':num(b.get('x')),'y':num(b.get('y')),'z':num(b.get('z')),'ownerId':b.get('ownerId')}
              return {'second':num(s.get('second')),'phase':s.get('phase'),'possession':s.get('possession'),'score':s.get('score'),'ball':{k:v for k,v in bd.items() if v is not None},'resolvedEvents':(s.get('resolvedEvents') or [])[-30:],'chain':(s.get('chain') or [])[-20:]}
          def sit(d):
              if not isinstance(d,dict): return None
              hb=d.get('hybridBefore') or {}; hr=d.get('highResolution') or {}; ha=d.get('hybridAfter') or {}
              return {'reportScope':d.get('reportScope'),'boundary':hb.get('boundary'),'hybridBeforeState':st(hb.get('state')),'entrySnapshot':fslim(hr.get('entrySnapshot')),'selectedChoice':hr.get('selectedChoice'),'decision':hr.get('decision'),'actualResult':hr.get('actualResult'),'actualEvents':(hr.get('actualEvents') or [])[-40:],'preActionSamples':samples(hr.get('preActionFrames')),'postActionSamples':samples(hr.get('postActionFrames')),'episodeSamples':samples(hr.get('episodeFrames')),'hybridAfterState':st(ha.get('state'))}
          out={'schemaVersion':'FLR_CURRENT_REPORT_INSPECT_1.0','build':req['build'],'requestedAt':req.get('requestedAt'),'count':len(rows),'reports':[]}
          for r in rows:
              rid=r['report_id']; p=pathlib.Path('/tmp/reports')/(rid+'.json')
              item={'meta':r,'hasAttachedBundle':p.is_file()}
              if p.is_file():
                  d=json.load(open(p,encoding='utf-8')); item.update({'context':d.get('bugReportContext'),'scope':d.get('scope'),'current':sit(d.get('currentSituation')),'previous':sit(d.get('previousSituation'))})
              out['reports'].append(item)
          pathlib.Path('.flr/current-report-inspect-status.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('reports',len(out['reports']))
          PY
      - name: Commit inspection status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FLR Report Inspect Bot'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase origin main || true
          git add .flr/current-report-inspect-status.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record current FLR report inspection'
          git push origin HEAD:main
