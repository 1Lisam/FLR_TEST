name: FLR V30 Handoff Source Export

on:
  push:
    branches: [r23-r22-report-fixes]
    paths:
      - '.github/workflows/flr-v30-handoff-export.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r23-r22-report-fixes
      - name: Prepare exact R23 source tree
        run: |
          set -euo pipefail
          mkdir -p /tmp/R23_PRODUCTION_SOURCE
          rsync -a --exclude='.git' --exclude='.github/workflows/flr-v30-handoff-export.yml' ./ /tmp/R23_PRODUCTION_SOURCE/
          printf '%s\n' 'R23 production gameplay tree exported from r23-r22-report-fixes.' > /tmp/R23_PRODUCTION_SOURCE/EXPORTED_FOR_V30.txt
          printf '%s\n' "SOURCE_COMMIT=${GITHUB_SHA}" >> /tmp/R23_PRODUCTION_SOURCE/EXPORTED_FOR_V30.txt
      - uses: actions/upload-artifact@v4
        with:
          name: flr-v30-r23-source-${{ github.run_id }}
          path: /tmp/R23_PRODUCTION_SOURCE
          if-no-files-found: error
          retention-days: 2
