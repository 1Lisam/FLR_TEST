name: FLR R23 Exact Spatial Seed
on:
  push:
    branches: [r23-r22-report-fixes]
    paths: ['.github/workflows/flr-r23-qa1.yml']
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {ref: r23-r22-report-fixes}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Exact reported formation seed
        run: |
          node - <<'NODE'
          const path=require('path'),H=require('./live_hybrid_session_v02.js'),A=require('./live_v06_scene_authority_browser.js');
          const d=H.createDeveloperScenario({key:'FORMATION_CONTINUITY',seed:'DEV-RECENT-1787734109353-14'}),s=d.boundary.stateSnapshot,sp=s.spatial.players,l=(t,p)=>t==='HOME'?{x:p.x,y:p.y}:{x:105-p.x,y:68-p.y};
          const st=l('HOME',sp['H-ST']),lw=l('HOME',sp['H-LW']),rw=l('HOME',sp['H-RW']),cm=['H-LCM','H-CM','H-RCM'].map(id=>l('HOME',sp[id]).x),cmAvg=cm.reduce((a,b)=>a+b,0)/3,wingAvg=(lw.x+rw.x)/2,wingMax=Math.max(lw.x,rw.x),backs=['A-LB','A-LCB','A-RCB','A-RB'].map(id=>l('HOME',sp[id]).x),oppLine=backs.reduce((a,b)=>a+b,0)/4,transition=s.phase==='TRANSITION';
          const contextOK=transition||st.x>=68||(wingMax<=st.x+9&&wingAvg<=64&&oppLine>=65),isolated=!transition&&st.x<68&&Math.abs(st.x-cmAvg)<5&&wingAvg>68;
          console.log('R23_QA1_STATE',JSON.stringify({at:s.second,phase:s.phase,owner:s.ball.ownerId,stX:st.x,cmAvg,wingAvg,wingMax,oppLine,contextOK,isolated,front:['A-LW','A-ST','A-RW'].map(id=>({id,...sp[id]}))},null,2));
          if(!contextOK||isolated)throw new Error('R23_QA1 spatial coherence failed');
          const hi=A.seedMatch(d.boundary,{runtimeDir:path.join(process.cwd(),'runtime'),seed:'R23-QA1-FACING',explicitHeroChoiceRequired:true}),ast=hi.state.m.players.find(p=>p.id==='A-ST'),speed=Math.hypot(ast.vx,ast.vy),want=Math.atan2(ast.vy,ast.vx);let er=(ast.bodyAngle-want)%(Math.PI*2);if(er>Math.PI)er-=Math.PI*2;if(er<-Math.PI)er+=Math.PI*2;er=Math.abs(er);console.log('R23_QA1_FACING',JSON.stringify({speed,bodyAngle:ast.bodyAngle,want,error:er}));if(speed>.35&&er>.08)throw new Error('R23_QA1 facing failed');
          console.log('R23_QA1: PASS');
          NODE
      - name: Clean workflow
        run: |
          rm -f .github/workflows/flr-r23-qa1.yml
          git config user.name 'FLR R23 QA Bot'; git config user.email 'actions@users.noreply.github.com'; git add -A; git commit -m 'chore: remove temporary R23 QA1 workflow'; git push origin HEAD:r23-r22-report-fixes
