name: FLR R15 one-shot atomic deploy

on:
  push:
    branches: [main]
    paths:
      - '.flr/r15-deploy-trigger-v2.json'

permissions:
  contents: write

concurrency:
  group: flr-r15-one-shot-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify untouched R14 bases
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, pathlib
          expected = {
            'CHANGELOG.md':'1890525295a00c1377925f610fc8ef86a3cef1f1d3918f44e2ae6b604c37e784',
            'in_pitch_choice_ui.js':'5613fac56b9c843336d63bb3ae9eebb173e3e6b6077ddf666190445c6d1330e5',
            'index.html':'4b465dc46cacba402ed200b723edf59dff73cdc4b9ab9e2d45a29434b953d64a',
            'live_hybrid_session_v02.js':'bf853df4e309dca9920209fdf049977b3d83106a5930d658f0bab465f144073e',
            'live_v06_scene_authority_browser.js':'765f09cbcd9b98426557b6a0a0958d1b1297cf1599909272ebf767beb25fd5b8',
            'runtime/continuous_match_core.js':'d8c5f2cdbfd8d26102b31b47668de72bff57826155ad82f13d2fccfba355a966',
            'runtime/protagonist_match_controller.js':'3671f2a458600da48b0000f61523982bfda1052ed9873b99bc7fd4c394a24e6e',
            'runtime/tactical_movement.js':'4ea7b4fd3f997806d7950d9f17796d3e6288d1d0d81ed9d741fa1fa979ac3dcc',
            'runtime/technical_test.css':'0cf94f95243e9cc4874cee9fdadf938e6013aad6ee96f9f6cc09b496a3f7af4a',
            'step71_hybrid_v06_ui.js':'1e583a4270d607effd13e6e4ab7cbad37f547926080de70e409ae58de0c6dc20',
          }
          for path, want in expected.items():
              got = hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()
              if got != want:
                  raise SystemExit(f'BASE_HASH_MISMATCH {path} expected={want} got={got}')
          print('R14_BASE_HASHES_OK')
          PY

      - name: Apply sealed old R15 patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .flr/r15-deploy.patch.gz.b64 > /tmp/r15-old.patch.gz
          gzip -dc /tmp/r15-old.patch.gz > /tmp/r15-old.patch
          git apply --check /tmp/r15-old.patch
          git apply /tmp/r15-old.patch
          python - <<'PY'
          import hashlib, pathlib
          expected = {
            'CHANGELOG.md':'1890525295a00c1377925f610fc8ef86a3cef1f1d3918f44e2ae6b604c37e784',
            'in_pitch_choice_ui.js':'5613fac56b9c843336d63bb3ae9eebb173e3e6b6077ddf666190445c6d1330e5',
            'index.html':'50303dd018297cff4ad1e86cb883473d65ed32b630a26bf343f39dc4ae85f597',
            'live_hybrid_session_v02.js':'56e1bdf3cdfe1d193f5b4a58864f2638d9b40294323fceaf5b9bece18f2f78bb',
            'live_v06_scene_authority_browser.js':'0b312d456b7d92a742d59ac4d9245ea511eb2bb404fe966743133edc050ae862',
            'runtime/continuous_match_core.js':'b0bcc35d40ce4417959ad8dbdd0b75118358f07d423ecc19111063ada2c0683d',
            'runtime/protagonist_match_controller.js':'ccfa63abef2c168f8ebccc6eda168592fc0a9161184ea0f75a59f161637cf7d6',
            'runtime/tactical_movement.js':'f3ac5ec59101e0a57648be6299ac73dfd8178159cc1b74a5c18bf5e2586dd57a',
            'runtime/technical_test.css':'0cf94f95243e9cc4874cee9fdadf938e6013aad6ee96f9f6cc09b496a3f7af4a',
            'step71_hybrid_v06_ui.js':'588ba0290c10aac65e6aad8a3c47c218631c75ec725dd249ad24777ed2025ec7',
          }
          for path, want in expected.items():
              got = hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()
              if got != want:
                  raise SystemExit(f'OLD_R15_HASH_MISMATCH {path} expected={want} got={got}')
          print('OLD_R15_HASHES_OK')
          PY

      - name: Apply exact meaningful-choice delta
        shell: bash
        run: |
          set -euo pipefail
          echo 'e59e4d3602ebc654c87063c527ba1658b3b0f8b9e62217a62eb4a48324f5184e  .flr/r15-delta.part00' | sha256sum -c -
          echo '177033f8c00b457c9711222fe1383e261c6df89759cbc3a8177421ca1a874a82  .flr/r15-delta.part01' | sha256sum -c -
          echo '1a4205e680d68c536b9df334e77a343eda664f24ee4ee4ee1319209c7dfba6e2  .flr/r15-delta.part02' | sha256sum -c -
          echo 'b55929d14145ca2531be9d96255625be84342f3540892cda81a185da8d912f3f  .flr/r15-delta.part03' | sha256sum -c -
          cat .flr/r15-delta.part00 .flr/r15-delta.part01 .flr/r15-delta.part02 .flr/r15-delta.part03 > /tmp/r15-delta.b64
          echo '37fb31aad75851a084a0ad195d394210e6dc2ebe1c9263e4049eb950305d6d37  /tmp/r15-delta.b64' | sha256sum -c -
          base64 -d /tmp/r15-delta.b64 > /tmp/r15-delta.gz
          echo 'bdb256aa9613ed304f4f32d3517e18e8d04b1f6712339d78cae71f69453defae  /tmp/r15-delta.gz' | sha256sum -c -
          gzip -dc /tmp/r15-delta.gz > /tmp/r15-delta.patch
          echo '1a7236fa9a054063df2b215ed3726e33c18de96adcb555946a97151f75f73347  /tmp/r15-delta.patch' | sha256sum -c -
          git apply --check /tmp/r15-delta.patch
          git apply /tmp/r15-delta.patch

      - name: Verify exact final R15 candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, pathlib
          expected = {
            'CHANGELOG.md':'f166a3f128e7685cbe14c3de4d0b58db1768fe906f99a89b4591f5c72e9b42cb',
            'in_pitch_choice_ui.js':'a2bfa1552563ca776c07c0348dea63d940caae1dbb9fdad7617726f97b343c24',
            'index.html':'0a104c9f78782cda12d6c9a985917e39d19c671839f70c0428b58a73907377e3',
            'live_hybrid_session_v02.js':'56e1bdf3cdfe1d193f5b4a58864f2638d9b40294323fceaf5b9bece18f2f78bb',
            'live_v06_scene_authority_browser.js':'0b312d456b7d92a742d59ac4d9245ea511eb2bb404fe966743133edc050ae862',
            'runtime/continuous_match_core.js':'b0bcc35d40ce4417959ad8dbdd0b75118358f07d423ecc19111063ada2c0683d',
            'runtime/protagonist_match_controller.js':'49ee935d7983c5f4888a3648e9943577f6415b90bafd811c4a020a31485752a5',
            'runtime/tactical_movement.js':'f3ac5ec59101e0a57648be6299ac73dfd8178159cc1b74a5c18bf5e2586dd57a',
            'runtime/technical_test.css':'91878c1277eccf67101a0a3f2f0cef0fcf49f6080b3340167eaa7d3de12d8ff6',
            'step71_hybrid_v06_ui.js':'302dd9900f4fe47ecc712a215527d2939ddc41234d0be0c80d5ea9c627f0f730',
          }
          for path, want in expected.items():
              got = hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()
              if got != want:
                  raise SystemExit(f'FINAL_HASH_MISMATCH {path} expected={want} got={got}')
          print('FINAL_R15_HASHES_OK')
          PY
          grep -q 'V0.5.4 R15 TEST' index.html
          grep -q 'USER-MATCH-TEST-V0.5.4-R15' step71_hybrid_v06_ui.js
          node --check in_pitch_choice_ui.js
          node --check live_hybrid_session_v02.js
          node --check live_v06_scene_authority_browser.js
          node --check step71_hybrid_v06_ui.js
          node --check runtime/continuous_match_core.js
          node --check runtime/protagonist_match_controller.js
          node --check runtime/tactical_movement.js

      - name: Commit final R15 and remove deploy helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FLR R15 Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f .flr/r15-deploy.patch.gz.b64 .flr/r15-one-shot-trigger.json || true
          git rm -f .flr/r15-choice-ux.part00 .flr/r15-choice-ux.part01 .flr/r15-choice-ux.part02 .flr/r15-choice-ux.part03 .flr/r15-choice-ux.part04 .flr/r15-choice-ux.part05 .flr/r15-choice-ux.part06 || true
          git rm -f .flr/r15-delta.part00 .flr/r15-delta.part01 .flr/r15-delta.part02 .flr/r15-delta.part03
          git rm -f .flr/r15-deploy-issue-trigger-required.txt .flr/r15-deploy-ready.json .flr/r15-deploy-trigger-guard.txt .flr/r15-deploy-trigger-note.json .flr/r15-deploy-trigger-v2.json || true
          git rm -f .github/workflows/flr-r15-one-shot-deploy.yml
          git add CHANGELOG.md in_pitch_choice_ui.js index.html live_hybrid_session_v02.js live_v06_scene_authority_browser.js runtime/continuous_match_core.js runtime/protagonist_match_controller.js runtime/tactical_movement.js runtime/technical_test.css step71_hybrid_v06_ui.js
          git commit -m 'Deploy USER-MATCH-TEST V0.5.4 R15 meaningful choice UX'
          git push origin HEAD:main
