name: FLR Historical V0.4 PR Audit

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  audit:
    if: github.event.pull_request.title == '[FLR_AUDIT] HISTORICAL V0.4 REFINED'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout audit control
        uses: actions/checkout@v4
        with:
          ref: main
          path: audit
          fetch-depth: 1
      - name: Checkout exact public V0.3 authority
        uses: actions/checkout@v4
        with:
          ref: 53c9a69bdc6a99608c167b5523b2f83dfb0fb25a
          path: engine
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact authority
        shell: bash
        run: |
          test "$(git -C engine rev-parse HEAD)" = "53c9a69bdc6a99608c167b5523b2f83dfb0fb25a"
          echo "ENGINE_SHA=$(git -C engine rev-parse HEAD)"
      - name: Run historical open gates
        shell: bash
        run: |
          set -euo pipefail
          node --check audit/.flr/historical_open_gates_v04.js
          set +e
          node audit/.flr/historical_open_gates_v04.js engine > /tmp/historical-v04-open-gates.json
          rc=$?
          set -e
          cat /tmp/historical-v04-open-gates.json
          python - <<'PY'
          import json, pathlib, sys
          p=pathlib.Path('/tmp/historical-v04-open-gates.json')
          try:
              data=json.loads(p.read_text(encoding='utf-8'))
          except Exception as e:
              print(f'QA_INFRA_FAILURE: invalid or missing audit JSON: {e}', file=sys.stderr)
              sys.exit(2)
          status=data.get('status')
          if status not in ('PASS','FAIL'):
              print(f'QA_INFRA_FAILURE: unexpected status={status!r}', file=sys.stderr)
              sys.exit(2)
          print(f'QA_GATE_STATUS={status} (node_exit={"$rc"})')
          PY
          # A valid QA FAIL is a development result, not an Actions incident.
          # Only broken scripts, missing output, invalid JSON, checkout errors, etc. fail the workflow.
          exit 0
