name: deploy-v34-gk-visual-runner-terminal-aware
on:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-v34-gk-visual-runner-terminal-aware.yml']
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch visual runner and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('step71_hybrid_v06_ui.js')
          s=p.read_text()
          old="let outcomeEvent=null,tail=0;for(let i=0;i<100;i++){E.step(m,.05);frames.push(deep(E.snapshot(m)));if(!outcomeEvent)outcomeEvent=[...(m.events||[])].reverse().find(e=>e?.npcGkOutcome);if(outcomeEvent){tail++;const need=outcomeEvent.npcGkOutcome==='CATCH'?12:30;if(tail>=need)break;}}\n const actual=outcomeEvent?.npcGkOutcome||null;"
          new="let outcomeEvent=null,terminalEvent=null,tail=0;for(let i=0;i<180;i++){E.step(m,.05);frames.push(deep(E.snapshot(m)));if(!outcomeEvent)outcomeEvent=[...(m.events||[])].reverse().find(e=>e?.npcGkOutcome);if(c.expectedTerminal&&!terminalEvent)terminalEvent=[...(m.events||[])].reverse().find(e=>e?.type===c.expectedTerminal);if(outcomeEvent){tail++;const terminalReady=!c.expectedTerminal||!!terminalEvent;const need=outcomeEvent.npcGkOutcome==='CATCH'?12:(c.expectedTerminal==='CORNER'?44:30);if(terminalReady&&tail>=need)break;}}\n const actual=outcomeEvent?.npcGkOutcome||null,terminalActual=terminalEvent?.type||null;"
          if old not in s: raise SystemExit('runner loop anchor missing')
          s=s.replace(old,new,1)
          old2="const status=actual===c.expected?`이번 검증: ${c.label} · 실제 결과 ${actual} · ${c.instruction}`:`강제 검증 불일치 · 기대 ${c.expected} / 실제 ${actual||'NONE'} · 이 장면은 정상 판정에 사용하지 마세요.`;"
          new2="const terminalOk=!c.expectedTerminal||terminalActual===c.expectedTerminal,status=actual===c.expected&&terminalOk?`이번 검증: ${c.label} · 실제 결과 ${actual}${c.expectedTerminal?` → ${terminalActual}`:''} · ${c.instruction}`:`강제 검증 불일치 · 기대 ${c.expected}${c.expectedTerminal?` → ${c.expectedTerminal}`:''} / 실제 ${actual||'NONE'}${c.expectedTerminal?` → ${terminalActual||'NONE'}`:''} · 이 장면은 정상 판정에 사용하지 마세요.`;"
          if old2 not in s: raise SystemExit('status anchor missing')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
          node --check step71_hybrid_v06_ui.js
          git diff --check
          grep -F "for(let i=0;i<180;i++)" step71_hybrid_v06_ui.js
          grep -F "terminalReady" step71_hybrid_v06_ui.js
          grep -F "terminalOk" step71_hybrid_v06_ui.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add step71_hybrid_v06_ui.js
          git diff --cached --quiet && { echo 'no ui changes'; exit 1; }
          git commit -m 'Fix GK visual runner terminal wait (TEST_ONLY)'
          git push origin HEAD:main
