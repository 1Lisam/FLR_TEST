name: FLR R20 One Shot Deploy

on:
  issues:
    types: [opened]

permissions:
  contents: write

concurrency:
  group: flr-r20-one-shot-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.issue.title == '[FLR_DEPLOY] R20 ONE SHOT'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout staged R20 patch
        uses: actions/checkout@v4
        with:
          ref: r20-deploy-20260825
          path: _incoming
          fetch-depth: 1

      - name: Verify exact R19 production baseline
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          expected={
            'CHANGELOG.md':'5e82aa0d8d2791a9b87091fc4d7f11913701d70b',
            'index.html':'40ac8998c5828819cc7e7ee6cac4c6a7b3c26e92',
            'step71_hybrid_v06_ui.js':'d5fc9bf964781e8a2dc9aa01ef9cf47d316dde9e',
            'live_hybrid_session_v02.js':'fc787eac5bf451ea346b911965d35290539a76bf',
            'live_v06_scene_authority_browser.js':'735dbcd3dc054e4a252a5b7a25317797c14b2f42',
            'runtime/tactical_movement.js':'69a677fb2286591c3d72103d02f7b35f9bb48c7a',
            'runtime/protagonist_match_controller.js':'42f6463e82510e753b9293709334c071572b7a45',
            'runtime/continuous_match_core.js':'d80b9c6c9f0a88eba8ef58e282857e6b2f15a946',
            'runtime/hybrid_spatial_intent_v2.js':'0a828b14ab1f18c2c28ed6b239a5ca355b069ceb',
          }
          for path,want in expected.items():
              got=subprocess.check_output(['git','hash-object',path],text=True).strip()
              if got!=want: raise SystemExit(f'BASELINE_SHA_MISMATCH {path} expected={want} actual={got}')
          print('R19_PRODUCTION_BASELINE_OK')
          PY

      - name: Reassemble and verify R20 patch
        shell: bash
        run: |
          set -euo pipefail
          cat _incoming/.flr/r20.patch.gz.b64.part00 _incoming/.flr/r20.patch.gz.b64.part01 | base64 -d | gzip -dc > /tmp/r20.patch
          echo '607a3bf5435a7459fb861b69512133a636722028c17089315b952639cd9728fd  /tmp/r20.patch' | sha256sum -c -
          git apply --check /tmp/r20.patch
          git apply /tmp/r20.patch
          rm -rf _incoming

      - name: Validate R20 runtime payload
        shell: bash
        run: |
          set -euo pipefail
          changed=(
            CHANGELOG.md
            index.html
            step71_hybrid_v06_ui.js
            live_hybrid_session_v02.js
            live_v06_scene_authority_browser.js
            runtime/tactical_movement.js
            runtime/protagonist_match_controller.js
            runtime/continuous_match_core.js
            runtime/hybrid_spatial_intent_v2.js
          )
          for f in "${changed[@]}"; do
            if [[ "$f" == *.js ]]; then node --check "$f"; fi
          done
          grep -Fq 'V0.5.4 R20 TEST' index.html
          grep -Fq 'USER-MATCH-TEST-V0.5.4-R20' step71_hybrid_v06_ui.js
          grep -Fq 'liveRunningFinish' runtime/protagonist_match_controller.js
          grep -Fq 'advanceNaturalDeveloperContext' live_hybrid_session_v02.js
          git diff --check

      - name: Commit R20 atomically to main and clean temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FLR Test Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          changed=(
            CHANGELOG.md
            index.html
            step71_hybrid_v06_ui.js
            live_hybrid_session_v02.js
            live_v06_scene_authority_browser.js
            runtime/tactical_movement.js
            runtime/protagonist_match_controller.js
            runtime/continuous_match_core.js
            runtime/hybrid_spatial_intent_v2.js
          )
          git add -- "${changed[@]}"
          rm -f .github/workflows/flr-r20-one-shot-deploy.yml .github/workflows/flr-r20-source-export.yml .flr/r20-source-export-trigger.json
          git add -A -- .github/workflows/flr-r20-one-shot-deploy.yml .github/workflows/flr-r20-source-export.yml .flr/r20-source-export-trigger.json
          staged_runtime=$(git diff --cached --name-only | grep -vE '^\.github/workflows/flr-r20-(one-shot-deploy|source-export)\.yml$|^\.flr/r20-source-export-trigger\.json$' | sort)
          expected_runtime=$(printf '%s\n' "${changed[@]}" | sort)
          test "$staged_runtime" = "$expected_runtime"
          git commit -m 'Deploy USER-MATCH-TEST V0.5.4 R20 live continuity fixes'
          git push origin main
