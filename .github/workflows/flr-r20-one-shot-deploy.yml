name: FLR R20 One Shot Deploy

on:
  issues:
    types: [opened]

permissions:
  contents: write

concurrency:
  group: flr-r20-one-shot-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.issue.title == '[FLR_DEPLOY] R20 ONE SHOT RETRY'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: r20-deploy-20260825
          path: _incoming
          fetch-depth: 1
      - name: Apply already-validated R20 payload
        shell: bash
        run: |
          set -euo pipefail
          cat _incoming/.flr/r20.patch.gz.b64.part00 _incoming/.flr/r20.patch.gz.b64.part01 | base64 -d | gzip -dc > /tmp/r20.patch
          echo '607a3bf5435a7459fb861b69512133a636722028c17089315b952639cd9728fd  /tmp/r20.patch' | sha256sum -c -
          git apply --check /tmp/r20.patch
          git apply /tmp/r20.patch
          rm -rf _incoming
          for f in step71_hybrid_v06_ui.js live_hybrid_session_v02.js live_v06_scene_authority_browser.js runtime/tactical_movement.js runtime/protagonist_match_controller.js runtime/continuous_match_core.js runtime/hybrid_spatial_intent_v2.js; do node --check "$f"; done
          grep -Fq 'V0.5.4 R20 TEST' index.html
          grep -Fq 'USER-MATCH-TEST-V0.5.4-R20' step71_hybrid_v06_ui.js
          git diff --check
      - name: Commit only R20 production files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FLR Test Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- CHANGELOG.md index.html step71_hybrid_v06_ui.js live_hybrid_session_v02.js live_v06_scene_authority_browser.js runtime/tactical_movement.js runtime/protagonist_match_controller.js runtime/continuous_match_core.js runtime/hybrid_spatial_intent_v2.js
          test "$(git diff --cached --name-only | wc -l)" -eq 9
          git commit -m 'Deploy USER-MATCH-TEST V0.5.4 R20 live continuity fixes'
          git push origin main
