name: FLR V0.5.1 Final Pinned Watch
on:
  workflow_run:
    workflows: ['FLR V0.5.1 Final Pinned QA']
    types: [completed]
permissions: {contents: write}
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HTML_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          python - <<'PY'
          import os,json,pathlib
          pathlib.Path('.flr/v051-final-pinned-status.json').write_text(json.dumps({'runId':int(os.environ['RUN_ID']),'conclusion':os.environ['CONCLUSION'],'headSha':os.environ['HEAD_SHA'],'htmlUrl':os.environ['HTML_URL']},indent=2)+'\n')
          PY
          git config user.name 'FLR V0.5.1 Final Watch';git config user.email 'actions@users.noreply.github.com';git pull --rebase origin main;git add .flr/v051-final-pinned-status.json;git commit -m 'Record final pinned V0.5.1 QA result' || exit 0;git push origin HEAD:main
