name: FLR V0.5.2 Compact Findings

on:
  push:
    branches: [main]
    paths:
      - '.flr/v052-compact-findings-request.json'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Extract targeted findings from detailed report status
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, math, pathlib
          src=json.loads(pathlib.Path('.flr/current-report-inspect-status.json').read_text(encoding='utf-8'))
          ids={
            'offside_end':'umt052-65749ef0-a4fb-420a-af16-f3cff1ebf37e',
            'offside_replay':'umt052-d90cd322-0396-4521-9382-0581b3e5f5f3',
            'cm_chase':'umt052-31984cc7-cba8-4a12-9ec5-ec0d85aad37d',
            'deep_start_cm':'umt052-95ad81d7-096b-45ec-b464-d9ac2bdbffb3',
            'lb_gk_start':'umt052-33b9e4a8-7f53-4fce-93f2-fccc560faa99'
          }
          reports={r.get('meta',{}).get('report_id'):r for r in src.get('reports',[])}
          def dist(a,b):
            if not a or not b:return None
            try:return round(math.hypot(float(a['x'])-float(b['x']),float(a['y'])-float(b['y'])),2)
            except:return None
          def pick_player(frame, pid):
            if not frame or not pid:return None
            return next((p for p in frame.get('players',[]) if p.get('id')==pid or p.get('slot')==pid),None)
          def nearby(frame, radius=12):
            if not frame:return []
            ball=frame.get('ball') or {}; out=[]
            for p in frame.get('players',[]):
              d=dist(p,ball)
              if d is not None and d<=radius:
                out.append({'id':p.get('id'),'slot':p.get('slot'),'team':p.get('team'),'x':p.get('x'),'y':p.get('y'),'speed':p.get('speed'),'task':p.get('tacticalTask'),'action':p.get('action'),'mark':p.get('markTargetId'),'distanceToBall':d})
            return sorted(out,key=lambda x:x['distanceToBall'])
          def slim_player(p):
            if not p:return None
            return {k:p.get(k) for k in ['id','team','slot','role','x','y','vx','vy','speed','tacticalTask','action','markTargetId','intent','targetId'] if p.get(k) is not None}
          def frame_summary(frame, slots=()):
            if not frame:return None
            return {'time':frame.get('time'),'phase':frame.get('phase'),'possession':frame.get('possession'),'ball':frame.get('ball'),'players':{s:slim_player(pick_player(frame,s)) for s in slots if pick_player(frame,s)},'nearBall12m':nearby(frame,12)}
          def all_samples(sit):
            if not sit:return []
            out=[]
            for label in ['preActionSamples','postActionSamples','episodeSamples']:
              for f in sit.get(label) or []: out.append((label,f))
            return out
          def offside_events(sit):
            if not sit:return []
            ev=[]
            pools=[sit.get('actualEvents') or [],((sit.get('hybridBeforeState') or {}).get('resolvedEvents') or []),((sit.get('hybridAfterState') or {}).get('resolvedEvents') or [])]
            for pool in pools:
              for e in pool:
                txt=json.dumps(e,ensure_ascii=False).upper()
                if 'OFFSIDE' in txt or 'RESTART' in txt:
                  if e not in ev:ev.append(e)
            return ev[-20:]
          def report_base(key):
            r=reports.get(ids[key],{})
            return {'reportId':ids[key],'description':(r.get('meta') or {}).get('description'),'boundary':((r.get('current') or {}).get('boundary')),'selectedChoice':((r.get('current') or {}).get('selectedChoice')),'actualResult':((r.get('current') or {}).get('actualResult'))}
          out={'schemaVersion':'FLR_V052_COMPACT_FINDINGS_1.0','build':src.get('build'),'reports':{}}
          # CM chase
          r=reports.get(ids['cm_chase'],{}); cur=r.get('current') or {}; prev=r.get('previous') or {}; hero=(cur.get('boundary') or {}).get('heroPlayerId') or 'H-CM'
          x=report_base('cm_chase'); x['heroPlayerId']=hero; x['samples']=[]
          for label,f in all_samples(cur):
            hp=pick_player(f,hero) or pick_player(f,'H-CM'); b=f.get('ball') if f else None
            x['samples'].append({'source':label,'time':f.get('time') if f else None,'ball':b,'hero':slim_player(hp),'heroDistanceToBall':dist(hp,b),'nearBall12m':nearby(f,12)})
          x['previousEntry']=frame_summary(prev.get('entrySnapshot'),('H-CM','H-LCM','H-RCM','H-DM','H-ST','H-LB','H-RB'))
          out['reports']['cm_chase']=x
          # Deep start / CM below defenders
          for key in ['deep_start_cm','lb_gk_start']:
            r=reports.get(ids[key],{}); cur=r.get('current') or {}; prev=r.get('previous') or {}; x=report_base(key)
            slots=('H-GK','H-LB','H-LCB','H-RCB','H-RB','H-DM','H-CM','H-LCM','H-RCM','H-LW','H-RW','H-ST')
            x['hybridBeforeState']={'second':(cur.get('hybridBeforeState') or {}).get('second'),'phase':(cur.get('hybridBeforeState') or {}).get('phase'),'possession':(cur.get('hybridBeforeState') or {}).get('possession'),'ball':(cur.get('hybridBeforeState') or {}).get('ball')}
            x['entry']=frame_summary(cur.get('entrySnapshot'),slots)
            x['samples']=[{'source':label,'frame':frame_summary(f,slots)} for label,f in all_samples(cur)]
            x['previousEntry']=frame_summary(prev.get('entrySnapshot'),slots)
            out['reports'][key]=x
          # Offside reports
          for key in ['offside_end','offside_replay']:
            r=reports.get(ids[key],{}); cur=r.get('current') or {}; prev=r.get('previous') or {}; x=report_base(key)
            x['offsideAndRestartEvents']=offside_events(cur)
            x['frameSampleCounts']={k:len(cur.get(k) or []) for k in ['preActionSamples','postActionSamples','episodeSamples']}
            x['samples']=[{'source':label,'time':f.get('time'),'phase':f.get('phase'),'possession':f.get('possession'),'ball':f.get('ball'),'hero':slim_player(pick_player(f,(cur.get('boundary') or {}).get('heroPlayerId')))} for label,f in all_samples(cur)]
            x['hybridAfterState']=cur.get('hybridAfterState')
            x['previousOffsideAndRestartEvents']=offside_events(prev)
            out['reports'][key]=x
          pathlib.Path('.flr/v052-compact-findings.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('generated',len(out['reports']))
          PY
      - name: Commit compact findings
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FLR Compact Findings Bot'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase origin main || true
          git add .flr/v052-compact-findings.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record V0.5.2 compact report findings'
          git push origin HEAD:main
