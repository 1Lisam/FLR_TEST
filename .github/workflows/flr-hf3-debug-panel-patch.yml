name: FLR HF3 Debug Panel Patch

on:
  push:
    branches: [deploy/v053-hf3-user-retest]
    paths: ['.flr/hf3-debug-panel-request.json']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Replace old debug scenarios with HF3 scenarios
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def sub1(path, pattern, replacement, label):
              p=Path(path); s=p.read_text(encoding='utf-8')
              ns,n=re.subn(pattern, lambda m: replacement, s, count=1, flags=re.S)
              if n!=1:
                  raise SystemExit(f'{label}: match count={n}')
              p.write_text(ns,encoding='utf-8')

          # 1) Actual developer scenario definitions.
          p=Path('live_hybrid_session_v02.js')
          s=p.read_text(encoding='utf-8')
          s,n=re.subn(r"const DEV_RECENT_SCENARIOS=\[[^\n]+\];",
              "const DEV_RECENT_SCENARIOS=['DEFENSIVE_ROLE_STABILITY','PASS_FLIGHT_WIDE_TRACK','MARK_TARGET_STABILITY','STRIKER_RUN_LANE','CARRIER_SHIELD_FLOW','OFFSIDE_INVOLVEMENT'];",s,count=1)
          if n!=1: raise SystemExit(f'scenario list match={n}')
          old_hero="const heroId=key==='OFFSIDE_REVIEW'?'H-CM':key==='GK_RESULT_CONSISTENCY'?'H-GK':'H-ST',heroRole=key==='OFFSIDE_REVIEW'?'CM':key==='GK_RESULT_CONSISTENCY'?'GK':'ST',session=createSession({...opts,seed:scenarioSeed,heroTeam:'HOME',heroRole,heroPlayerId:heroId,durationSeconds:1800});"
          new_hero="const midfieldHero=key==='PASS_FLIGHT_WIDE_TRACK'||key==='OFFSIDE_INVOLVEMENT',heroId=midfieldHero?'H-CM':'H-ST',heroRole=midfieldHero?'CM':'ST',session=createSession({...opts,seed:scenarioSeed,heroTeam:'HOME',heroRole,heroPlayerId:heroId,durationSeconds:1800});"
          if s.count(old_hero)!=1: raise SystemExit(f'hero mapping match={s.count(old_hero)}')
          s=s.replace(old_hero,new_hero,1)
          chain_pattern=r" if\(key==='BALL_DEPTH_SYNC'\)\{.*?\n \}\n s\.ball\.ownerId="
          chain_new=""" if(key==='DEFENSIVE_ROLE_STABILITY'){
  actualProgress=.64+j('actual',.02);abstractProgress=actualProgress;ownerId='H-LB';lane='LEFT';label='수비 역할·타깃 안정성';instruction='같은 공격 흐름에서 CB/FB/CM이 짧은 간격으로 역할을 계속 바꾸거나 좌우로 흔들리지 않는지 확인하세요.';
 }else if(key==='PASS_FLIGHT_WIDE_TRACK'){
  actualProgress=.66+j('actual',.015);abstractProgress=actualProgress;ownerId='H-CM';lane='CENTER';reason='MIDFIELD_INVOLVEMENT';label='패스 비행 중 풀백 측면 추적';instruction='RW 또는 LW 쪽 전진 패스를 선택한 뒤 공이 비행하는 동안 해당 측면 풀백이 침투자를 놓고 HOLD로 풀리지 않는지 확인하세요.';
 }else if(key==='MARK_TARGET_STABILITY'){
  actualProgress=.72+j('actual',.015);abstractProgress=actualProgress;ownerId='H-CM';lane='CENTER';label='같은 마크 대상 유지';instruction='수비수가 같은 공격수를 맡은 상황에서 mark 대상이 불필요하게 다른 선수로 튀거나 다시 돌아오는지 확인하세요.';
 }else if(key==='STRIKER_RUN_LANE'){
  actualProgress=.76+j('actual',.015);abstractProgress=actualProgress;ownerId='H-RW';lane='RIGHT';label='ST 침투 레인 연속성';instruction='측면에서 전개되는 동안 ST가 중앙/니어/파 포스트 의도를 너무 짧은 간격으로 번갈아 좌우 왕복하지 않는지 확인하세요.';
 }else if(key==='CARRIER_SHIELD_FLOW'){
  actualProgress=.77+j('actual',.012);abstractProgress=actualProgress;ownerId='H-ST';lane='CENTER';label='공격수 멈칫·SHIELD_SCAN 반복 방지';instruction='ST가 압박을 읽는 짧은 멈칫 뒤 다시 판단하고 움직이며, 같은 자리에서 SHIELD_SCAN을 반복하지 않는지 확인하세요.';
 }else{
  actualProgress=.67+j('actual',.02);abstractProgress=actualProgress;ownerId='H-CM';lane='CENTER';reason='MIDFIELD_INVOLVEMENT';label='오프사이드 실제 관여 시점';instruction='전방 침투 패스를 골라 오프사이드 위치가 패스 순간에 고정되고, 실제 공 관여 시점에 판정이 보이는지 확인하세요.';
 }
 s.ball.ownerId="""
          s,n=re.subn(chain_pattern,lambda m:chain_new,s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'scenario chain match={n}')
          post_pattern=r" if\(key==='OFFSIDE_REVIEW'\)\{.*?\n \}else\{\n  // Run the exact production reconciliation/intent layer once\. The scenario only forces the\n  // starting context; all resulting positions/choices remain generated by the current engine\.\n  advanceSpatial\(session,1\.5\);\n \}"
          post_new=""" if(key==='PASS_FLIGHT_WIDE_TRACK'){
  const ps=s.spatial.players,owner=ps['H-CM'],rw=ps['H-RW'],lw=ps['H-LW'];owner.x=68+j('pf-owner-x',.7);owner.y=34+j('pf-owner-y',1.2);owner.vx=1.0;owner.vy=0;rw.x=80+j('pf-rw-x',.5);rw.y=55+j('pf-rw-y',1.0);rw.vx=2.0;rw.vy=-.1;lw.x=78+j('pf-lw-x',.5);lw.y=13+j('pf-lw-y',1.0);lw.vx=1.7;lw.vy=.1;for(const [id,x,y] of [['A-LB',77,13],['A-LCB',80,27],['A-RCB',80,42],['A-RB',77,55]]){if(ps[id]){ps[id].x=x+j(id+'x',.55);ps[id].y=y+j(id+'y',.8);ps[id].vx=0;ps[id].vy=0;}}s.spatial.ball={x:owner.x,y:owner.y,ownerId:'H-CM'};s.ball.progress=localProgress('HOME',owner.x);s.zone=zoneFromProgress(s.ball.progress);s.phase=phaseFromProgress(s.ball.progress);
 }else if(key==='OFFSIDE_INVOLVEMENT'){
  const ps=s.spatial.players,owner=ps['H-CM'],st=ps['H-ST'],rw=ps['H-RW'];owner.x=70+j('ox',1.2);owner.y=34+j('oy',2.0);owner.vx=1.2;owner.vy=0;st.x=83.7+j('stx',.35);st.y=38+j('sty',1.6);st.vx=2.0;st.vy=0;rw.x=83.9+j('rwx',.35);rw.y=53+j('rwy',1.6);rw.vx=2.4;rw.vy=-.2;for(const [id,x,y] of [['A-LB',82,13],['A-LCB',82.5,27],['A-RCB',83.2,42],['A-RB',81.5,56],['A-GK',99,34]]){if(ps[id]){ps[id].x=x+j(id+'x',.7);ps[id].y=y+j(id+'y',1.0);ps[id].vx=0;ps[id].vy=0;}}s.spatial.ball={x:owner.x,y:owner.y,ownerId:'H-CM'};s.ball.progress=localProgress('HOME',owner.x);s.zone=zoneFromProgress(s.ball.progress);s.phase=phaseFromProgress(s.ball.progress);
 }else if(key==='DEFENSIVE_ROLE_STABILITY'){
  const ps=s.spatial.players,owner=ps['H-LB'];owner.x=64+j('dr-owner-x',.8);owner.y=14+j('dr-owner-y',1.0);owner.vx=1.1;owner.vy=0;for(const [id,x,y] of [['H-LW',75,10],['H-ST',79,33],['H-LCM',65,23],['A-RB',74,12],['A-RCB',78,29],['A-CM',67,34],['A-RCM',69,47]]){if(ps[id]){ps[id].x=x+j(id+'x',.65);ps[id].y=y+j(id+'y',.9);ps[id].vx=0;ps[id].vy=0;}}s.spatial.ball={x:owner.x,y:owner.y,ownerId:'H-LB'};s.ball.progress=localProgress('HOME',owner.x);s.zone=zoneFromProgress(s.ball.progress);s.phase=phaseFromProgress(s.ball.progress);
 }else if(key==='MARK_TARGET_STABILITY'){
  const ps=s.spatial.players,owner=ps['H-CM'];owner.x=75+j('mk-owner-x',.7);owner.y=34+j('mk-owner-y',.8);for(const [id,x,y] of [['H-ST',84,34],['H-LW',82,17],['H-RW',82,51],['A-LCB',81,27],['A-RCB',81,41],['A-LB',79,14],['A-RB',79,54],['A-CM',72,34]]){if(ps[id]){ps[id].x=x+j(id+'x',.5);ps[id].y=y+j(id+'y',.7);ps[id].vx=0;ps[id].vy=0;}}s.spatial.ball={x:owner.x,y:owner.y,ownerId:'H-CM'};s.ball.progress=localProgress('HOME',owner.x);s.zone=zoneFromProgress(s.ball.progress);s.phase='FINAL_THIRD';
 }else if(key==='STRIKER_RUN_LANE'){
  const ps=s.spatial.players,owner=ps['H-RW'],st=ps['H-ST'];owner.x=80+j('st-owner-x',.6);owner.y=55+j('st-owner-y',.8);owner.vx=1.0;owner.vy=-.1;st.x=82+j('st-x',.5);st.y=34+j('st-y',1.0);st.vx=1.2;st.vy=0;for(const [id,x,y] of [['A-LCB',82,27],['A-RCB',82,41],['A-RB',79,55],['H-RCM',73,46]]){if(ps[id]){ps[id].x=x+j(id+'x',.5);ps[id].y=y+j(id+'y',.7);ps[id].vx=0;ps[id].vy=0;}}s.spatial.ball={x:owner.x,y:owner.y,ownerId:'H-RW'};s.ball.progress=localProgress('HOME',owner.x);s.zone=zoneFromProgress(s.ball.progress);s.phase='FINAL_THIRD';
 }else if(key==='CARRIER_SHIELD_FLOW'){
  const ps=s.spatial.players,owner=ps['H-ST'];owner.x=80+j('sh-owner-x',.45);owner.y=34+j('sh-owner-y',.7);owner.vx=.4;owner.vy=0;for(const [id,x,y] of [['A-LCB',82.2,30],['A-RCB',82.5,39],['H-LW',78,14],['H-RW',78,54],['H-CM',70,34]]){if(ps[id]){ps[id].x=x+j(id+'x',.45);ps[id].y=y+j(id+'y',.65);ps[id].vx=0;ps[id].vy=0;}}s.spatial.ball={x:owner.x,y:owner.y,ownerId:'H-ST'};s.ball.progress=localProgress('HOME',owner.x);s.zone=zoneFromProgress(s.ball.progress);s.phase='FINAL_THIRD';s.danger=Math.max(.62,s.danger);
 }else{
  advanceSpatial(session,1.5);
 }"""
          s,n=re.subn(post_pattern,lambda m:post_new,s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'post spatial block match={n}')
          p.write_text(s,encoding='utf-8')

          # 2) User-facing guides + interactive scenarios.
          guides="""const DEV_RECENT_GUIDES={
 DEFENSIVE_ROLE_STABILITY:{label:'수비 역할·타깃 안정성',watch:'CB·FB·CM이 같은 공격 흐름에서 역할을 짧은 간격으로 계속 바꾸거나 좌우로 흔들리는지 봅니다.',normal:'정상: 실제 위협이나 소유권이 바뀌기 전에는 한 책임을 유지하면서 위치만 자연스럽게 조정합니다.'},
 PASS_FLIGHT_WIDE_TRACK:{label:'패스 비행 중 풀백 측면 추적',watch:'측면 전진 패스를 선택한 뒤 공이 비행하는 동안 담당 풀백이 침투자를 놓고 멈추거나 중앙으로 풀리는지 봅니다.',normal:'정상: 공 소유자가 사라지는 FLIGHT 순간에도 intended receiver를 위협으로 이어 받아 추적합니다.'},
 MARK_TARGET_STABILITY:{label:'같은 마크 대상 유지',watch:'한 수비수가 맡은 공격수가 그대로인데 markTarget이 다른 선수로 튀었다가 돌아오는지 봅니다.',normal:'정상: 더 긴급한 위협이 생기지 않는 한 같은 마크 책임을 유지합니다.'},
 STRIKER_RUN_LANE:{label:'ST 침투 레인 연속성',watch:'측면 전개 중 ST가 중앙·니어·파포스트 목표를 너무 자주 바꾸며 좌우 왕복하는지 봅니다.',normal:'정상: 공격 의도는 잠깐 유지되고, 실제 전개 변화가 있을 때만 새 레인으로 전환합니다.'},
 CARRIER_SHIELD_FLOW:{label:'공격수 멈칫 반복 방지',watch:'ST가 공을 지킨 뒤 같은 자리에서 SHIELD_SCAN/멈춤을 반복하는지 봅니다.',normal:'정상: 짧게 스캔한 뒤 패스·드리블·보호 등 다음 실제 판단으로 이어집니다.'},
 OFFSIDE_INVOLVEMENT:{label:'오프사이드 실제 관여 시점',watch:'오프사이드 위치는 패스가 출발한 순간 기준인지, 판정 연출은 실제 공 관여 시점에 나타나는지 봅니다.',normal:'정상: 위치 판정 기준은 release 순간에 고정되고, 휘슬은 실제 관여가 확인될 때 표시됩니다.'}
};"""
          sub1('step71_hybrid_v06_ui.js',r"const DEV_RECENT_GUIDES=\{.*?\n\};",guides,'HF3 guide block')
          u=Path('step71_hybrid_v06_ui.js'); us=u.read_text(encoding='utf-8')
          old="if(!['OFFSIDE_REVIEW','GK_RESULT_CONSISTENCY'].includes(d.key)){runDeveloperVisualScenario(d);return;}"
          new="if(!['PASS_FLIGHT_WIDE_TRACK','OFFSIDE_INVOLVEMENT'].includes(d.key)){runDeveloperVisualScenario(d);return;}"
          if us.count(old)!=1: raise SystemExit(f'interactive scenario gate match={us.count(old)}')
          u.write_text(us.replace(old,new,1),encoding='utf-8')

          # 3) Replace the stale five-item panel itself.
          panel="""<div class=\"test-guide\" style=\"margin:.75rem 0\"><strong>최근 HF3 수정 장면 검증 · 6개 항목</strong><p class=\"test-note\">이번 HF3에서 실제로 수정한 현상만 모았습니다. 항목을 고른 뒤 강제 검증을 실행하면 아래 상태 줄에 사용된 seed가 그대로 표시됩니다.</p><select id=\"heroRecentFixSelect\" size=\"6\" style=\"width:100%;max-width:680px\"><option value=\"DEFENSIVE_ROLE_STABILITY\">1. 수비 역할·타깃 안정성</option><option value=\"PASS_FLIGHT_WIDE_TRACK\">2. 패스 비행 중 풀백 측면 추적</option><option value=\"MARK_TARGET_STABILITY\">3. 같은 마크 대상 유지</option><option value=\"STRIKER_RUN_LANE\">4. ST 침투 레인 연속성</option><option value=\"CARRIER_SHIELD_FLOW\">5. 공격수 멈칫 반복 방지</option><option value=\"OFFSIDE_INVOLVEMENT\">6. 오프사이드 실제 관여 시점</option></select><div id=\"heroRecentFixGuide\" style=\"margin:.55rem 0\"></div><div class=\"debug-controls\"><button id=\"heroRecentFixRun\" class=\"secondary\">선택 항목 강제 검증</button><button id=\"heroRecentFixNewSeed\" class=\"secondary\">다른 시드로 강제 검증</button><button id=\"heroRecentFixReplay\" class=\"secondary\" disabled>현재 검증 다시보기</button><button id=\"heroRecentFixRandom\" class=\"secondary\">랜덤 항목 선택</button></div><div id=\"heroRecentFixStatus\" class=\"muted\" style=\"margin:.55rem 0\">HF3 검사 항목을 선택한 뒤 강제 검증을 시작하세요. 시작 맥락만 강제하며 결과는 선계산하지 않습니다.</div></div>"""
          sub1('index.html',r"<div class=\"test-guide\" style=\"margin:\.75rem 0\"><strong>최근 수정 장면 검증.*?<div id=\"heroRecentFixStatus\".*?</div></div>",panel,'HF3 panel')
          PY

      - name: Syntax and scenario checks
        shell: bash
        run: |
          set -euo pipefail
          node --check live_hybrid_session_v02.js
          node --check step71_hybrid_v06_ui.js
          grep -q '최근 HF3 수정 장면 검증 · 6개 항목' index.html
          grep -q 'DEFENSIVE_ROLE_STABILITY' live_hybrid_session_v02.js
          grep -q 'PASS_FLIGHT_WIDE_TRACK' live_hybrid_session_v02.js
          grep -q 'MARK_TARGET_STABILITY' live_hybrid_session_v02.js
          grep -q 'STRIKER_RUN_LANE' live_hybrid_session_v02.js
          grep -q 'CARRIER_SHIELD_FLOW' live_hybrid_session_v02.js
          grep -q 'OFFSIDE_INVOLVEMENT' live_hybrid_session_v02.js
          ! grep -q "const DEV_RECENT_SCENARIOS=\['BALL_DEPTH_SYNC'" live_hybrid_session_v02.js

      - name: Commit corrected HF3 debug panel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FLR HF3 Debug Panel Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html live_hybrid_session_v02.js step71_hybrid_v06_ui.js
          git diff --cached --quiet && { echo NO_CHANGES; exit 1; }
          git commit -m 'Replace stale debug scenarios with HF3 user checks'
          git pull --rebase origin main
          git push origin HEAD:main
