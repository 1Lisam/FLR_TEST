name: FLR V0.5.3 HF1 Pages verify

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  verify:
    if: github.event.issue.title == '[FLR_AUDIT] V0.5.3 HF1 PAGES'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify public Pages files
        shell: bash
        run: |
          set -euo pipefail
          base='https://1lisam.github.io/FLR_TEST'
          ok=0
          for i in $(seq 1 18); do
            q="hf1-${GITHUB_RUN_ID}-${i}-$(date +%s)"
            if curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${base}/?${q}" -o /tmp/page.html \
              && curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${base}/step71_hybrid_v06_ui.js?${q}" -o /tmp/ui.js \
              && curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${base}/runtime/protagonist_match_controller.js?${q}" -o /tmp/controller.js \
              && curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${base}/live_hybrid_session_v02.js?${q}" -o /tmp/live.js \
              && grep -q 'V0.5.3 HF1' /tmp/page.html \
              && grep -q 'heroRecentFixSelect' /tmp/page.html \
              && grep -q 'USER-MATCH-TEST-V0.5.3-HF1' /tmp/ui.js \
              && grep -q 'umt053h1-' /tmp/ui.js \
              && grep -q "code:'GOAL_CONCEDED'" /tmp/controller.js \
              && grep -q 'GK_RESULT_CONSISTENCY' /tmp/live.js; then ok=1; break; fi
            sleep 5
          done
          python - <<PY
          import json, pathlib, hashlib
          def sha(p):
              b=pathlib.Path(p).read_bytes() if pathlib.Path(p).exists() else b''
              return hashlib.sha256(b).hexdigest() if b else None
          out={
            'schemaVersion':'FLR_V053_HF1_PAGES_VERIFY_1.0',
            'status':'PASS' if int('${ok}') else 'FAIL',
            'url':'https://1lisam.github.io/FLR_TEST/',
            'checks':{
              'pageVersionHF1': pathlib.Path('/tmp/page.html').exists() and 'V0.5.3 HF1' in pathlib.Path('/tmp/page.html').read_text(errors='replace'),
              'fiveItemSelector': pathlib.Path('/tmp/page.html').exists() and 'heroRecentFixSelect' in pathlib.Path('/tmp/page.html').read_text(errors='replace'),
              'reportBuildHF1': pathlib.Path('/tmp/ui.js').exists() and 'USER-MATCH-TEST-V0.5.3-HF1' in pathlib.Path('/tmp/ui.js').read_text(errors='replace'),
              'reportPrefixHF1': pathlib.Path('/tmp/ui.js').exists() and 'umt053h1-' in pathlib.Path('/tmp/ui.js').read_text(errors='replace'),
              'gkGoalConceded': pathlib.Path('/tmp/controller.js').exists() and "code:'GOAL_CONCEDED'" in pathlib.Path('/tmp/controller.js').read_text(errors='replace'),
              'gkScenario': pathlib.Path('/tmp/live.js').exists() and 'GK_RESULT_CONSISTENCY' in pathlib.Path('/tmp/live.js').read_text(errors='replace')
            },
            'sha256':{
              'index':sha('/tmp/page.html'), 'ui':sha('/tmp/ui.js'), 'controller':sha('/tmp/controller.js'), 'live':sha('/tmp/live.js')
            }
          }
          pathlib.Path('.flr/v053-hf1-pages-verify.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY
          test "$ok" = 1
      - name: Persist verification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FLR Pages Verify Bot'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase origin main
          git add .flr/v053-hf1-pages-verify.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record V0.5.3 HF1 Pages verification'
          git push origin HEAD:main
