name: FLR HF3 Candidate Build

on:
  push:
    branches: [main]
    paths:
      - '.flr/hf3-candidate-build-request.json'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Record exact source commit
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > R26_SOURCE_COMMIT.txt
          printf 'R26 baseline export only; no game files modified.\n' > R26_SOURCE_EXPORT.txt

      - name: Upload current FLR source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: flr-r26-source-recovery-${{ github.run_id }}
          path: |
            .
            !.git/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
