name: TT-0.49 candidate validation

on:
  push:
    branches:
      - tt049-candidate
    paths:
      - '.flr/tt049_apply.py'
      - '.flr/tt049_validation.js'
      - '.github/workflows/tt049-candidate-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tt049-candidate-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate instructions
        uses: actions/checkout@v4
        with:
          ref: tt049-candidate
          path: candidate
          fetch-depth: 1

      - name: Checkout protected main baseline
        uses: actions/checkout@v4
        with:
          ref: main
          path: work
          fetch-depth: 1

      - name: Confirm exact V13 base
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git -C work rev-parse HEAD)
          expected=52e69323bbab47f7d93e0d0f1e3fa06837038afd
          test "$actual" = "$expected" || { echo "BASE_COMMIT_MISMATCH expected=$expected actual=$actual"; exit 1; }

      - name: Apply TT-0.49 TEST_ONLY candidate
        shell: bash
        run: |
          set -euo pipefail
          python candidate/.flr/tt049_apply.py work
          git -C work diff --check

      - name: JavaScript syntax checks
        shell: bash
        run: |
          set -euo pipefail
          node --check work/runtime/action_candidate_engine.js
          node --check work/runtime/continuous_match_core.js
          node --check work/runtime/protagonist_match_controller.js
          node --check candidate/.flr/tt049_validation.js

      - name: Run TT-0.49 engine regressions
        shell: bash
        run: |
          set -euo pipefail
          node candidate/.flr/tt049_validation.js work | tee tt049-validation.json

      - name: Build deployable candidate patch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git -C work diff -- runtime/action_candidate_engine.js runtime/continuous_match_core.js > tt049-candidate.patch
          test -s tt049-candidate.patch
          sha256sum tt049-candidate.patch | tee tt049-candidate.patch.sha256

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tt049-candidate-evidence
          path: |
            tt049-validation.json
            tt049-candidate.patch
            tt049-candidate.patch.sha256
          if-no-files-found: warn
