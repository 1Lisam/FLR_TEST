name: TT-0.49 supplemental validation V6

on:
  push:
    branches: [tt049-candidate]
    paths:
      - '.flr/tt049-run-request-v2'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tt049-supplemental-v6
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: tt049-candidate
          path: candidate
          fetch-depth: 1
      - name: Checkout protected baseline
        uses: actions/checkout@v4
        with:
          ref: main
          path: work
          fetch-depth: 1
      - name: Apply candidate and run supplemental regressions
        id: test
        continue-on-error: true
        shell: bash
        run: |
          set +e
          expected=52e69323bbab47f7d93e0d0f1e3fa06837038afd
          actual=$(git -C work rev-parse HEAD)
          echo "$actual" > base-sha.txt
          if [ "$actual" != "$expected" ]; then
            echo "BASE_COMMIT_MISMATCH expected=$expected actual=$actual" > tt049-supplemental.stderr
            code=20
          else
            python candidate/.flr/tt049_apply.py work > tt049-supplemental-apply.log 2>&1
            code=$?
            if [ $code -eq 0 ]; then python candidate/.flr/tt049_refine_apply.py work >> tt049-supplemental-apply.log 2>&1; code=$?; fi
            if [ $code -eq 0 ]; then git -C work diff --check; code=$?; fi
            if [ $code -eq 0 ]; then git -C work diff --quiet -- runtime/tactical_movement.js; code=$?; fi
            if [ $code -eq 0 ]; then
              node --check work/runtime/action_candidate_engine.js && \
              node --check work/runtime/continuous_match_core.js && \
              node --check work/runtime/protagonist_match_controller.js && \
              node --check work/live_hybrid_session_v02.js && \
              node --check work/live_v06_scene_authority_browser.js && \
              node --check work/in_pitch_choice_ui.js && \
              node --check work/step71_hybrid_v06_ui.js && \
              node --check candidate/.flr/tt049_validation_v6_supplemental.js
              code=$?
            fi
            if [ $code -eq 0 ]; then
              node candidate/.flr/tt049_validation_v6_supplemental.js work > tt049-supplemental.json 2> tt049-supplemental.stderr
              code=$?
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit $code
      - name: Persist supplemental result
        if: always()
        shell: bash
        env:
          TEST_CODE: ${{ steps.test.outputs.code }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib,shutil
          expected='52e69323bbab47f7d93e0d0f1e3fa06837038afd'
          base=pathlib.Path('base-sha.txt').read_text().strip() if pathlib.Path('base-sha.txt').exists() else None
          result={'schemaVersion':'FLR_TT049_SUPPLEMENTAL_CI_V6_0.1','expectedBaseSha':expected,'baseSha':base,'exitCode':int(os.getenv('TEST_CODE') or 99)}
          p=pathlib.Path('tt049-supplemental.json')
          if p.exists():
              try: result['validation']=json.loads(p.read_text(encoding='utf-8'))
              except Exception as e: result['validationParseError']=str(e)
          for key,file in [('applyLog','tt049-supplemental-apply.log'),('stderr','tt049-supplemental.stderr')]:
              q=pathlib.Path(file)
              if q.exists(): result[key]=q.read_text(encoding='utf-8',errors='replace')[-12000:]
          result['workflowStatus']='PASS' if result['exitCode']==0 else 'FAIL'
          pathlib.Path('candidate/TT049_SUPPLEMENTAL_CI_V6.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          if p.exists(): shutil.copyfile(p,'candidate/TT049_SUPPLEMENTAL_VALIDATION_V6.json')
          PY
          git -C candidate config user.name "FLR Candidate CI"
          git -C candidate config user.email "actions@users.noreply.github.com"
          git -C candidate add -- TT049_SUPPLEMENTAL_CI_V6.json
          [ ! -f candidate/TT049_SUPPLEMENTAL_VALIDATION_V6.json ] || git -C candidate add -- TT049_SUPPLEMENTAL_VALIDATION_V6.json
          git -C candidate diff --cached --quiet || { git -C candidate commit -m "Record TT-0.49 supplemental V6 result"; git -C candidate push origin HEAD:tt049-candidate; }
      - name: Enforce supplemental gate
        if: always()
        shell: bash
        env:
          TEST_CODE: ${{ steps.test.outputs.code }}
        run: test "${TEST_CODE:-99}" = 0
