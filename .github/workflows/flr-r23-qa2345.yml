name: FLR R23 Defender Carry Regression
on:
  push:
    branches: [r23-r22-report-fixes]
    paths: ['.github/workflows/flr-r23-qa2345.yml']
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with: {ref: r23-r22-report-fixes}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Same-seed defender and carry QA
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const path=require('path'),H=require('./live_hybrid_session_v02.js'),A=require('./live_v06_scene_authority_browser.js'),C=require('./runtime/action_candidate_engine.js'),E=require('./runtime/continuous_match_core.js');
          const runtimeDir=path.join(process.cwd(),'runtime'),mk=(key,seed)=>H.createDeveloperScenario({key,seed}),high=d=>A.seedMatch(d.boundary,{runtimeDir,seed:`R23-QA-${d.seed}`,explicitHeroChoiceRequired:true}),pl=(m,id)=>m.players.find(p=>p.id===id),loc=(team,p)=>team==='HOME'?{x:p.x,y:p.y}:{x:105-p.x,y:68-p.y};
          const out={};
          // QA2 fullbacks
          {
            const d=mk('DEFENSIVE_ROLE_STABILITY','DEV-RECENT-1787734197888-15'),hi=high(d),m=hi.state.m,pairs=[['A-RB','H-LW'],['A-LB','H-RW']],z=Object.fromEntries(pairs.map(([df])=>[df,{samples:0,inside:0,goal:0,maxOutside:0,tasks:new Set()}]));
            for(let i=0;i<100;i++){E.step(m,.05);for(const[df,at]of pairs){const dp=pl(m,df),ap=pl(m,at),dl=loc('AWAY',dp),al=loc('AWAY',ap),q=z[df],insideMargin=Math.abs(al.y-34)-Math.abs(dl.y-34);q.samples++;q.tasks.add(dp.tacticalTask);if(insideMargin>=-.05)q.inside++;else q.maxOutside=Math.max(q.maxOutside,-insideMargin);if(dl.x<=al.x+.2)q.goal++;}}
            for(const q of Object.values(z)){q.insideRate=q.inside/q.samples;q.goalRate=q.goal/q.samples;q.tasks=[...q.tasks];}
            out.QA2=z;console.log('QA2',JSON.stringify(z,null,2));
          }
          // QA3 CB responsibility churn
          {
            const d=mk('MARK_TARGET_STABILITY','DEV-RECENT-1787734342252-19'),hi=high(d),m=hi.state.m,ids=['A-LCB','A-RCB'],z=Object.fromEntries(ids.map(id=>{const p=pl(m,id);return[id,{taskChanges:0,markChanges:0,lastTask:p.tacticalTask,lastMark:p.markTargetId||null,maxLatFromST:0,tasks:new Set([p.tacticalTask])}]}));
            for(let i=0;i<180;i++){E.step(m,.05);const st=pl(m,'H-ST');for(const id of ids){const p=pl(m,id),q=z[id];if(p.tacticalTask!==q.lastTask){q.taskChanges++;q.lastTask=p.tacticalTask;q.tasks.add(p.tacticalTask)}if((p.markTargetId||null)!==(q.lastMark||null)){q.markChanges++;q.lastMark=p.markTargetId||null}q.maxLatFromST=Math.max(q.maxLatFromST,Math.abs(p.y-st.y));}}
            for(const q of Object.values(z))q.tasks=[...q.tasks];out.QA3=z;console.log('QA3',JSON.stringify(z,null,2));
          }
          // QA4 close-goal carry option + execution guard
          {
            const d=mk('ST_SHOT_VISIBILITY','DEV-RECENT-1787734444350-28'),hi=high(d),q=hi.P.inspect(hi.state),ids=(q?.options||[]).map(x=>x.id||x.choice||x.key).filter(Boolean),hp=pl(hi.state.m,'H-ST'),hl=loc('HOME',hp);
            const near=C.generate({role:'ST',localX:92.75,wide:false,pressure:2,space:2,held:.5,shot:{inBox:true,dGoal:12,centrality:0,openWindow:true,blockers:0,oneVOne:true},pass:{}}).map(x=>x.id),control=C.generate({role:'ST',localX:90,wide:false,pressure:2,space:4,held:.5,shot:{inBox:true,dGoal:15,centrality:2,openWindow:false,blockers:1,oneVOne:false},pass:{}}).map(x=>x.id),exec=[];
            if(hl.x>=91.2&&ids.includes('CARRY'))throw new Error(`exact shot scene still has CARRY x=${hl.x}`);if(near.includes('CARRY'))throw new Error('near-goal pure candidate still has CARRY');if(!control.includes('CARRY'))throw new Error('control candidate lost CARRY');
            for(const[team,id,x]of[['HOME','H-ST',92.75],['AWAY','A-ST',12.25]]){const m=E.createMatch(`R23-CARRY-${team}`),B=E.choiceActionBridge(),p=B.playerById(m,id);p.x=x;p.y=34;p.tx=x;p.ty=34;p.vx=p.vy=0;B.setControlled(m,p,true);const before=loc(team,p).x;B.executeCarry(m,p,{userCommitted:true});const after=loc(team,{x:p.tx,y:p.ty}).x;if(after<before-1e-6)throw new Error(`${team} carry backward ${before}->${after}`);exec.push({team,before,after});}
            out.QA4={exact:{x:hl.x,options:ids},near,control,exec};console.log('QA4',JSON.stringify(out.QA4,null,2));
          }
          // QA5 existing carry preservation
          {
            const d=mk('CARRY_CONTINUITY','DEV-RECENT-1787734397122-26'),hi=high(d),m=hi.state.m;let backwards=0,samples=0,hardStops=0,prev=null;
            for(let i=0;i<80;i++){E.step(m,.05);const p=pl(m,m.ball.ownerId);if(!p||p.team!=='HOME')continue;samples++;if(p.vx<-.15)backwards++;const sp=Math.hypot(p.vx,p.vy);if(prev!=null&&prev>2&&sp<.25)hardStops++;prev=sp;}
            if(backwards>Math.max(2,Math.floor(samples*.08)))throw new Error(`carry preservation backwards ${backwards}/${samples}`);out.QA5={samples,backwards,hardStops};console.log('QA5',JSON.stringify(out.QA5));
          }
          console.log('R23_QA2345_RESULT',JSON.stringify(out));
          console.log('R23_QA2345_HARD: PASS');
          NODE
      - name: Clean workflow
        run: |
          rm -f .github/workflows/flr-r23-qa2345.yml
          git config user.name 'FLR R23 QA Bot'; git config user.email 'actions@users.noreply.github.com'; git add -A; git commit -m 'chore: remove temporary R23 QA2345 workflow'; git push origin HEAD:r23-r22-report-fixes
