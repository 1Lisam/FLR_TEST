name: FLR R24 Apply Verified Patch

on:
  push:
    branches: [r24-r23-report-fixes]
    paths:
      - '.github/workflows/flr-r24-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r24-r23-report-fixes
          fetch-depth: 0
      - name: Decode and verify patch bundle
        run: |
          set -euo pipefail
          base64 -d .flr/r24_patch_bundle.b64 > /tmp/r24_patch_bundle.tgz
          echo '33482981c95d84713259c4c07f192f1b63f1284820cc1ee273d10fd59a425f97  /tmp/r24_patch_bundle.tgz' | sha256sum -c -
          mkdir -p /tmp/r24_patches
          tar -xzf /tmp/r24_patch_bundle.tgz -C /tmp/r24_patches
      - name: Apply R24 candidate patches
        run: |
          set -euo pipefail
          for p in /tmp/r24_patches/*.patch; do git apply --check "$p"; done
          for p in /tmp/r24_patches/*.patch; do git apply "$p"; done
      - name: Verify exact candidate hashes and syntax
        run: |
          set -euo pipefail
          echo '438cf15679b1923df38d6e873fb093ad5571200a9860ba19ec9b43d8e163703a  index.html' | sha256sum -c -
          echo '538682cc857cc67d00ed534c54a868bb60d47a71dc20f9e837af0379ea8fadfb  live_hybrid_session_v02.js' | sha256sum -c -
          echo 'e8fa50fd8a354ecd4aed6cfec47951515804705a32429c598188d8c5db24de32  runtime/hybrid_spatial_intent_v2.js' | sha256sum -c -
          echo '81d14bd95234f525241a75927947a6b44b6e4392055788a96493f0a23d821b0f  runtime/tactical_movement.js' | sha256sum -c -
          echo 'ce169c0b85adecda2c9b5023bac01f4c4ef1786758e91fd6da730b585e8db6bb  step71_hybrid_v06_ui.js' | sha256sum -c -
          node --check live_hybrid_session_v02.js
          node --check runtime/hybrid_spatial_intent_v2.js
          node --check runtime/tactical_movement.js
          node --check step71_hybrid_v06_ui.js
          grep -q 'V0.5.4 R24 TEST' index.html
          test "$(grep -o '<option value="[A-Z_]*">[123]\.' index.html | wc -l)" -eq 3
          ! grep -q '<option value="CARRY_CONTINUITY">' index.html
          ! grep -q '<option value="ST_SHOT_VISIBILITY">' index.html
      - name: Commit clean R24 gameplay diff
        run: |
          set -euo pipefail
          rm -f .flr/r24_patch_bundle.b64 .github/workflows/flr-r24-apply.yml
          git config user.name 'FLR R24 Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- index.html live_hybrid_session_v02.js runtime/hybrid_spatial_intent_v2.js runtime/tactical_movement.js step71_hybrid_v06_ui.js .flr/r24_patch_bundle.b64 .github/workflows/flr-r24-apply.yml
          git commit -m 'R24 fix positional roles and retire passed manual checks'
          git push origin r24-r23-report-fixes
