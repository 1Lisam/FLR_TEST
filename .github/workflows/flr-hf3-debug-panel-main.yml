name: FLR HF3 Debug Panel Main Patch

on:
  push:
    branches: [main]
    paths: ['.flr/hf3-debug-panel-main-request.json']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply HF3 debug panel patch
        shell: bash
        run: |
          set -euo pipefail
          python .flr/hf3_debug_panel_patch.py
          node --check live_hybrid_session_v02.js
          node --check step71_hybrid_v06_ui.js
          node - <<'NODE'
          const H=require('./live_hybrid_session_v02.js');
          const keys=['DEFENSIVE_ROLE_STABILITY','PASS_FLIGHT_WIDE_TRACK','MARK_TARGET_STABILITY','STRIKER_RUN_LANE','CARRIER_SHIELD_FLOW','OFFSIDE_INVOLVEMENT'];
          for(const key of keys){const d=H.createDeveloperScenario({seed:`HF3-PANEL-SMOKE-${key}`,key});if(d.key!==key||!d.boundary||d.futureOutcomePrecomputed!==false)throw new Error(`scenario smoke failed ${key}`);console.log('SCENARIO_OK',key,d.seed);}
          NODE
          grep -q '최근 HF3 수정 장면 검증 · 6개 항목' index.html
          grep -q 'PASS_FLIGHT_WIDE_TRACK' step71_hybrid_v06_ui.js
      - name: Commit corrected panel and clean one-shot files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FLR HF3 Debug Panel Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html live_hybrid_session_v02.js step71_hybrid_v06_ui.js
          git rm -f .flr/hf3_debug_panel_patch.py .flr/hf3-debug-panel-main-request.json .github/workflows/flr-hf3-debug-panel-main.yml
          git commit -m 'Replace stale debug scenarios with HF3 user checks'
          git pull --rebase origin main
          git push origin HEAD:main
