name: FLR V0.5.3 HF1 one-time deploy

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  deploy:
    if: github.event.issue.title == '[FLR_DEPLOY] USER MATCH TEST V0.5.3 HF1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify deployed V0.5.3 baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum index.html | cut -d' ' -f1)" = d03d47333ed1370bdd753ad0e9616df505224acb06bf70b18dcdb1fe16c1d23f
          test "$(sha256sum live_hybrid_session_v02.js | cut -d' ' -f1)" = 4ca3856fa994cc18401de1072a04063235f4195d493bf010e39feeb73bc8541e
          test "$(sha256sum runtime/protagonist_match_controller.js | cut -d' ' -f1)" = 572fe690129d0a8866720f5e2f850aa002b6ad12bdeebc8303c94e083cd4180f
          test "$(sha256sum step71_hybrid_v06_ui.js | cut -d' ' -f1)" = 1618b32c49bca7f9df527e08a11adb5b1f150c645f216d3bd14309f04f3eae4a

      - name: Apply validated HF1 transform
        shell: bash
        env:
          TRANSFORM_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$TRANSFORM_B64" | base64 -d | gzip -d > /tmp/v053_hf1_transform.py
          test "$(sha256sum /tmp/v053_hf1_transform.py | cut -d' ' -f1)" = 56656e6b21bd2952c01cc90a565836db19d10530484a8a07589a229d98f6ce77
          python /tmp/v053_hf1_transform.py

      - name: Verify exact validated HF1 outputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum index.html | cut -d' ' -f1)" = ee287f600a8087b345e88285bb034e713b546520635d8ee5495d7a79fc085e9e
          test "$(sha256sum live_hybrid_session_v02.js | cut -d' ' -f1)" = f21479597f6b1a4dd2f925ebe67c30241c236ace5c2682bcc532b6dcd654ded7
          test "$(sha256sum runtime/protagonist_match_controller.js | cut -d' ' -f1)" = b6588ff3615cc0fa7a67180c1e3de9d20ec8294e1ca88c683a75d12041b3d09b
          test "$(sha256sum step71_hybrid_v06_ui.js | cut -d' ' -f1)" = 5f4f33c32cda44664f43dfc1186574f220d0b4acc02ce9558244423f754d5d8f
          node --check live_hybrid_session_v02.js
          node --check runtime/protagonist_match_controller.js
          node --check step71_hybrid_v06_ui.js
          grep -q 'V0.5.3 HF1' index.html
          grep -q 'USER-MATCH-TEST-V0.5.3-HF1' step71_hybrid_v06_ui.js
          grep -q 'umt053h1-' step71_hybrid_v06_ui.js
          grep -q 'heroRecentFixSelect' index.html
          grep -q 'GK_RESULT_CONSISTENCY' live_hybrid_session_v02.js
          grep -q "code:'GOAL_CONCEDED'" runtime/protagonist_match_controller.js

      - name: Commit exact HF1 files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FLR HF1 Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html live_hybrid_session_v02.js runtime/protagonist_match_controller.js step71_hybrid_v06_ui.js
          git commit -m 'Deploy Match Engine User Test V0.5.3 HF1'
          git push origin HEAD:main
