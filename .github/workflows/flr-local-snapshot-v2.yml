name: FLR local snapshot v2
# V0.5.1 local bootstrap snapshot trigger — temporary branch only

on:
  push:
    paths:
      - '.github/workflows/flr-local-snapshot-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Record snapshot metadata
        shell: bash
        run: |
          printf '{"schemaVersion":"FLR_LOCAL_DEV_SNAPSHOT_0.2","ref":"%s","sha":"%s","createdBy":"github-actions"}\n' "${GITHUB_REF_NAME}" "${GITHUB_SHA}" > FLR_LOCAL_DEV_SNAPSHOT.json
      - name: Upload complete repository snapshot
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: FLR_CURRENT_MAIN_SNAPSHOT
          path: |
            .
            !.git/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Record snapshot artifact id
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          mkdir -p .flr
          STATUS=$(printf '{"schemaVersion":"FLR_LOCAL_DEV_SNAPSHOT_STATUS_0.2","sourceSha":"%s","runId":%s,"artifactId":%s,"artifactName":"FLR_CURRENT_MAIN_SNAPSHOT"}' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$ARTIFACT_ID")
          CONTENT=$(printf '%s' "$STATUS" | base64 -w0)
          PATH_NAME='.flr/local-snapshot-v2-status.json'
          CURRENT_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${PATH_NAME}?ref=${GITHUB_REF_NAME}" --jq '.sha' 2>/dev/null || true)
          if [ -n "$CURRENT_SHA" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${PATH_NAME}" -f message='Record local snapshot v2 artifact' -f content="$CONTENT" -f sha="$CURRENT_SHA" -f branch="$GITHUB_REF_NAME" >/dev/null
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${PATH_NAME}" -f message='Record local snapshot v2 artifact' -f content="$CONTENT" -f branch="$GITHUB_REF_NAME" >/dev/null
          fi
