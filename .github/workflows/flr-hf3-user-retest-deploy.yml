name: FLR HF3 User Retest Deploy

on:
  push:
    branches: [deploy/v053-hf3-user-retest]
    paths: ['.flr/hf3-user-retest-deploy-request.json']

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Read deployment request
        uses: actions/checkout@v4
        with:
          ref: deploy/v053-hf3-user-retest
          fetch-depth: 0

      - name: Validate pinned candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          req=json.loads(pathlib.Path('.flr/hf3-user-retest-deploy-request.json').read_text(encoding='utf-8'))
          assert req['candidateCommit']=='302ce1aed74d55b9fc1282e54b4e0176bfd98c84', req
          assert req['hf3QaRunId']==32720151086, req
          assert req['expectedStatus']=='PASS', req
          pathlib.Path('/tmp/candidate.sha').write_text(req['candidateCommit']+'\n',encoding='utf-8')
          print('HF3_USER_RETEST_REQUEST_OK',req['candidateCommit'])
          PY

      - name: Materialize exact HF3 candidate
        shell: bash
        run: |
          set -euo pipefail
          CAND=$(cat /tmp/candidate.sha)
          git checkout --force "$CAND"
          python .flr/v053_hf3_apply_v2.py
          python .flr/v053_hf3_tune_v3.py
          python .flr/v053_hf3_tune_v4.py
          python .flr/v053_hf3_tune_v5.py

      - name: Prepare HF3 user-test labels and preserve lower scenario tester
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'V0.5.3 HF2 TEST' not in s:
              raise SystemExit('HF2 page label anchor missing')
          s=s.replace('V0.5.3 HF2 TEST','V0.5.3 HF3 TEST')
          old='최근 수정 장면 검증 · 5개 항목'
          new='최근 수정 장면 검증 · 5개 항목 · HF3'
          if old not in s: raise SystemExit('recent-fix heading anchor missing')
          s=s.replace(old,new,1)
          old_note='버튼을 누르기 전에 아래 다섯 항목을 모두 확인할 수 있습니다. 항목을 고르면 무엇을 볼지와 정상 기준이 바로 표시됩니다.'
          new_note='버튼을 누르기 전에 아래 다섯 항목을 모두 확인할 수 있습니다. 항목을 고르면 무엇을 볼지와 정상 기준이 바로 표시되며, 실행 후 아래 상태 줄에 사용된 seed가 표시됩니다.'
          if old_note not in s: raise SystemExit('recent-fix note anchor missing')
          s=s.replace(old_note,new_note,1)
          p.write_text(s,encoding='utf-8')

          p=Path('step71_hybrid_v06_ui.js')
          s=p.read_text(encoding='utf-8')
          if 'USER-MATCH-TEST-V0.5.3-HF2' not in s or 'umt053h2-' not in s:
              raise SystemExit('HF2 report tag anchor missing')
          s=s.replace('USER-MATCH-TEST-V0.5.3-HF2','USER-MATCH-TEST-V0.5.3-HF3').replace('umt053h2-','umt053h3-')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate materialized HF3 and user tester
        shell: bash
        run: |
          set -euo pipefail
          node --check runtime/tactical_movement.js
          node --check runtime/continuous_match_core.js
          node --check live_v06_scene_authority_browser.js
          node --check step71_hybrid_v06_ui.js
          node .flr/v053_hf3_motion_regression.js
          grep -q 'V0.5.3 HF3 TEST' index.html
          grep -q 'heroRecentFixSelect' index.html
          grep -q 'heroRecentFixRun' index.html
          grep -q 'heroRecentFixNewSeed' index.html
          grep -q 'heroRecentFixReplay' index.html
          grep -q 'seed=${d.seed}' step71_hybrid_v06_ui.js
          grep -q 'USER-MATCH-TEST-V0.5.3-HF3' step71_hybrid_v06_ui.js
          ! grep -q 'USER-MATCH-TEST-V0.5.3-HF2' step71_hybrid_v06_ui.js

      - name: Stage only validated user-test game files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/hf3-user-retest
          mkdir -p /tmp/hf3-user-retest/runtime
          cp index.html /tmp/hf3-user-retest/index.html
          cp step71_hybrid_v06_ui.js /tmp/hf3-user-retest/step71_hybrid_v06_ui.js
          cp live_v06_scene_authority_browser.js /tmp/hf3-user-retest/live_v06_scene_authority_browser.js
          cp runtime/tactical_movement.js /tmp/hf3-user-retest/runtime/tactical_movement.js
          cp runtime/continuous_match_core.js /tmp/hf3-user-retest/runtime/continuous_match_core.js

      - name: Deploy validated files onto current main test page
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout --force origin/main
          cp /tmp/hf3-user-retest/index.html index.html
          cp /tmp/hf3-user-retest/step71_hybrid_v06_ui.js step71_hybrid_v06_ui.js
          cp /tmp/hf3-user-retest/live_v06_scene_authority_browser.js live_v06_scene_authority_browser.js
          cp /tmp/hf3-user-retest/runtime/tactical_movement.js runtime/tactical_movement.js
          cp /tmp/hf3-user-retest/runtime/continuous_match_core.js runtime/continuous_match_core.js
          node --check runtime/tactical_movement.js
          node --check runtime/continuous_match_core.js
          node --check live_v06_scene_authority_browser.js
          node --check step71_hybrid_v06_ui.js
          grep -q 'V0.5.3 HF3 TEST' index.html
          git add index.html step71_hybrid_v06_ui.js live_v06_scene_authority_browser.js runtime/tactical_movement.js runtime/continuous_match_core.js
          git diff --cached --name-only | tee /tmp/hf3-changed.txt
          python - <<'PY'
          from pathlib import Path
          got=set(Path('/tmp/hf3-changed.txt').read_text().splitlines())
          allowed={'index.html','step71_hybrid_v06_ui.js','live_v06_scene_authority_browser.js','runtime/tactical_movement.js','runtime/continuous_match_core.js'}
          assert got, 'NO_DEPLOY_CHANGES'
          assert got <= allowed, (got,allowed)
          print('HF3_DEPLOY_FILE_SCOPE_OK',sorted(got))
          PY
          git config user.name 'FLR HF3 User Retest Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Deploy Match Engine User Test V0.5.3 HF3'
          git push origin HEAD:main
