name: FLR V22 Handoff Export

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  export:
    if: github.event.pull_request.title == '[FLR_HANDOFF] V22 EXPORT'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout audit-era main
        uses: actions/checkout@v4
        with:
          ref: main
          path: audit
          fetch-depth: 1

      - name: Checkout exact public V0.4 authority
        uses: actions/checkout@v4
        with:
          ref: ffba8f8e2011894e7435c1c843dd219b4b9e41e7
          path: export/SOURCE/PUBLIC_USER_MATCH_TEST_V0_4
          fetch-depth: 1

      - name: Checkout exact validated V0.4 candidate
        uses: actions/checkout@v4
        with:
          ref: 1e112838840805cae39a771688b0eb72c3d72f76
          path: export/SOURCE/VALIDATED_V0_4_CANDIDATE
          fetch-depth: 1

      - name: Collect V0.4 feedback evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf export/SOURCE/PUBLIC_USER_MATCH_TEST_V0_4/.git export/SOURCE/VALIDATED_V0_4_CANDIDATE/.git
          mkdir -p export/REPORTS/RAW export/QA_FROM_MAIN
          for rid in \
            umt04-18e7a4ba-3938-47dc-a1eb-d992b87df14d \
            umt04-e4ab4e9d-34a5-4925-a0f7-555412e311b4 \
            umt04-9d22011c-b234-45f0-b9e7-7e9d46990757 \
            umt04-fa3386a4-d200-408c-818c-a44b8078688a \
            umt04-c4f44ee9-67f2-4814-a0a8-c125e278bf70 \
            umt04-17cf3c19-791c-412b-b5b5-824f70601e2d \
            umt04-e0e67a53-024a-4085-ab49-5f3007f82db4 \
            umt04-4c414a83-b4eb-42a6-b3dd-2d8de7b294ff \
            umt04-ed9f5fbe-1573-48dc-a663-9a51c79d3644; do
            curl -fsS "https://flr-bug-reporter.sikarops.workers.dev/reports/USER-MATCH-TEST-V0.4/${rid}.json" -o "export/REPORTS/RAW/${rid}.json"
          done
          for f in \
            .flr/d1-report-audit-status.json \
            .flr/v04-feedback-deep-audit-status.json \
            .flr/v04-feedback-compact-status.json \
            .flr/v04-nonhero-shot-diversity-status.json \
            .flr/v04_feedback_deep_audit.py \
            .flr/v04_feedback_compact_summary.py \
            .flr/v04_nonhero_shot_diversity_audit.js; do
            if [ -f "audit/$f" ]; then cp --parents "audit/$f" export/QA_FROM_MAIN/; fi
          done
          cat > export/EXPORT_META.json <<'JSON'
          {
            "schemaVersion": "FLR_V22_HANDOFF_EXPORT_1.0",
            "publicV04DeployCommit": "ffba8f8e2011894e7435c1c843dd219b4b9e41e7",
            "publicV04PagesRefreshCommit": "6bfefec2c178b2993a2172ed9b8cb70f3b77ef6d",
            "validatedCandidateCommit": "1e112838840805cae39a771688b0eb72c3d72f76",
            "auditMainAtExport": "__AUDIT_SHA__",
            "reportBuild": "USER-MATCH-TEST-V0.4",
            "rawReportCount": 9
          }
          JSON
          sha="$(git -C audit rev-parse HEAD)"
          sed -i "s/__AUDIT_SHA__/${sha}/" export/EXPORT_META.json
          find export -type f -print0 | sort -z | xargs -0 sha256sum > export/EXPORT_SHA256SUMS.txt

      - name: Upload V22 export
        uses: actions/upload-artifact@v4
        with:
          name: flr-v22-handoff-export
          path: export
          if-no-files-found: error
          retention-days: 7
