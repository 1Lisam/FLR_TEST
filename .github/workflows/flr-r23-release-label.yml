name: FLR R23 Release Label
on:
  push:
    branches: [r23-r22-report-fixes]
    paths: ['.github/workflows/flr-r23-release-label.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r23-r22-report-fixes
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Update R23 user test labels and guide
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          def rep(path,old,new,count=None):
            p=Path(path);s=p.read_text(encoding='utf-8');n=s.count(old)
            if count is not None and n!=count: raise SystemExit(f'{path}: expected {count}, found {n}: {old[:120]}')
            if n==0: raise SystemExit(f'{path}: pattern not found: {old[:120]}')
            p.write_text(s.replace(old,new),encoding='utf-8')

          p=Path('index.html');s=p.read_text(encoding='utf-8')
          s=s.replace('V0.5.4 R22 TEST','V0.5.4 R23 TEST')
          s=s.replace('최근 V0.5.4 R22 핵심 장면 검증 · 5개 항목','최근 V0.5.4 R23 핵심 장면 검증 · 5개 항목')
          old='이번 R22는 R21 사용자 리포트의 공간·시간축 재검증판입니다. 1번에서는 공격이 이미 진행됐는데 수비진만 뒤에서 늦게 우르르 올라오지 않는지, 그리고 ST가 중원에서 시작한다면 윙어·미드필더·상대 수비라인까지 전체 상황이 그 위치를 설명하는지 확인해 주세요. 선수는 장면 시작을 위해 재배치되지 않으며 실제 경기 중 계산으로 이미 자연스러운 위치에 도달해야 합니다. 2~3번에서는 풀백이 goal-side/inside-side를 유지하면서도 보이지 않는 벽이나 투우사식 추적 없이 자연스럽게 마킹하는지 확인합니다. 4~5번은 기존 공 운반과 ST 러닝 슈팅의 회귀 확인입니다.'
          new='이번 R23은 R22 사용자 리포트 재검증판입니다. 1번에서는 지공인데 ST만 중원에 고립되거나 상대 공격진이 장면 시작 뒤늦게 수비 위치를 맞추는지, 이동 방향과 몸 방향이 어긋나는지 확인해 주세요. 선수는 장면을 위해 재배치되지 않고 실제 경기 계산으로 이미 상황에 맞는 위치와 움직임을 가져야 합니다. 2번에서는 풀백이 같은 측면 윙어를 버리고 다른 선수를 압박하지 않으며 goal-side/inside-side를 유지하는지, 3번에서는 CB가 마킹·커버 임무를 짧은 순간마다 갈아타며 헤매지 않는지 확인합니다. 4번은 공 운반 연속성 보존, 5번은 러닝 슈팅 보존과 함께 골문 바로 앞에서 의미 없는 공간으로 전진 선택이 뜨거나 선택 시 뒤로 움직이지 않는지 확인합니다.'
          if s.count(old)!=1: raise SystemExit(f'R22 guide expected once, found {s.count(old)}')
          s=s.replace(old,new)
          s=s.replace('3. 풀백 마킹 전환 안정성','3. CB 마킹·커버 전환 안정성')
          p.write_text(s,encoding='utf-8')

          p=Path('step71_hybrid_v06_ui.js');s=p.read_text(encoding='utf-8')
          n=s.count('USER-MATCH-TEST-V0.5.4-R22')
          if n<1: raise SystemExit('R22 build id not found in UI')
          s=s.replace('USER-MATCH-TEST-V0.5.4-R22','USER-MATCH-TEST-V0.5.4-R23')
          s=s.replace("FORMATION_CONTINUITY:{label:'선택 장면 공간·포메이션 연속성',watch:'공격이 이미 전진했는데 수비진만 뒤에 남아 장면 시작 후 우르르 따라오거나, 다른 선수는 정상 배치인데 ST만 혼자 중원에 고립되는지 봅니다.',normal:'정상: 선택 장면이 열리기 전에 22명의 실제 경기 시간이 함께 흘러 상황에 맞는 위치와 속도에 이미 도달해 있습니다. ST가 중원에 있다면 역습·윙어 위치·상대 수비라인 등 전체 장면이 그 이유를 설명해야 합니다.'}","FORMATION_CONTINUITY:{label:'선택 장면 공간·포메이션 연속성',watch:'지공인데 ST만 CM선에 고립되거나, 상대 ST/WF가 장면 시작 뒤늦게 수비 위치를 찾아가거나, 달리는 방향과 몸 방향이 반대로 보이는지 봅니다.',normal:'정상: 22명의 위치·속도·몸 방향이 같은 경기 시간축에서 이어집니다. ST가 중원에 있으면 역습·윙어·상대 수비라인 등 전체 상황이 이유를 설명하고, 수비 중 공격진도 장면 시작 전에 이미 블록에 연결됩니다.'}")
          s=s.replace("DEFENSIVE_ROLE_STABILITY:{label:'선택 시작 전 측면 마킹·압박',watch:'선택 첫 순간 공격수만 먼저 뛰고 수비수가 뒤늦게 출발하거나, 공격수와 수비수가 서로 술래잡기하듯 멈췄다 쫓는지 봅니다.',normal:'정상: 선택 이전 Hybrid부터 마킹 책임과 현재 속도·방향이 이미 계산돼 있어 공격수와 수비수가 같은 live trajectory를 보고 첫 프레임부터 동시에 움직입니다.'}","DEFENSIVE_ROLE_STABILITY:{label:'선택 시작 전 측면 마킹·압박',watch:'풀백이 같은 측면 윙어를 두고 갑자기 다른 공 소유자를 압박하러 나가거나, 추적 중 공격수 바깥쪽으로 교차해 넘어가는지 봅니다.',normal:'정상: 풀백은 실제 위협 윙어의 책임을 유지하면서 goal-side/inside-side에서 함께 움직입니다. 공 소유자가 바뀌었다는 이유만으로 살아 있는 측면 위협을 버리지 않습니다.'}")
          s=s.replace("MARK_TARGET_STABILITY:{label:'풀백 마킹 위치·전환 안정성',watch:'풀백이 윙어보다 바깥쪽/뒤쪽에서 쫓거나 약 1m의 보이지 않는 벽에 걸린 듯 같은 간격만 유지하는지 봅니다.',normal:'정상: goal-side와 inside-side를 우선하되 상대 속도·방향에 따라 간격이 자연스럽게 변하고, 정지한 공격수에는 더 접근할 수 있으며 재침투에는 속도를 맞춰 추적합니다.'}","MARK_TARGET_STABILITY:{label:'CB 마킹·커버 전환 안정성',watch:'CB가 짧은 시간에 MARK/COVER/RECOVERY 같은 책임을 계속 갈아타며 중앙을 버리거나 좌우로 헤매는지 봅니다.',normal:'정상: 일반 패스 한 번마다 책임을 초기화하지 않고 마킹 CB와 커버 CB의 역할이 의미 있는 상황 변화 전까지 이어집니다. 실제 침투·박스 진입·인계가 필요할 때만 자연스럽게 전환합니다.'}")
          s=s.replace("ST_SHOT_VISIBILITY:{label:'노마크 ST 러닝 슈팅 판단 시점',watch:'박스 안 노마크 ST가 달리는 중 바로 슈팅할 수 있는데 CARRY_SCAN/PROTECT_SCAN으로 멈춘 뒤에야 선택이 뜨는지 봅니다.',normal:'정상: 공 통제·자세·슈팅로가 확보된 명백한 찬스라면 달리는 속도를 유지한 채 SHOT 선택이 열립니다. 사용자가 고르기 전 자동 슈팅은 하지 않습니다.'}","ST_SHOT_VISIBILITY:{label:'노마크 ST 러닝 슈팅·골문 앞 전진',watch:'러닝 슈팅이 늦게 열리거나, GK와 아주 가까워 실제 전진 공간이 없는데 공간으로 전진이 뜨거나 그 선택이 뒤로 움직이는지 봅니다.',normal:'정상: 명백한 찬스에서는 달리는 흐름 그대로 SHOT이 열리고, 골문 바로 앞 중앙에서 의미 없는 CARRY는 숨겨집니다. 어떤 경로의 CARRY도 공격 방향 반대로 목표를 만들지 않습니다.'}")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Final syntax and asset checks
        shell: bash
        run: |
          set -euo pipefail
          node --check live_hybrid_session_v02.js
          node --check live_v06_scene_authority_browser.js
          node --check runtime/hybrid_spatial_intent_v2.js
          node --check runtime/tactical_movement.js
          node --check runtime/action_candidate_engine.js
          node --check runtime/continuous_match_core.js
          node --check step71_hybrid_v06_ui.js
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          refs=re.findall(r'(?:src|href)="([^"]+)"',s)
          local=[x for x in refs if not re.match(r'^[a-z]+://',x) and not x.startswith('#')]
          missing=[x for x in local if not Path(x.split('?')[0]).exists()]
          print('HTML_LOCAL_ASSETS',len(local),'MISSING',missing)
          assert not missing
          assert 'V0.5.4 R23 TEST' in s and 'V0.5.4 R22 TEST' not in s
          ui=Path('step71_hybrid_v06_ui.js').read_text(encoding='utf-8')
          assert 'USER-MATCH-TEST-V0.5.4-R23' in ui and 'USER-MATCH-TEST-V0.5.4-R22' not in ui
          print('R23_RELEASE_CHECK: PASS')
          PY
      - name: Commit clean R23 candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/flr-r23-release-label.yml
          git config user.name 'FLR R23 Release Bot'; git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'candidate: USER MATCH TEST V0.5.4 R23'
          git push origin HEAD:r23-r22-report-fixes
