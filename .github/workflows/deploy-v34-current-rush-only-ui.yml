name: deploy-v34-current-rush-only-ui
on:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-v34-current-rush-only-ui.yml']
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Show only current RUSH_BLOCK visual test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          ip=Path('index.html')
          s=ip.read_text()
          start='<div class="test-guide" style="margin:.75rem 0"><strong>최근 핵심 장면 검증 · 9개 항목</strong>'
          end='<div id="heroRecentFixGuide" style="margin:.55rem 0"></div>'
          a=s.find(start); b=s.find(end,a)
          if a<0 or b<0:
              raise SystemExit(f'index recent-test block anchors missing start={a} end={b}')
          replacement='''<div class="test-guide" style="margin:.75rem 0"><strong>현재 확인할 장면 · 1개 항목</strong><p class="test-note">PASS 완료된 기존 1~9번 항목은 사용자 화면에서 숨겼습니다. 내부 자동 회귀 fixture는 삭제하지 않고 계속 유지합니다. 현재는 <b>10번 V34 GK RUSH_BLOCK TEST_ONLY</b>만 확인해 주세요.</p><select id="heroRecentFixSelect" size="1" style="width:100%;max-width:680px"><option value="GK_PHASE2_PLAUSIBILITY_RUSH_BLOCK">10. GK Phase2 · 근거리 러시 블록</option></select>'''
          s=s[:a]+replacement+s[b:]
          ip.write_text(s)

          up=Path('step71_hybrid_v06_ui.js')
          u=up.read_text()
          old="const DEV_RECENT_VISIBLE_KEYS=['DEFENSIVE_ROLE_STABILITY','MARK_TARGET_STABILITY','FORMATION_CONTINUITY','GK_PHASE2_PLAUSIBILITY_CATCH','GK_PHASE2_PLAUSIBILITY_SAFE','GK_PHASE2_PLAUSIBILITY_DANGER','GK_PHASE2_PLAUSIBILITY_TOUCH_LEFT_GOAL','GK_PHASE2_PLAUSIBILITY_TOUCH_RIGHT_GOAL','GK_PHASE2_PLAUSIBILITY_TOUCH_CORNER','GK_PHASE2_PLAUSIBILITY_RUSH_BLOCK'];"
          new="const DEV_RECENT_VISIBLE_KEYS=['GK_PHASE2_PLAUSIBILITY_RUSH_BLOCK'];"
          if u.count(old)!=1:
              raise SystemExit(f'visible key anchor count={u.count(old)}')
          up.write_text(u.replace(old,new,1))
          PY

          node --check step71_hybrid_v06_ui.js
          git diff --check
          grep -q '10. GK Phase2 · 근거리 러시 블록' index.html
          grep -q "const DEV_RECENT_VISIBLE_KEYS=\['GK_PHASE2_PLAUSIBILITY_RUSH_BLOCK'\];" step71_hybrid_v06_ui.js
          if grep -q '4. GK Phase2 · 쉬운 슛 캐칭' index.html; then echo 'old PASS item still visible'; exit 1; fi
          if grep -q '9. GK Phase2 · 장갑 굴절 코너' index.html; then echo 'old PASS item still visible'; exit 1; fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html step71_hybrid_v06_ui.js
          git diff --cached --quiet && { echo 'no UI changes'; exit 1; }
          git commit -m 'Show only current GK RUSH_BLOCK visual test'
          git push origin HEAD:main
