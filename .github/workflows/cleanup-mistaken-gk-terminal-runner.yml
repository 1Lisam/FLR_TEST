name: cleanup-mistaken-gk-terminal-runner
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-mistaken-gk-terminal-runner.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore pre-misunderstanding public test state
        shell: bash
        run: |
          set -euo pipefail
          git checkout b70eedba1fdb63829ba3f9c2366180d2ac851ea5 -- step71_hybrid_v06_ui.js
          git rm -f .github/workflows/deploy-v34-gk-visual-runner-terminal-aware.yml
          git rm -f .github/workflows/cleanup-mistaken-gk-terminal-runner.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -am 'Revert mistaken GK terminal-runner change'
          git push origin HEAD:main
