name: FLR V0.5.4 Exact Source Export

on:
  push:
    branches:
      - data-export/v054-r14-local-source
    paths:
      - '.flr/v054-source-export-trigger.json'

permissions:
  contents: write
\ jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout export control
        uses: actions/checkout@v4
        with:
          ref: data-export/v054-r14-local-source
          path: control
          fetch-depth: 1

      - name: Checkout exact R13 baseline
        uses: actions/checkout@v4
        with:
          ref: 8965e9eb026d317be95db14bf8e80a135e6aef56
          path: work
          fetch-depth: 1

      - name: Materialize exact V0.5.4 R13 engine
        shell: bash
        run: |
          set -euo pipefail
          python control/.flr/v054_defense_normalization_apply_bundle.py work
          for f in \
            work/runtime/tactical_movement.js \
            work/runtime/hybrid_spatial_intent_v2.js \
            work/runtime/continuous_match_core.js \
            work/runtime/protagonist_match_controller.js \
            work/live_hybrid_session_v02.js \
            work/live_v06_scene_authority_browser.js; do
            node --check "$f"
          done
          rm -rf work/.git
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('work')
          files=[
            'runtime/tactical_movement.js',
            'runtime/hybrid_spatial_intent_v2.js',
            'runtime/continuous_match_core.js',
            'runtime/protagonist_match_controller.js',
            'live_hybrid_session_v02.js',
            'live_v06_scene_authority_browser.js',
          ]
          out={'schemaVersion':'FLR_V054_EXACT_SOURCE_EXPORT_1.0','baseline':'8965e9eb026d317be95db14bf8e80a135e6aef56','control':'8fc461f48f05e1ea508edacb990282c815ae51ef','files':{}}
          for rel in files:
              b=(root/rel).read_bytes()
              hdr=b'blob '+str(len(b)).encode()+b'\0'
              out['files'][rel]={'bytes':len(b),'gitBlob':hashlib.sha1(hdr+b).hexdigest(),'sha256':hashlib.sha256(b).hexdigest()}
          (root/'V054_EXACT_SOURCE_MANIFEST.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          (cd work && zip -qr ../V054_R13_EXACT_MATERIALIZED.zip .)
          sha256sum V054_R13_EXACT_MATERIALIZED.zip > V054_R13_EXACT_MATERIALIZED.zip.sha256

      - name: Upload exact materialized source
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: V054-R13-EXACT-MATERIALIZED
          path: |
            V054_R13_EXACT_MATERIALIZED.zip
            V054_R13_EXACT_MATERIALIZED.zip.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Record export locator
        if: always()
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('control/.flr/v054-source-export-result.json')
          p.write_text(json.dumps({
            'schemaVersion':'FLR_V054_SOURCE_EXPORT_LOCATOR_1.0',
            'status':'PASS' if os.environ.get('ARTIFACT_ID') else 'FAIL',
            'runId':os.environ.get('GITHUB_RUN_ID'),
            'artifactId':int(os.environ['ARTIFACT_ID']) if os.environ.get('ARTIFACT_ID') else None,
            'artifactUrl':os.environ.get('ARTIFACT_URL') or None,
            'baseline':'8965e9eb026d317be95db14bf8e80a135e6aef56',
            'control':'8fc461f48f05e1ea508edacb990282c815ae51ef'
          },indent=2),encoding='utf-8')
          PY
          git -C control config user.name 'FLR Source Export'
          git -C control config user.email 'actions@users.noreply.github.com'
          git -C control add .flr/v054-source-export-result.json
          git -C control commit -m 'Record V0.5.4 exact source export locator' || true
          git -C control push origin HEAD:data-export/v054-r14-local-source
