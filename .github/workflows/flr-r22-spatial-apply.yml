name: FLR R22 Spatial Coherence Apply

on:
  push:
    branches: [r22-spatial-coherence]
    paths:
      - '.github/workflows/flr-r22-spatial-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r22-spatial-coherence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Rebuild and verify R22 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .flr/r22/patch00.b64 .flr/r22/patch01.b64 .flr/r22/patch02.b64 .flr/r22/patch03.b64 | base64 -d | gzip -d > /tmp/r22.patch
          echo '592cb29fb766d35610de272bef548032c6c73a5e03128509d20758a2d546c3eb  /tmp/r22.patch' | sha256sum -c -
          git apply --check /tmp/r22.patch
          git apply /tmp/r22.patch
      - name: Update R22 test guide
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('V0.5.4 R21 TEST','V0.5.4 R22 TEST')
          s=s.replace('최근 V0.5.4 R21 핵심 장면 검증 · 5개 항목','최근 V0.5.4 R22 핵심 장면 검증 · 5개 항목')
          old='이번 R21은 R20 사용자 리포트의 최우선 재검증판입니다. 1번에서는 선택 장면이 시작될 때 22명이 특정 포메이션이나 세컨드볼 위치로 다시 배치되지 않고 직전까지 계산된 실제 위치·속도를 그대로 이어받는지, 그리고 새 SEED에서는 다른 경기 경로만큼 시작 배치도 달라지는지 확인해 주세요. 2~3번에서는 수비수가 공격수 감속에 맞춰 제동하며 투우사처럼 미끄러지지 않는지 확인해 주세요. 4~5번은 R20에서 좋아진 공 운반과 ST 러닝 슈팅이 유지되는지 확인합니다.'
          new='이번 R22는 R21 사용자 리포트의 공간·시간축 재검증판입니다. 1번에서는 공격이 이미 진행됐는데 수비진만 뒤에서 늦게 우르르 올라오지 않는지, 그리고 ST가 중원에서 시작한다면 윙어·미드필더·상대 수비라인까지 전체 상황이 그 위치를 설명하는지 확인해 주세요. 선수는 장면 시작을 위해 재배치되지 않으며 실제 경기 중 계산으로 이미 자연스러운 위치에 도달해야 합니다. 2~3번에서는 풀백이 goal-side/inside-side를 유지하면서도 보이지 않는 벽이나 투우사식 추적 없이 자연스럽게 마킹하는지 확인합니다. 4~5번은 기존 공 운반과 ST 러닝 슈팅의 회귀 확인입니다.'
          if old not in s:
              raise SystemExit('expected R21 guide text not found')
          s=s.replace(old,new)
          s=s.replace('1. 선택 장면 포메이션 연속성','1. 선택 장면 공간·포메이션 연속성')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate exact candidate
        shell: bash
        run: |
          set -euo pipefail
          node --check live_hybrid_session_v02.js
          node --check runtime/hybrid_spatial_intent_v2.js
          node --check runtime/continuous_match_core.js
          node --check step71_hybrid_v06_ui.js
          echo 'bd4fe45141b51014a657e9fb1d501e7e1ba1d30311d545f14365b3d842b9e28a  live_hybrid_session_v02.js' | sha256sum -c -
          echo 'a2991fdaa002f5ede0ae9517dd9294287382af08ceb95becc71e5624bca23738  runtime/hybrid_spatial_intent_v2.js' | sha256sum -c -
          echo '55600bbb5f13b23d2d05caea93236e5c841491ff1113e6340c8e20fdc2f8a243  runtime/continuous_match_core.js' | sha256sum -c -
          echo '29fee9f499a83859b7c7a3d3ba3e8de2efc72e02ae9ed7b42563c15f2686e328  step71_hybrid_v06_ui.js' | sha256sum -c -
          echo '1b77d73acd04769c4bc5ddff0d5a91c971be098d2b59a41b371b4d4bb508a32c  index.html' | sha256sum -c -
          ! grep -q 'USER-MATCH-TEST-V0.5.4-R21' step71_hybrid_v06_ui.js
          grep -q 'V0.5.4 R22 TEST' index.html
      - name: Commit clean R22 candidate only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .flr/r22
          rm -f .github/workflows/flr-r22-spatial-apply.yml
          git config user.name 'FLR R22 Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          echo 'Changed files before commit:'
          git diff --cached --name-only
          # This commit contains five game-file edits plus deletion of the four temporary patch chunks
          # and the temporary apply workflow. In the final branch-vs-main comparison those five temporary
          # additions cancel out, leaving exactly the five intended game files.
          test "$(git diff --cached --name-only | wc -l)" -eq 10
          git diff --cached --name-only | grep -qx 'index.html'
          git diff --cached --name-only | grep -qx 'live_hybrid_session_v02.js'
          git diff --cached --name-only | grep -qx 'runtime/continuous_match_core.js'
          git diff --cached --name-only | grep -qx 'runtime/hybrid_spatial_intent_v2.js'
          git diff --cached --name-only | grep -qx 'step71_hybrid_v06_ui.js'
          git commit -m 'deploy: USER MATCH TEST V0.5.4 R22 spatial coherence'
          git push origin HEAD:r22-spatial-coherence
