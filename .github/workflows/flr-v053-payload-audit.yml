name: FLR V0.5.3 staged payload audit

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  audit:
    if: github.event.issue.title == '[FLR_AUDIT] V0.5.3 PAYLOAD'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout staged payload
        uses: actions/checkout@v4
        with:
          ref: automation/tt-deploy
          path: _incoming
          fetch-depth: 1

      - name: Compute staged assembled hashes
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          specs = [
            ('index.html', ['.flr/v053_payload/index.html.part00'], 'd03d47333ed1370bdd753ad0e9616df505224acb06bf70b18dcdb1fe16c1d23f'),
            ('live_hybrid_session_v02.js', ['.flr/v053_payload/small/live_hybrid_session_v02.js.p00','.flr/v053_payload/small/live_hybrid_session_v02.js.p01','.flr/v053_payload/small/live_hybrid_session_v02.js.p02'], '4ca3856fa994cc18401de1072a04063235f4195d493bf010e39feeb73bc8541e'),
            ('live_v06_scene_authority_browser.js', ['.flr/v053_payload/small/live_v06_scene_authority_browser.js.p00','.flr/v053_payload/small/live_v06_scene_authority_browser.js.p01'], 'ff3e7f660513af20cbc7cd93fa53c1e15c6cb5970be3abd125fd5c192b1a7798'),
            ('runtime/hybrid_spatial_intent_v2.js', ['.flr/v053_payload/small/runtime__hybrid_spatial_intent_v2.js.p00','.flr/v053_payload/small/runtime__hybrid_spatial_intent_v2.js.p01'], 'ebaf882d3b2bd2edc11d575430b4a930cbaa4164a2d38d2e636b5b7269d512e8'),
            ('runtime/protagonist_match_controller.js', ['.flr/v053_payload/small/runtime__protagonist_match_controller.js.p00x0','.flr/v053_payload/small/runtime__protagonist_match_controller.js.p00x1','.flr/v053_payload/small/runtime__protagonist_match_controller.js.p00x2','.flr/v053_payload/small/runtime__protagonist_match_controller.js.p01','.flr/v053_payload/small/runtime__protagonist_match_controller.js.p02','.flr/v053_payload/small/runtime__protagonist_match_controller.js.p03','.flr/v053_payload/small/runtime__protagonist_match_controller.js.p04','.flr/v053_payload/small/runtime__protagonist_match_controller.js.p05'], '572fe690129d0a8866720f5e2f850aa002b6ad12bdeebc8303c94e083cd4180f'),
            ('step71_hybrid_v06_ui.js', ['.flr/v053_payload/small/step71_hybrid_v06_ui.js.p00','.flr/v053_payload/small/step71_hybrid_v06_ui.js.p01','.flr/v053_payload/small/step71_hybrid_v06_ui.js.p02','.flr/v053_payload/small/step71_hybrid_v06_ui.js.p03'], '1618b32c49bca7f9df527e08a11adb5b1f150c645f216d3bd14309f04f3eae4a'),
          ]
          root=Path('_incoming')
          rows=[]
          for dest, parts, expected in specs:
              missing=[p for p in parts if not (root/p).is_file()]
              if missing:
                  rows.append({'path':dest,'expected':expected,'actual':None,'match':False,'missing':missing})
                  continue
              data=b''.join((root/p).read_bytes() for p in parts)
              actual=hashlib.sha256(data).hexdigest()
              rows.append({'path':dest,'bytes':len(data),'expected':expected,'actual':actual,'match':actual==expected,'parts':parts})
          out={'schemaVersion':'FLR_V053_STAGED_PAYLOAD_AUDIT_1.0','allMatch':all(r['match'] for r in rows),'files':rows}
          Path('.flr').mkdir(exist_ok=True)
          Path('.flr/v053-payload-audit.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,indent=2))
          PY
          rm -rf _incoming

      - name: Persist audit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FLR Audit Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .flr/v053-payload-audit.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record V0.5.3 staged payload audit'
          git push origin main
