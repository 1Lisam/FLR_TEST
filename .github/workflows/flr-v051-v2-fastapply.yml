name: FLR V0.5.1 V2 Fast Apply
on:
  push:
    branches: [main]
    paths: ['.flr/v051-v2-fastapply-request.json']
permissions: {contents: write}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: candidate/v051-consolidated-retest-20260823}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - id: qa
        continue-on-error: true
        run: |
          curl -fsSL https://raw.githubusercontent.com/1Lisam/FLR_TEST/main/.flr/v051_consolidated_retest_apply_v2.py -o /tmp/a.py
          python /tmp/a.py
          node --check runtime/continuous_match_core.js
          node --check runtime/protagonist_match_controller.js
          grep -q 'npcPassDecision' runtime/continuous_match_core.js
          grep -q 'showPendingCausally' step71_hybrid_v06_ui.js
      - if: always()
        env: {OUTCOME: "${{ steps.qa.outcome }}"}
        run: |
          git reset --hard HEAD;git fetch origin main;git checkout -B record origin/main;mkdir -p .flr;printf '{"status":"%s"}\n' "$( [ "$OUTCOME" = success ] && echo PASS || echo FAIL )" > .flr/v051-v2-fastapply-status.json;git config user.name 'FLR V0.5.1 Fast';git config user.email 'actions@users.noreply.github.com';git add .flr/v051-v2-fastapply-status.json;git commit -m 'Record V0.5.1 V2 fast apply' || true;git push origin HEAD:main;[ "$OUTCOME" = success ]
