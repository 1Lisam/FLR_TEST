name: FLR local development snapshot

on:
  push:
    paths:
      - '.github/workflows/flr-local-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Record snapshot metadata
        shell: bash
        run: |
          printf '{"schemaVersion":"FLR_LOCAL_DEV_SNAPSHOT_0.1","ref":"%s","sha":"%s","createdBy":"github-actions"}\n' "${GITHUB_REF_NAME}" "${GITHUB_SHA}" > FLR_LOCAL_DEV_SNAPSHOT.json
      - name: Upload complete repository snapshot
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: FLR_TT050_MAIN_SNAPSHOT
          path: |
            .
            !.git/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Record downloadable snapshot id
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          mkdir -p .flr
          printf '{\n  "schemaVersion":"FLR_LOCAL_DEV_SNAPSHOT_STATUS_0.1",\n  "sourceSha":"%s",\n  "runId":%s,\n  "artifactId":%s,\n  "artifactName":"FLR_TT050_MAIN_SNAPSHOT",\n  "artifactUrl":"%s"\n}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$ARTIFACT_ID" "$ARTIFACT_URL" > .flr/local-snapshot-status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .flr/local-snapshot-status.json
          git commit -m "Record local development snapshot artifact" || exit 0
          git push
