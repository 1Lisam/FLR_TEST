name: FLR Historical Closure Audit

on:
  issues:
    types: [opened]

permissions:
  contents: write

concurrency:
  group: flr-historical-closure-audit
  cancel-in-progress: true

jobs:
  audit:
    if: github.event.issue.title == '[FLR_AUDIT] HISTORICAL CLOSURE V0.3'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Run historical closure audit with captured diagnostics
        shell: bash
        run: |
          set +e
          : > /tmp/historical-audit.log
          node -v >> /tmp/historical-audit.log 2>&1
          node --check .flr/historical_closure_audit.js >> /tmp/historical-audit.log 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            node .flr/historical_closure_audit.js /tmp/historical-closure-status.json >> /tmp/historical-audit.log 2>&1
            rc=$?
          fi
          if [ "$rc" -ne 0 ] || [ ! -s /tmp/historical-closure-status.json ]; then
            LOG="$(tail -c 12000 /tmp/historical-audit.log 2>/dev/null | python -c 'import json,sys; print(json.dumps(sys.stdin.read()))')"
            printf '{"schemaVersion":"FLR_HISTORICAL_CLOSURE_AUDIT_1.1","status":"FAILED_TO_RUN","errorTail":%s}\n' "$LOG" > /tmp/historical-closure-status.json
          fi
          exit 0
      - name: Record audit result
        if: always()
        shell: bash
        run: |
          set +e
          test -s /tmp/historical-closure-status.json || printf '{"schemaVersion":"FLR_HISTORICAL_CLOSURE_AUDIT_1.1","status":"FAILED_TO_RUN","errorTail":"no output"}\n' > /tmp/historical-closure-status.json
          git config user.name 'FLR Historical Audit Bot'
          git config user.email 'actions@users.noreply.github.com'
          git reset --hard HEAD
          git pull --rebase origin main || git reset --hard origin/main
          cp /tmp/historical-closure-status.json .flr/historical-closure-status.json
          git add .flr/historical-closure-status.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record historical bug closure audit'
          git push origin HEAD:main
