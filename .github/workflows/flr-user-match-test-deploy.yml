name: FLR User Match Test one-time deploy

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  deploy:
    if: github.event.issue.title == '[FLR_DEPLOY] USER MATCH TEST V0.1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout staged test build
        uses: actions/checkout@v4
        with:
          ref: automation/tt-deploy
          path: _incoming
          fetch-depth: 1

      - name: Replace test files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, io, pathlib, tarfile

          root = pathlib.Path('_incoming/.flr/user_match_test_v0_1')
          encoded = b''.join((root / f'b64.part{i:02d}').read_bytes() for i in range(10))
          tail = (root / 'missing.part05').read_bytes()
          encoded += tail[4000:] + b'WqX'
          encoded += (root / 'missing.part06').read_bytes()
          encoded += (root / 'missing.part07').read_bytes()

          archive = base64.b64decode(encoded, validate=True)
          expected_sha = 'a7de123697cd6020868f46930df9d1094493117109ee0e11d5f6970014ebd611'
          actual_sha = hashlib.sha256(archive).hexdigest()
          if actual_sha != expected_sha:
              raise SystemExit(f'ARCHIVE_SHA_MISMATCH expected={expected_sha} actual={actual_sha}')

          expected = [
              'index.html',
              'live_hybrid_session_v02.js',
              'live_v06_scene_authority_browser.js',
              'runtime/attribute_match_adapter.js',
              'runtime/ball_strike_model.js',
              'runtime/choice_action_resolver.js',
              'runtime/continuous_match_core.js',
              'runtime/manager_tendency_adapter.js',
              'runtime/match_choice_telemetry.js',
              'runtime/protagonist_match_controller.js',
              'runtime/restart_movement.js',
              'runtime/tactical_movement.js',
          ]
          expected_set = set(expected)

          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:gz') as tf:
              files = []
              for member in tf.getmembers():
                  name = member.name
                  while name.startswith('./'):
                      name = name[2:]
                  if not name or member.isdir():
                      continue
                  p = pathlib.PurePosixPath(name)
                  if p.is_absolute() or '..' in p.parts or not member.isfile():
                      raise SystemExit('UNSAFE_ARCHIVE_ENTRY:' + name)
                  files.append((member, name))
              names = [name for _, name in files]
              if set(names) != expected_set or len(names) != len(expected):
                  raise SystemExit(f'FILE_SET_MISMATCH actual={sorted(names)}')
              for member, name in files:
                  src = tf.extractfile(member)
                  if src is None:
                      raise SystemExit('EXTRACT_FAILED:' + name)
                  dest = pathlib.Path(name)
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(src.read())
                  print('replaced', name)

          pathlib.Path('/tmp/flr_changed_files').write_text('\n'.join(expected) + '\n', encoding='utf-8')
          print('archive sha256', actual_sha)
          PY
          rm -rf _incoming

      - name: Check JavaScript
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if [[ "$f" == *.js ]]; then node --check "$f"; fi
          done < /tmp/flr_changed_files

      - name: Commit test build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FLR Test Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            git add -- "$f"
          done < /tmp/flr_changed_files
          git diff --cached --quiet && { echo NO_CHANGES; exit 1; }
          git commit -m "Deploy Match Engine User Test V0.1"
          git push origin main
