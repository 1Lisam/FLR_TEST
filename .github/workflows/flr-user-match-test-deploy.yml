name: FLR User Match Test one-time deploy

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  deploy:
    if: github.event.issue.title == '[FLR_DEPLOY] USER MATCH TEST V0.1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout staged payload
        uses: actions/checkout@v4
        with:
          ref: automation/tt-deploy
          path: _incoming
          fetch-depth: 1

      - name: Verify and replace public test files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, io, json, pathlib, subprocess, tarfile
          meta = json.loads(pathlib.Path('_incoming/.flr/deploy.json').read_text(encoding='utf-8'))
          head = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          if head != meta['baseCommit']:
              raise SystemExit(f"BASE_COMMIT_MISMATCH expected={meta['baseCommit']} actual={head}")
          if meta.get('toBuild') != 'USER-MATCH-TEST-V0.1':
              raise SystemExit('WRONG_BUILD')
          if meta.get('validationStatus') != 'PASS_FOR_USER_VISUAL_RETEST':
              raise SystemExit('BUILD_NOT_VALIDATED')
          spec = meta['base64TarGz']
          root = pathlib.Path('_incoming')
          def read_parts(names):
              paths = [root / x for x in names]
              missing = [str(p) for p in paths if not p.is_file()]
              if missing:
                  raise SystemExit('MISSING_PARTS:'+','.join(missing))
              return b''.join(p.read_bytes() for p in paths)
          head64 = read_parts(spec['headParts'])
          bridge = read_parts(spec['bridgeParts'])
          middle = read_parts(spec['middleParts'])
          cut = int(spec['bridgeSplit'])
          encoded = head64 + bridge[:cut] + middle + bridge[cut:]
          archive = base64.b64decode(encoded, validate=True)
          actual = hashlib.sha256(archive).hexdigest()
          if actual != spec['sha256']:
              raise SystemExit(f"ARCHIVE_SHA_MISMATCH expected={spec['sha256']} actual={actual}")
          expected = set(meta['changedFiles'])
          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:gz') as tf:
              entries = []
              for member in tf.getmembers():
                  name = member.name
                  while name.startswith('./'):
                      name = name[2:]
                  if not name or member.isdir():
                      continue
                  pp = pathlib.PurePosixPath(name)
                  if pp.is_absolute() or '..' in pp.parts or not member.isfile():
                      raise SystemExit('UNSAFE_ARCHIVE_ENTRY:'+name)
                  entries.append((member, name))
              names = [name for _, name in entries]
              if set(names) != expected or len(names) != len(expected):
                  raise SystemExit(f"FILE_SET_MISMATCH expected={sorted(expected)} actual={sorted(names)}")
              for member, name in entries:
                  src = tf.extractfile(member)
                  if src is None:
                      raise SystemExit('EXTRACT_FAILED:'+name)
                  dest = pathlib.Path(name)
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(src.read())
                  print('replaced', name)
          pathlib.Path('/tmp/flr_changed_files').write_text('\n'.join(meta['changedFiles'])+'\n', encoding='utf-8')
          PY
          rm -rf _incoming

      - name: JavaScript syntax check
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if [[ "$f" == *.js ]]; then node --check "$f"; fi
          done < /tmp/flr_changed_files

      - name: Commit replacement to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FLR Test Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            git add -- "$f"
          done < /tmp/flr_changed_files
          git diff --cached --quiet && { echo NO_CHANGES; exit 1; }
          git commit -m "Deploy Match Engine User Test V0.1"
          git push origin main
