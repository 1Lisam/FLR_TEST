name: FLR User Match Test V0.2 patch deploy

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  deploy:
    if: github.event.issue.title == '[FLR_DEPLOY] USER MATCH TEST V0.2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply narrow ST-entry fix and V0.2 labels
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p=Path('live_hybrid_session_v02.js')
          s=p.read_text(encoding='utf-8')
          old_actor="function pickActor(session,team,state,kind){const p=team==='HOME'?'H':'A';if(kind==='SHOT'){const pool=state.ball.lane==='LEFT'?[`${p}-LW`,`${p}-ST`,`${p}-LCM`]:state.ball.lane==='RIGHT'?[`${p}-RW`,`${p}-ST`,`${p}-RCM`]:[`${p}-ST`,`${p}-CM`,`${p}-LCM`,`${p}-RCM`];return pick(session,pool);}return pick(session,lanePool(team,state.ball.lane,state.phase));}"
          new_actor="function pickActor(session,team,state,kind){const p=team==='HOME'?'H':'A';if(kind==='SHOT'){const pool=state.ball.lane==='LEFT'?[`${p}-LW`,`${p}-ST`,`${p}-LCM`]:state.ball.lane==='RIGHT'?[`${p}-RW`,`${p}-ST`,`${p}-RCM`]:[`${p}-ST`,`${p}-CM`,`${p}-LCM`,`${p}-RCM`];return pick(session,pool);}const actor=pick(session,lanePool(team,state.ball.lane,state.phase));if(Number(state.ball.progress)<.28&&roleOf(actor)==='ST')return state.ball.lane==='LEFT'?`${p}-LCM`:state.ball.lane==='RIGHT'?`${p}-RCM`:`${p}-CM`;return actor;}"
          old_target="function pickTarget(session,team,state,actor){const p=team==='HOME'?'H':'A';let pool=state.ball.lane==='LEFT'?[`${p}-LW`,`${p}-ST`,`${p}-LCM`,`${p}-LB`]:state.ball.lane==='RIGHT'?[`${p}-RW`,`${p}-ST`,`${p}-RCM`,`${p}-RB`]:[`${p}-ST`,`${p}-CM`,`${p}-LCM`,`${p}-RCM`];pool=pool.filter(x=>x!==actor);return pick(session,pool)||`${p}-ST`; }".replace('; }',';}')
          new_target="function pickTarget(session,team,state,actor){const p=team==='HOME'?'H':'A';let pool=state.ball.lane==='LEFT'?[`${p}-LW`,`${p}-ST`,`${p}-LCM`,`${p}-LB`]:state.ball.lane==='RIGHT'?[`${p}-RW`,`${p}-ST`,`${p}-RCM`,`${p}-RB`]:[`${p}-ST`,`${p}-CM`,`${p}-LCM`,`${p}-RCM`];pool=pool.filter(x=>x!==actor);let target=pick(session,pool)||`${p}-ST`;if(Number(state.ball.progress)<.28&&roleOf(target)==='ST')target=state.ball.lane==='LEFT'?`${p}-LCM`:state.ball.lane==='RIGHT'?`${p}-RCM`:`${p}-CM`;if(target===actor)target=`${p}-CM`===actor?`${p}-LCM`:`${p}-CM`;return target;}"
          if s.count(old_actor)!=1: raise SystemExit(f'pickActor match count={s.count(old_actor)}')
          if s.count(old_target)!=1: raise SystemExit(f'pickTarget match count={s.count(old_target)}')
          s=s.replace(old_actor,new_actor).replace(old_target,new_target)
          p.write_text(s,encoding='utf-8')

          p=Path('step71_hybrid_v06_ui.js')
          s=p.read_text(encoding='utf-8')
          if 'TT-0.51' not in s: raise SystemExit('TT-0.51 build tag not found')
          s=s.replace('TT-0.51','USER-MATCH-TEST-V0.2').replace('tt051-','umt02-')
          p.write_text(s,encoding='utf-8')

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'V0.1' not in s: raise SystemExit('V0.1 label not found')
          p.write_text(s.replace('V0.1','V0.2'),encoding='utf-8')
          PY

      - name: JavaScript syntax check
        shell: bash
        run: |
          set -euo pipefail
          node --check live_hybrid_session_v02.js
          node --check step71_hybrid_v06_ui.js
          grep -q 'Match Engine User Test V0.2' index.html
          grep -q 'USER-MATCH-TEST-V0.2' step71_hybrid_v06_ui.js
          ! grep -q 'TT-0.51' step71_hybrid_v06_ui.js

      - name: Commit V0.2
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FLR Test Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add live_hybrid_session_v02.js step71_hybrid_v06_ui.js index.html
          git diff --cached --quiet && { echo NO_CHANGES; exit 1; }
          git commit -m 'Deploy Match Engine User Test V0.2'
          git push origin main
