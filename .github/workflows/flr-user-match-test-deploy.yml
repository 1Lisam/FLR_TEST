name: FLR User Match Test V0.3 patch deploy

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  deploy:
    if: github.event.issue.title == '[FLR_DEPLOY] USER MATCH TEST V0.3'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply carry semantics, goal presentation, and V0.3 labels
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p=Path('runtime/continuous_match_core.js')
          s=p.read_text(encoding='utf-8')
          old_sig='function executeCarry(m,owner){'
          new_sig='function executeCarry(m,owner,opts={}){'
          old_guard="if(!inBox&&l.x>=70&&l.x<88&&['ST','WF','CM'].includes(owner.role)&&pressure<3.0){"
          new_guard="if(!opts.userCommitted&&!inBox&&l.x>=70&&l.x<88&&['ST','WF','CM'].includes(owner.role)&&pressure<3.0){"
          old_apply="  }else executeCarry(m,owner);\n  return true;"
          new_apply="  }else if(action.type==='CARRY')executeCarry(m,owner,{userCommitted:action.reason==='CANDIDATE_CARRY'||action.reason==='CLEAR_RUNWAY'});\n  else executeCarry(m,owner);\n  return true;"
          for label,old in [('carry signature',old_sig),('carry guard',old_guard),('carry apply',old_apply)]:
              if s.count(old)!=1: raise SystemExit(f'{label} match count={s.count(old)}')
          s=s.replace(old_sig,new_sig).replace(old_guard,new_guard).replace(old_apply,new_apply)
          p.write_text(s,encoding='utf-8')

          p=Path('runtime/protagonist_match_controller.js')
          s=p.read_text(encoding='utf-8')
          old_goal="if(tt==='GOAL')ready=(s.m.phase!=='GOAL_CELEBRATION'&&(!s.m.restart||s.m.restart.kind!=='KICKOFF'))||age>=6.2;"
          new_goal="if(tt==='GOAL'){const visibleGoalAge=s.m.goalCelebration?now-Number(s.m.goalCelebration.startedAt||now):null;ready=(s.m.phase!=='GOAL_CELEBRATION'&&(!s.m.restart||s.m.restart.kind!=='KICKOFF'))||(visibleGoalAge!=null&&visibleGoalAge>=4.8);}"
          old_shot_goal="else if(shotOutcome.type==='GOAL')ready=(s.m.phase!=='GOAL_CELEBRATION'&&(!s.m.restart||s.m.restart.kind!=='KICKOFF'))||sa>=6.2;"
          new_shot_goal="else if(shotOutcome.type==='GOAL'){const visibleGoalAge=s.m.goalCelebration?now-Number(s.m.goalCelebration.startedAt||now):null;ready=(s.m.phase!=='GOAL_CELEBRATION'&&(!s.m.restart||s.m.restart.kind!=='KICKOFF'))||(visibleGoalAge!=null&&visibleGoalAge>=4.8);}"
          old_finish="if(ready||now>=tr.deadline||s.m.completed)return finalizeResult(s,terminal);"
          new_finish="const goalPresentationActive=tt==='GOAL'&&s.m.phase==='GOAL_CELEBRATION'&&!!s.m.goalCelebration;if(ready||(!goalPresentationActive&&now>=tr.deadline)||s.m.completed)return finalizeResult(s,terminal);"
          for label,old in [('goal result',old_goal),('shot goal result',old_shot_goal),('result deadline',old_finish)]:
              if s.count(old)!=1: raise SystemExit(f'{label} match count={s.count(old)}')
          s=s.replace(old_goal,new_goal).replace(old_shot_goal,new_shot_goal).replace(old_finish,new_finish)
          p.write_text(s,encoding='utf-8')

          p=Path('step71_hybrid_v06_ui.js')
          s=p.read_text(encoding='utf-8')
          if 'USER-MATCH-TEST-V0.2' not in s: raise SystemExit('V0.2 report build tag not found')
          s=s.replace('USER-MATCH-TEST-V0.2','USER-MATCH-TEST-V0.3').replace('umt02-','umt03-')
          p.write_text(s,encoding='utf-8')

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'V0.2' not in s: raise SystemExit('V0.2 page label not found')
          p.write_text(s.replace('V0.2','V0.3'),encoding='utf-8')
          PY

      - name: JavaScript syntax and patch checks
        shell: bash
        run: |
          set -euo pipefail
          node --check runtime/continuous_match_core.js
          node --check runtime/protagonist_match_controller.js
          node --check step71_hybrid_v06_ui.js
          grep -q "userCommitted" runtime/continuous_match_core.js
          grep -q "visibleGoalAge" runtime/protagonist_match_controller.js
          grep -q 'Match Engine User Test V0.3' index.html
          grep -q 'USER-MATCH-TEST-V0.3' step71_hybrid_v06_ui.js
          grep -q 'umt03-' step71_hybrid_v06_ui.js
          ! grep -q 'USER-MATCH-TEST-V0.2' step71_hybrid_v06_ui.js

      - name: Commit V0.3
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FLR Test Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add runtime/continuous_match_core.js runtime/protagonist_match_controller.js step71_hybrid_v06_ui.js index.html
          git diff --cached --quiet && { echo NO_CHANGES; exit 1; }
          git commit -m 'Deploy Match Engine User Test V0.3'
          git push origin main
