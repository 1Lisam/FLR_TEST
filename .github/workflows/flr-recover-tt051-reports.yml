name: FLR Recover TT-0.51 Reports

on:
  push:
    branches: [audit/tt051-known-reports]
    paths:
      - '.github/workflows/flr-recover-tt051-reports.yml'
      - '.flr/recover-tt051-request.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: audit/tt051-known-reports
          fetch-depth: 0

      - name: Locate R2 account and recover report index
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FALLBACK_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error, pathlib, datetime
          token=os.environ.get('CLOUDFLARE_API_TOKEN','').strip()
          fallback=os.environ.get('FALLBACK_ACCOUNT_ID','').strip()
          if not token:
              raise SystemExit('CLOUDFLARE_API_TOKEN missing')
          hdr={'Authorization':'Bearer '+token,'Accept':'application/json'}
          def get(url):
              req=urllib.request.Request(url,headers=hdr)
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      return r.status,json.loads(r.read().decode('utf-8'))
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace')
                  try: body=json.loads(raw)
                  except Exception: body={'raw':raw[:1000]}
                  return e.code,body
          accounts=[]
          diagnostics=[]
          code,body=get('https://api.cloudflare.com/client/v4/accounts?per_page=50&page=1')
          if code==200 and body.get('success'):
              accounts=[x.get('id') for x in (body.get('result') or []) if x.get('id')]
          else:
              diagnostics.append({'stage':'accounts','http':code,'errors':body.get('errors')})
          if fallback and fallback not in accounts:
              accounts.append(fallback)
          found=None
          for aid in accounts:
              url='https://api.cloudflare.com/client/v4/accounts/'+urllib.parse.quote(aid,safe='')+'/r2/buckets?per_page=1000&name_contains=flr-bug-reports'
              code,b=get(url)
              if code!=200 or not b.get('success'):
                  diagnostics.append({'stage':'buckets','http':code,'errors':b.get('errors')})
                  continue
              buckets=(b.get('result') or {}).get('buckets') or []
              if any(x.get('name')=='flr-bug-reports' for x in buckets):
                  found=aid; break
          out={'schemaVersion':'FLR_TT051_RECOVERY_INDEX_1.0','generatedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'status':'NOT_FOUND','count':0,'reports':[],'diagnostics':diagnostics[:20]}
          if found:
              rows=[]; cursor=None
              while True:
                  q={'prefix':'reports/TT-0.51/','per_page':'1000'}
                  if cursor: q['cursor']=cursor
                  url='https://api.cloudflare.com/client/v4/accounts/'+urllib.parse.quote(found,safe='')+'/r2/buckets/flr-bug-reports/objects?'+urllib.parse.urlencode(q)
                  code,b=get(url)
                  if code!=200 or not b.get('success'):
                      out['status']='LIST_FAILED'; out['diagnostics'].append({'stage':'objects','http':code,'errors':b.get('errors')}); break
                  for r in b.get('result') or []:
                      key=r.get('key','')
                      if not key.startswith('reports/TT-0.51/') or not key.endswith('.json'): continue
                      rid=key.rsplit('/',1)[-1][:-5]
                      rows.append({'reportId':rid,'size':r.get('size'),'uploaded':r.get('uploaded') or r.get('last_modified')})
                  info=b.get('result_info') or {}
                  cursor=info.get('cursor')
                  if not cursor: break
              if out['status']!='LIST_FAILED':
                  rows.sort(key=lambda x:x.get('uploaded') or '')
                  out.update(status='RECOVERED',count=len(rows),reports=rows,diagnostics=[])
          pathlib.Path('.flr').mkdir(exist_ok=True)
          pathlib.Path('.flr/recovered-tt051-report-index.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'status':out['status'],'count':out['count'],'diagnosticCount':len(out['diagnostics'])}))
          PY

      - name: Commit sanitized recovery index
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FLR Recovery Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .flr/recovered-tt051-report-index.json
          git diff --cached --quiet || {
            git commit -m 'Record TT-0.51 recovered report index'
            git push origin HEAD:audit/tt051-known-reports
          }
