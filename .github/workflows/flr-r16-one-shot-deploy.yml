name: FLR R16 one-shot atomic deploy

on:
  push:
    branches: [main]
    paths:
      - '.flr/r16-deploy-trigger.json'

permissions:
  contents: write

concurrency:
  group: flr-r16-one-shot-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify exact R15 production base
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, pathlib
          expected={
            'CHANGELOG.md':'f166a3f128e7685cbe14c3de4d0b58db1768fe906f99a89b4591f5c72e9b42cb',
            'in_pitch_choice_ui.js':'a2bfa1552563ca776c07c0348dea63d940caae1dbb9fdad7617726f97b343c24',
            'index.html':'0a104c9f78782cda12d6c9a985917e39d19c671839f70c0428b58a73907377e3',
            'live_hybrid_session_v02.js':'56e1bdf3cdfe1d193f5b4a58864f2638d9b40294323fceaf5b9bece18f2f78bb',
            'live_v06_scene_authority_browser.js':'0b312d456b7d92a742d59ac4d9245ea511eb2bb404fe966743133edc050ae862',
            'runtime/continuous_match_core.js':'b0bcc35d40ce4417959ad8dbdd0b75118358f07d423ecc19111063ada2c0683d',
            'runtime/protagonist_match_controller.js':'49ee935d7983c5f4888a3648e9943577f6415b90bafd811c4a020a31485752a5',
            'runtime/tactical_movement.js':'f3ac5ec59101e0a57648be6299ac73dfd8178159cc1b74a5c18bf5e2586dd57a',
            'runtime/technical_test.css':'91878c1277eccf67101a0a3f2f0cef0fcf49f6080b3340167eaa7d3de12d8ff6',
            'step71_hybrid_v06_ui.js':'302dd9900f4fe47ecc712a215527d2939ddc41234d0be0c80d5ea9c627f0f730',
          }
          for p,want in expected.items():
              got=hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
              if got!=want: raise SystemExit(f'BASE_HASH_MISMATCH {p} expected={want} got={got}')
              print('BASE_OK',p)
          PY

      - name: Reassemble exact R16 patch
        shell: bash
        run: |
          set -euo pipefail
          echo 'ae7ab38bf841d8caf582c5fddfe6c2dbc925de25c0969dbc8a397c141e63a28a  .flr/r16-final.part00' | sha256sum -c -
          echo '59be4654447b5b46c0d21a6c9f73d97a6a29e187562a5b94ef7c1d2baa789693  .flr/r16-final.part01' | sha256sum -c -
          echo 'ee3b6858caccfd2bcb20ee23a22c69dc418eb9e5a58921657dec195d5f1fb8ae  .flr/r16-final.part02' | sha256sum -c -
          echo 'd37bd89744614bf593525ce067fb880ac7862031db6af5c2c6783681e7c25b0d  .flr/r16-final.part03' | sha256sum -c -
          echo 'de356c746de6077a8a7fe2233591b4ce85be2a4d33c907b57339e6143f35bc80  .flr/r16-final.part04' | sha256sum -c -
          echo '26e7bc7c19905055b3abb1e544353331b523c4bdd784aa0ff22d58ef8dba9036  .flr/r16-final.part05' | sha256sum -c -
          echo '63846dde75e833ecf488ed7369eac3f4fb297461c7f1ff12b71960a3d2a1d21d  .flr/r16-final.part06' | sha256sum -c -
          echo 'fc1fe02db84aeb247531dd0636883d56008c835c13a1ad43dba9b5d0d4ac4e5c  .flr/r16-final.part07' | sha256sum -c -
          echo '4fc1abf78a434ffd4b7fd7d90e08c87413b8cffa905c6cfb3823dab814f0a813  .flr/r16-final.part08' | sha256sum -c -
          echo 'cddf924f92d6f3997b56d78580111fafa613fa452ba9e051956244fdc289aef3  .flr/r16-final.part09' | sha256sum -c -
          cat .flr/r16-final.part{00,01,02,03,04,05,06,07,08,09} > /tmp/r16.b64
          echo '414601545a42d1230515f19505d05cab75e85467684e210fbd79e2097132a7cb  /tmp/r16.b64' | sha256sum -c -
          base64 -d /tmp/r16.b64 > /tmp/r16.patch.gz
          echo '811a2b534aead9c2a6e440fdc97bb751b3758b2b6d3e71f1efd7ca8eebdde9ac  /tmp/r16.patch.gz' | sha256sum -c -
          gzip -dc /tmp/r16.patch.gz > /tmp/r16.patch
          echo 'bfcedff031fca8106c77fd9d066654439d50cb763a0446bc03b33b1a0fe0db86  /tmp/r16.patch' | sha256sum -c -
          git apply --check /tmp/r16.patch
          git apply /tmp/r16.patch

      - name: Verify exact R16 sealed production
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, pathlib
          expected={
            'CHANGELOG.md':'a115ba0f676191138eb68727affbaf4e63a067bf7893df2f1b557f8d31894aad',
            'in_pitch_choice_ui.js':'e92d9543927fe4cfee26585d881a1a887d9f29be0484ad250afe25faedb005a3',
            'index.html':'97cc55ba5fa6214ef6a4c74029f78c531e41d674bace5a1cdc9ef64c8b6540c3',
            'live_hybrid_session_v02.js':'56e1bdf3cdfe1d193f5b4a58864f2638d9b40294323fceaf5b9bece18f2f78bb',
            'live_v06_scene_authority_browser.js':'3db02bbdf93509ae789969a1c4962e15ca661e643fee77e1fe074f400f404cc8',
            'runtime/continuous_match_core.js':'50e8d402ababe1037169012e780514feb22e908f02c2765eb4886e1cb0466d0c',
            'runtime/protagonist_match_controller.js':'59723cd3380498ba6048168a89627cf96949e3efbfb2f3dee32a3ddc98b08dea',
            'runtime/tactical_movement.js':'844bd27774e0c09398593affe4a5cabd05dbe75b6b7e7fbb1e607224c232f053',
            'runtime/technical_test.css':'144050c18636cde3400d3c5f96e03807dbd26bcacfa70adc7e7bf0b3178c3446',
            'step71_hybrid_v06_ui.js':'b125990c256cf67a4bfd118f7bd86c2ddc15759f75746dd315fe4c938c03ec13',
          }
          for p,want in expected.items():
              got=hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
              if got!=want: raise SystemExit(f'FINAL_HASH_MISMATCH {p} expected={want} got={got}')
              print('FINAL_OK',p)
          PY
          grep -q 'V0.5.4 R16' index.html
          grep -q 'USER-MATCH-TEST-V0.5.4-R16' step71_hybrid_v06_ui.js

      - name: Syntax gate
        shell: bash
        run: |
          set -euo pipefail
          node --check in_pitch_choice_ui.js
          node --check live_hybrid_session_v02.js
          node --check live_v06_scene_authority_browser.js
          node --check step71_hybrid_v06_ui.js
          node --check runtime/continuous_match_core.js
          node --check runtime/protagonist_match_controller.js
          node --check runtime/tactical_movement.js

      - name: Commit exact R16 and remove deploy helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FLR R16 Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f .flr/r16-final.part00 .flr/r16-final.part01 .flr/r16-final.part02 .flr/r16-final.part03 .flr/r16-final.part04 .flr/r16-final.part05 .flr/r16-final.part06 .flr/r16-final.part07 .flr/r16-final.part08 .flr/r16-final.part09
          git rm -f .flr/r16-deploy-trigger.json
          git rm -f .github/workflows/flr-r16-one-shot-deploy.yml
          git add CHANGELOG.md in_pitch_choice_ui.js index.html live_hybrid_session_v02.js live_v06_scene_authority_browser.js runtime/continuous_match_core.js runtime/protagonist_match_controller.js runtime/tactical_movement.js runtime/technical_test.css step71_hybrid_v06_ui.js
          git diff --cached --quiet && { echo NO_STAGED_CHANGES; exit 1; }
          git commit -m 'Deploy USER-MATCH-TEST V0.5.4 R16 feedback hotfix'
          git push origin HEAD:main
