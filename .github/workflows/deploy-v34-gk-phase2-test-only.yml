name: Deploy V34 GK Phase2 TEST_ONLY

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-v34-gk-phase2-test-only.yml'
      - '.flr/deploy/v34_gk_phase2_runtime.patch'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect current runtime
        shell: bash
        run: |
          set -euo pipefail
          echo "Current FLR_TEST runtime SHA-256: $(sha256sum runtime/continuous_match_core.js | awk '{print $1}')"
      - name: Export current runtime for exact patch construction
        uses: actions/upload-artifact@v4
        with:
          name: flr-test-runtime-before-v34-gk-phase2
          path: runtime/continuous_match_core.js
          if-no-files-found: error
      - name: Apply exact Phase2 patch when present
        shell: bash
        run: |
          set -euo pipefail
          PATCH=.flr/deploy/v34_gk_phase2_runtime.patch
          if [ ! -f "$PATCH" ]; then
            echo "Patch not present yet; export/inspection run only."
            exit 0
          fi
          git apply --check "$PATCH"
          git apply "$PATCH"
          ACTUAL="$(sha256sum runtime/continuous_match_core.js | awk '{print $1}')"
          EXPECTED="ba4c37c8d4739e3d3a97398ac9e07189a4f7a1971df1fc972dff9a46766b3178"
          echo "Runtime SHA-256 after patch: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          node --check runtime/continuous_match_core.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/continuous_match_core.js
          git commit -m "Deploy V34 GK Phase2 test build (TEST_ONLY)"
          git push origin HEAD:main
