name: Deploy V34 GK Phase2 TEST_ONLY

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-v34-gk-phase2-test-only.yml'
      - '.flr/deploy/v34_gk_phase2_runtime.patch'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bounded GK Phase2 patch to existing test build
        shell: bash
        run: |
          set -euo pipefail
          BASE_EXPECTED="090819aec5a397864bef48477b390e29d9016fcaeb9ef155a2f838d2be087cfa"
          TARGET_EXPECTED="619339464adaa3ffadbc08b0adacbd709726a265f00c708ae2058f759b4b2335"
          CURRENT="$(sha256sum runtime/continuous_match_core.js | awk '{print $1}')"
          echo "Current FLR_TEST runtime SHA-256: $CURRENT"
          PATCH=.flr/deploy/v34_gk_phase2_runtime.patch
          if [ ! -f "$PATCH" ]; then
            echo "Patch not present yet; preparation run only."
            exit 0
          fi
          test "$CURRENT" = "$BASE_EXPECTED"
          git apply --check "$PATCH"
          git apply "$PATCH"
          ACTUAL="$(sha256sum runtime/continuous_match_core.js | awk '{print $1}')"
          echo "Runtime SHA-256 after GK Phase2 patch: $ACTUAL"
          test "$ACTUAL" = "$TARGET_EXPECTED"
          node --check runtime/continuous_match_core.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/continuous_match_core.js
          git commit -m "Deploy V34 GK Phase2 test build (TEST_ONLY)"
          git push origin HEAD:main
