name: FLR R23 Entry Facing Continuity
on:
  push:
    branches: [r23-r22-report-fixes]
    paths:
      - '.github/workflows/flr-r23-facing-continuity.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r23-r22-report-fixes
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply entry-facing continuity
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('live_v06_scene_authority_browser.js');s=p.read_text(encoding='utf-8')
          old="p.x=e.x;p.y=e.y;p.vx=e.vx;p.vy=e.vy;p.tx=e.tx;p.ty=e.ty;p.hasBall=false;p.action=e.action;p.tacticalTask=e.tacticalTask||'HYBRID_ENTRY_LIVE';p.nextThink=m.time+.12+(Math.abs((p.id.charCodeAt(0)||1)*17+(p.slot?.length||1)*13)%24)/100;p.lockTargetUntil=0;p.markTargetId=e.markTargetId||null;p.hybridEntryAt=m.time;"
          new="p.x=e.x;p.y=e.y;p.vx=e.vx;p.vy=e.vy;p.tx=e.tx;p.ty=e.ty;p.hasBall=false;p.action=e.action;p.tacticalTask=e.tacticalTask||'HYBRID_ENTRY_LIVE';const entrySpeed=Math.hypot(p.vx,p.vy);if(entrySpeed>.35)p.bodyAngle=Math.atan2(p.vy,p.vx);p.faceTargetAngle=null;p.nextThink=m.time+.12+(Math.abs((p.id.charCodeAt(0)||1)*17+(p.slot?.length||1)*13)%24)/100;p.lockTargetUntil=0;p.markTargetId=e.markTargetId||null;p.hybridEntryAt=m.time;"
          if s.count(old)!=1: raise SystemExit(f'expected entry loop once, found {s.count(old)}')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          node --check live_v06_scene_authority_browser.js
          grep -q 'entrySpeed=Math.hypot' live_v06_scene_authority_browser.js
      - name: Commit source only
        run: |
          rm -f .github/workflows/flr-r23-facing-continuity.yml
          git config user.name 'FLR R23 Candidate Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'candidate: preserve Hybrid entry facing direction'
          git push origin HEAD:r23-r22-report-fixes
