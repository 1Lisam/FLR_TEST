name: FLR R23 QA Introspect
on:
  push:
    branches: [r23-r22-report-fixes]
    paths:
      - '.github/workflows/flr-r23-qa-introspect.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r23-r22-report-fixes
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Inspect exported QA APIs
        run: |
          node - <<'NODE'
          const H=require('./live_hybrid_session_v02.js');
          for(const k of ['createDeveloperScenario','createSession','advanceUntilBoundary','snapshot']){
            const fn=H[k];console.log('\n###',k,'arity=',fn?.length);console.log(String(fn).slice(0,5000));
          }
          const scenarios=['FORMATION_CONTINUITY','DEFENSIVE_ROLE_STABILITY','MARK_TARGET_STABILITY','CARRY_CONTINUITY','ST_SHOT_VISIBILITY'];
          for(const key of scenarios){
            try{
              const x=H.createDeveloperScenario(key,'R23-INTROSPECT-'+key);
              console.log('CALL',key,'OK type',typeof x,'keys',x&&Object.keys(x));
              console.log('CALL_SUMMARY',key,JSON.stringify(x&&H.snapshot?H.snapshot(x):x).slice(0,1200));
            }catch(e){console.log('CALL',key,'ERR',e&&e.stack||e);}
          }
          NODE
      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/flr-r23-qa-introspect.yml
          git config user.name 'FLR R23 QA Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove temporary R23 QA introspection workflow'
          git push origin HEAD:r23-r22-report-fixes
