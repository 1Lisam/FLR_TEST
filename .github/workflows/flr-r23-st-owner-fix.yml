name: FLR R23 Striker Transfer Fix
on:
  push:
    branches: [r23-r22-report-fixes]
    paths:
      - '.github/workflows/flr-r23-st-owner-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r23-r22-report-fixes
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fix progressive receiver spatial continuity and scene gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          def rep(path,old,new,count=1):
            p=Path(path);s=p.read_text(encoding='utf-8');n=s.count(old)
            if n!=count: raise SystemExit(f'{path} expected {count}, found {n}: {old[:100]}')
            p.write_text(s.replace(old,new),encoding='utf-8')

          rep('runtime/hybrid_spatial_intent_v2.js',
            "    const ref=deepForward?world(p.team,pr*105,state.ball.lane==='LEFT'?18:state.ball.lane==='RIGHT'?50:34):abstractBallWorld(state),target=capAround({x:p.x,y:p.y},ref,12);\n    return{kind:'SUPPORT',target,targetId:null,score:.95};",
            "    let ref=deepForward?world(p.team,pr*105,state.ball.lane==='LEFT'?18:state.ball.lane==='RIGHT'?50:34):abstractBallWorld(state);const latestKind=state.chain?.at(-1)?.kind,progressiveTransfer=['PROGRESS','DANGEROUS_PASS','BOX_ENTRY'].includes(latestKind);if(progressiveTransfer){const cur=local(p.team,p.x,p.y),rl=local(p.team,ref.x,ref.y);if(rl.x<cur.x)ref=world(p.team,cur.x,rl.y);}\n    const target=capAround({x:p.x,y:p.y},ref,12);return{kind:'SUPPORT',target,targetId:null,score:.95};")

          rep('live_hybrid_session_v02.js',
            "if(st&&lw&&rw){const sx=lx(st),wingAvg=(lx(lw)+lx(rw))/2,wingMax=Math.max(lx(lw),lx(rw));if(sx<62&&wingAvg-sx>9){",
            "if(st&&lw&&rw){const sx=lx(st),wingAvg=(lx(lw)+lx(rw))/2,wingMax=Math.max(lx(lw),lx(rw));if(sx<68&&wingAvg-sx>9){")
          PY
          node --check runtime/hybrid_spatial_intent_v2.js
          node --check live_hybrid_session_v02.js
          grep -q 'progressiveTransfer' runtime/hybrid_spatial_intent_v2.js
          grep -q 'if(sx<68&&wingAvg-sx>9)' live_hybrid_session_v02.js
      - name: Commit source and clean temporary failed QA workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/flr-r23-st-owner-fix.yml .github/workflows/flr-r23-regression.yml
          git config user.name 'FLR R23 Candidate Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'candidate: keep progressive ST reception spatially forward'
          git push origin HEAD:r23-r22-report-fixes
