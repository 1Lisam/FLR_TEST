name: FLR R23 Final Regression
on:
  push:
    branches: [r23-r22-report-fixes]
    paths: ['.github/workflows/flr-r23-final-regression.yml']
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {ref: r23-r22-report-fixes}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Final exact-report regression
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const path=require('path'),H=require('./live_hybrid_session_v02.js'),A=require('./live_v06_scene_authority_browser.js'),C=require('./runtime/action_candidate_engine.js'),E=require('./runtime/continuous_match_core.js');
          const rd=path.join(process.cwd(),'runtime'),mk=(k,s)=>H.createDeveloperScenario({key:k,seed:s}),high=(d,suffix)=>A.seedMatch(d.boundary,{runtimeDir:rd,seed:`R23-FINAL-${suffix}`,explicitHeroChoiceRequired:true}),pl=(m,id)=>m.players.find(p=>p.id===id),loc=(team,p)=>team==='HOME'?{x:p.x,y:p.y}:{x:105-p.x,y:68-p.y};
          const result={};
          // 1) Exact natural formation/spatial report.
          {
            const d=mk('FORMATION_CONTINUITY','DEV-RECENT-1787734109353-14'),s=d.boundary.stateSnapshot,sp=s.spatial.players,st=loc('HOME',sp['H-ST']),w=[loc('HOME',sp['H-LW']).x,loc('HOME',sp['H-RW']).x],cm=['H-LCM','H-CM','H-RCM'].map(id=>loc('HOME',sp[id]).x),cmAvg=cm.reduce((a,b)=>a+b,0)/3,wingAvg=(w[0]+w[1])/2,isolated=s.phase!=='TRANSITION'&&st.x<68&&Math.abs(st.x-cmAvg)<5&&wingAvg>68;
            if(isolated)throw new Error(`QA1 isolated ST remains ${st.x}/${cmAvg}/${wingAvg}`);
            const hi=high(d,'QA1'),a=pl(hi.state.m,'A-ST'),speed=Math.hypot(a.vx,a.vy),want=Math.atan2(a.vy,a.vx);let er=(a.bodyAngle-want)%(Math.PI*2);if(er>Math.PI)er-=Math.PI*2;if(er<-Math.PI)er+=Math.PI*2;er=Math.abs(er);if(speed>.35&&er>.08)throw new Error(`QA1 facing seam ${er}`);
            result.QA1={stX:st.x,cmAvg,wingAvg,isolated,aSTFacingError:er};
          }
          // 2) Exact fullback report. Count only periods where same-side winger is still a live wide threat.
          {
            const d=mk('DEFENSIVE_ROLE_STABILITY','DEV-RECENT-1787734197888-15'),hi=high(d,'QA2'),m=hi.state.m,pairs=[['A-RB','H-LW'],['A-LB','H-RW']],z=Object.fromEntries(pairs.map(([df])=>[df,{threat:0,responsible:0,inside:0,goal:0,maxOutside:0}]));
            for(let i=0;i<100;i++){E.step(m,.05);for(const[df,at]of pairs){const D=pl(m,df),T=pl(m,at),dl=loc('AWAY',D),tl=loc('AWAY',T),q=z[df],threat=tl.x<=52&&Math.abs(tl.y-34)>=10;if(!threat)continue;q.threat++;const responsible=D.markTargetId===at||D.tacticalTask==='WIDE_RUN_TRACK';if(responsible)q.responsible++;const inside=Math.abs(tl.y-34)-Math.abs(dl.y-34);if(inside>=-.05)q.inside++;else q.maxOutside=Math.max(q.maxOutside,-inside);if(dl.x<=tl.x+.2)q.goal++;}}
            for(const q of Object.values(z)){q.responsibilityRate=q.threat?q.responsible/q.threat:1;q.insideRate=q.threat?q.inside/q.threat:1;q.goalRate=q.threat?q.goal/q.threat:1;if(q.responsibilityRate<.90)throw new Error(`QA2 lost winger responsibility ${JSON.stringify(q)}`);if(q.insideRate<.82||q.goalRate<.82)throw new Error(`QA2 relation too weak ${JSON.stringify(q)}`);}
            result.QA2=z;
          }
          // 3) Same exact CB boundary, three independent high-res seeds.
          {
            const d=mk('MARK_TARGET_STABILITY','DEV-RECENT-1787734342252-19'),runs=[];
            for(let r=0;r<3;r++){const hi=high(d,'QA3-'+r),m=hi.state.m,ids=['A-LCB','A-RCB'],z=Object.fromEntries(ids.map(id=>{const p=pl(m,id);return[id,{taskChanges:0,markChanges:0,lastTask:p.tacticalTask,lastMark:p.markTargetId||null,maxLatFromST:0}]}));for(let i=0;i<180;i++){E.step(m,.05);const st=pl(m,'H-ST');for(const id of ids){const p=pl(m,id),q=z[id];if(p.tacticalTask!==q.lastTask){q.taskChanges++;q.lastTask=p.tacticalTask}if((p.markTargetId||null)!==(q.lastMark||null)){q.markChanges++;q.lastMark=p.markTargetId||null}q.maxLatFromST=Math.max(q.maxLatFromST,Math.abs(p.y-st.y));}}for(const q of Object.values(z)){if(q.taskChanges>5||q.markChanges>3)throw new Error(`QA3 CB churn ${JSON.stringify(z)}`);if(q.maxLatFromST>7.0)throw new Error(`QA3 CB lateral wander ${JSON.stringify(z)}`);}runs.push(z);}result.QA3=runs;
          }
          // 4) Close-goal CARRY option and execution guard, both directions.
          {
            const d=mk('ST_SHOT_VISIBILITY','DEV-RECENT-1787734444350-28'),hi=high(d,'QA4'),ins=hi.P.inspect(hi.state),opts=(ins?.options||[]).map(x=>x.id||x.choice||x.key).filter(Boolean),hero=pl(hi.state.m,'H-ST'),hx=loc('HOME',hero).x,near=C.generate({role:'ST',localX:92.75,wide:false,pressure:2,space:2,held:.5,shot:{inBox:true,dGoal:12,centrality:0,openWindow:true,blockers:0,oneVOne:true},pass:{}}).map(x=>x.id),control=C.generate({role:'ST',localX:90,wide:false,pressure:2,space:4,held:.5,shot:{inBox:true,dGoal:15,centrality:2,openWindow:false,blockers:1,oneVOne:false},pass:{}}).map(x=>x.id),exec=[];
            if(hx>=91.2&&opts.includes('CARRY'))throw new Error(`QA4 exact scene CARRY at ${hx}`);if(near.includes('CARRY'))throw new Error('QA4 pure close-goal CARRY');if(!control.includes('CARRY'))throw new Error('QA4 control CARRY removed');for(const[team,id,x]of[['HOME','H-ST',92.75],['AWAY','A-ST',12.25]]){const m=E.createMatch('R23-FINAL-CARRY-'+team),B=E.choiceActionBridge(),p=B.playerById(m,id);p.x=x;p.y=34;p.tx=x;p.ty=34;p.vx=p.vy=0;B.setControlled(m,p,true);const before=loc(team,p).x;B.executeCarry(m,p,{userCommitted:true});const after=loc(team,{x:p.tx,y:p.ty}).x;if(after<before-1e-6)throw new Error(`QA4 ${team} backward ${before}->${after}`);exec.push({team,before,after});}result.QA4={hx,opts,near,control,exec};
          }
          // 5) Existing carry continuity preservation.
          {
            const d=mk('CARRY_CONTINUITY','DEV-RECENT-1787734397122-26'),hi=high(d,'QA5'),m=hi.state.m;let n=0,back=0,hardStops=0,prev=null;for(let i=0;i<80;i++){E.step(m,.05);const p=pl(m,m.ball.ownerId);if(!p||p.team!=='HOME')continue;n++;if(p.vx<-.15)back++;const sp=Math.hypot(p.vx,p.vy);if(prev!=null&&prev>2&&sp<.25)hardStops++;prev=sp;}if(back>Math.max(2,Math.floor(n*.08)))throw new Error(`QA5 backward ${back}/${n}`);result.QA5={n,back,hardStops};
          }
          console.log('R23_FINAL_REGRESSION',JSON.stringify(result,null,2));console.log('R23_FINAL_REGRESSION: PASS');
          NODE
      - name: Syntax check modified engine files
        run: |
          node --check live_hybrid_session_v02.js
          node --check live_v06_scene_authority_browser.js
          node --check runtime/hybrid_spatial_intent_v2.js
          node --check runtime/tactical_movement.js
          node --check runtime/action_candidate_engine.js
          node --check runtime/continuous_match_core.js
      - name: Clean workflow
        run: |
          rm -f .github/workflows/flr-r23-final-regression.yml
          git config user.name 'FLR R23 QA Bot'; git config user.email 'actions@users.noreply.github.com'; git add -A; git commit -m 'chore: remove temporary R23 final regression workflow'; git push origin HEAD:r23-r22-report-fixes
