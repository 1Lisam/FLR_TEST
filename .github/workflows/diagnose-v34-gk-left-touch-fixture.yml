name: Diagnose V34 GK left touch fixture

on:
  push:
    branches: [main]
    paths: [.github/workflows/diagnose-v34-gk-left-touch-fixture.yml]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch in memory and search bounded left-deflection fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/deploy-v34-gk-touch-deflection-v1.yml').read_text()
          marker='        run: |\n'
          body=src.split(marker,1)[1]
          lines=[]
          for line in body.splitlines():
              if line.startswith('          '): lines.append(line[10:])
              elif not line.strip(): lines.append('')
              else: raise SystemExit(f'unexpected v1 indentation: {line[:40]}')
          script='\n'.join(lines)+'\n'
          a=script.index('# Issue #56 auxiliary live-contact protections.')
          b=script.index('# UI: replace one old touch-goal fixture',a)
          public_adapt='''# Public sweep runtime adaptation.\nold="  const prev={x:m.ball.x,y:m.ball.y};m.ball.age=(m.ball.age||0)+dt;"\nnew="  const prev={x:m.ball.x,y:m.ball.y};m.ball.contactPrevAge=m.ball.age||0;m.ball.contactDt=dt;m.ball.age=(m.ball.age||0)+dt;"\nif old in s: s=s.replace(old,new,1)\nelif new not in s: raise SystemExit('contact dt anchor missing')\np.write_text(s)\n\n'''
          script=script[:a]+public_adapt+script[b:]
          cut=script.index('# Deterministic public regression + issue #56 causal fixtures.')
          Path('/tmp/apply_issue56_public_prefix.sh').write_text(script[:cut])
          PY
          bash /tmp/apply_issue56_public_prefix.sh
          node - <<'NODE'
          const E=require('./runtime/continuous_match_core.js'),B=E.choiceActionBridge();
          function setup(c){
            const m=E.createMatch(c.seed,{dt:.05});m.time=100;m.restart=null;m.phase='OPEN_PLAY';m.nextShape=999;m.events=[];m.score={HOME:0,AWAY:0};m.possession='HOME';m.playerAbilityProfiles={};
            const st=m.playersById['H-ST'],gk=m.playersById['A-GK'];
            for(const p of m.players){p.hasBall=false;p.nextThink=9999;p.vx=p.vy=0;if(p.role!=='GK'){p.x=70;p.y=7;p.tx=70;p.ty=7;}}
            Object.assign(st,{x:83,y:34,tx:83,ty:34,bodyAngle:0,faceTargetAngle:0,nextThink:9999});
            Object.assign(gk,{x:100.5,y:c.gkY,tx:100.5,ty:c.gkY,vx:0,vy:0,action:'GK_SAVE_SET',tacticalTask:'GK_SAVE_SET',nextThink:9999});
            m.playerAbilityProfiles[gk.id]={reaction:40,gk_positioning:40,diving:40,handling:40};
            B.setControlled(m,st);m.ball.x=83;B.executeShot(m,st,'TOUCH_DEFLECT_FORCED',{releaseNow:true});
            Object.assign(m.ball,{x:83,y:34+c.offset,z:.08,vx:c.speed,vy:0,vz:0,age:0,originX:83,originY:34,targetX:105,targetY:34+c.offset,shotTargetY:34+c.offset,shotTeam:'HOME',lastTouchTeam:'HOME',lastTouchPlayer:'H-ST',onTarget:true,shotDistance:c.distance,shotOneVOne:false,shotClearKeeperChance:false,airborne:false,strikeStyle:'POWER',arcProfile:null,npcGkResolved:null});m.lastTouchTeam='HOME';m.lastTouchPlayer='H-ST';
            return m;
          }
          function run(c){
            const m=setup(c);let touch=null,terminal=null,otherOutcome=null;
            for(let i=0;i<220;i++){
              E.step(m,.05);
              if(!touch){const e=[...m.events].reverse().find(e=>e?.type==='TOUCH_DEFLECT');if(e)touch={t:e.t,vy:e.ballVelocityAfter?.y,contactOffset:e.contactOffset,lateralImpulse:e.lateralImpulse,ballY:e.sharedContactStage?.current?.y,gkY:e.sharedContactStage?.gkAfter?.y};}
              if(!otherOutcome){const e=[...m.events].reverse().find(e=>e?.npcGkOutcome);if(e)otherOutcome=e.npcGkOutcome;}
              if(touch&&!terminal){const e=[...m.events].reverse().find(e=>e?.t>touch.t&&(e.type==='GOAL'||e.type==='CORNER'||e.type==='GOAL_KICK'));if(e)terminal={t:e.t,type:e.type,restart:m.restart?.kind||null};}
              if(terminal)break;
            }
            return{touch,terminal,otherOutcome,score:m.score};
          }
          const seeds=['TOUCH-GOAL-013','TOUCH-GOAL-086','TOUCH-LEFT-001','TOUCH-LEFT-002','TOUCH-LEFT-003','TOUCH-LEFT-004','TOUCH-LEFT-005','TOUCH-LEFT-006','TOUCH-LEFT-007','TOUCH-LEFT-008'];
          const offsets=[-.55,-.45,-.65,-.35,-.75,-.85,-1.0];
          const gkYs=[34,33.9,34.1,33.8,34.2,33.7,34.3];
          const speeds=[24,23];
          const distances=[18,19];
          let found=[];
          outer: for(const seed of seeds)for(const offset of offsets)for(const gkY of gkYs)for(const speed of speeds)for(const distance of distances){
            const c={seed,offset,gkY,speed,distance},r=run(c);
            if(r.touch&&r.touch.vy<-.15&&r.terminal?.type==='GOAL'&&r.score.HOME===1){found.push({c,r});if(found.length>=8)break outer;}
          }
          console.log(JSON.stringify({found},null,2));
          if(!found.length)process.exit(1);
          NODE
