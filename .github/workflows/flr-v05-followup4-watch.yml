name: FLR V0.5 Four Report Watch

on:
  workflow_run:
    workflows: ['FLR V0.5 Four Report Candidate']
    types: [completed]

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - name: Record conclusion
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HTML_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          python - <<'PY'
          import json,os,pathlib
          pathlib.Path('.flr/v05-followup4-workflow-status.json').write_text(json.dumps({'runId':int(os.environ['RUN_ID']),'conclusion':os.environ['CONCLUSION'],'headSha':os.environ['HEAD_SHA'],'htmlUrl':os.environ['HTML_URL']},indent=2)+'\n')
          PY
          git config user.name 'FLR V0.5 Follow-up Watch'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase origin main
          git add .flr/v05-followup4-workflow-status.json
          git commit -m 'Record four-report V0.5 candidate result' || exit 0
          git push origin HEAD:main
