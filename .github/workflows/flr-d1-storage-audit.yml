name: FLR D1 Storage Audit
on:
  push:
    branches: [audit-r24-direct-macos]
    paths: ['.github/workflows/flr-d1-storage-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: macos-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Query D1 aggregate storage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest d1 list --json > /tmp/list.json
          dbid="$(python3 -c "import json; j=json.load(open('/tmp/list.json')); print(next(((r.get('uuid') or r.get('id') or '') for r in j if r.get('name')=='flr-bug-reports'),''))")"
          test -n "$dbid"
          python3 - <<'PY' >/tmp/body.json
          import json
          sql="""SELECT COUNT(*) AS report_count, COALESCE(SUM(size_bytes),0) AS raw_json_bytes, COALESCE(SUM(chunk_count),0) AS chunk_count, MIN(created_at) AS oldest, MAX(created_at) AS newest FROM bug_reports; SELECT COUNT(*) AS chunk_rows, COALESCE(SUM(LENGTH(data)),0) AS stored_text_chars FROM bug_report_chunks; SELECT build, COUNT(*) AS report_count, COALESCE(SUM(size_bytes),0) AS raw_json_bytes, COALESCE(SUM(chunk_count),0) AS chunk_count FROM bug_reports GROUP BY build ORDER BY MAX(created_at) DESC;"""
          print(json.dumps({'sql':sql}))
          PY
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${dbid}/query" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' --data-binary @/tmp/body.json > storage.json
          python3 - <<'PY'
          import json
          j=json.load(open('storage.json'))
          assert j.get('success') is True
          print(json.dumps(j,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: d1-storage-audit-${{ github.run_id }}
          path: storage.json
          retention-days: 7
