name: FLR V31 R24 Source Export

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/flr-v31-r24-source-export.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: macos-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 62d0dce3023c5e62674bd681367b1a061441bfcb
          fetch-depth: 0
      - name: Prepare exact R24 production source
        run: |
          set -euo pipefail
          mkdir -p /tmp/r24-source
          rsync -a --exclude='.git' ./ /tmp/r24-source/
          printf '%s\n' '62d0dce3023c5e62674bd681367b1a061441bfcb' > /tmp/r24-source/R24_PRODUCTION_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: v31-r24-source-${{ github.run_id }}
          path: /tmp/r24-source
          include-hidden-files: true
          if-no-files-found: error
