name: Deploy V34 GK realistic danger debug

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-v34-gk-danger-realistic-target.yml'

permissions:
  contents: write

jobs:
  deploy-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply realistic TEST_ONLY GK #6 case
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('step71_hybrid_v06_ui.js')
          s=p.read_text()
          old="GK_PHASE2_PLAUSIBILITY_DANGER:{seed:'PH2-DANGER-05',label:'GK Phase2 · 위험한 세컨드볼',expected:'PARRY_DANGER',distance:19,speed:25,offset:11,gk:74,handling:40,visualStartX:83,gkX:100.5,gkY:34,replayRate:.75,instruction:'어려운 슛을 쳐낸 뒤 공이 실제 전방·중앙 세컨드볼로 계속 움직이는지 확인합니다.'}"
          new="GK_PHASE2_PLAUSIBILITY_DANGER:{seed:'PH2-DANGER-05',label:'GK Phase2 · 위험한 세컨드볼',expected:'PARRY_DANGER',distance:18,speed:26,offset:2.5,gk:60,handling:35,visualStartX:83,gkX:100.5,gkY:34,replayRate:.75,instruction:'어려운 슛을 쳐낸 뒤 공이 실제 전방·중앙 세컨드볼로 계속 움직이는지 확인합니다.'}"
          n=s.count(old)
          if n!=1:
              raise SystemExit(f'Expected exactly one old #6 case, found {n}')
          p.write_text(s.replace(old,new,1))
          PY
          node --check step71_hybrid_v06_ui.js
          grep -q "distance:18,speed:26,offset:2.5,gk:60,handling:35" step71_hybrid_v06_ui.js
          grep -q "replayRate:.75" step71_hybrid_v06_ui.js
          git diff --check
          test "$(git diff --name-only)" = "step71_hybrid_v06_ui.js"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add step71_hybrid_v06_ui.js
          git commit -m "Use realistic on-target GK danger-parry debug case (TEST_ONLY)"
          git push origin HEAD:main
