name: Deploy V34 GK shared parry contact stage

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-v34-gk-danger-closer-contact.yml

permissions:
  contents: write

jobs:
  deploy-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed issue 45 shared parry contact stage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p=Path('runtime/continuous_match_core.js')
          s=p.read_text()
          phase2_anchor='// V34 GK Phase2 TEST_ONLY: plausibility-first NPC handling for ordinary non-chip shots.'
          if s.count(phase2_anchor)!=1: raise SystemExit(f'Expected one Phase2 anchor, found {s.count(phase2_anchor)}')
          if 'function goalkeeperParryContactStage(' in s: raise SystemExit('Shared parry contact stage already present')
          helpers=base64.b64decode('').decode()
          s=s.replace(phase2_anchor,helpers+phase2_anchor,1)
          start_marker="  const dangerRoll=dangerEligible?(hash32(`${key}|PARRY_DANGER`)%1000000)/1000000:1;"
          end_marker="  return{outcome:'PARRY_SAFE',routine:false,localVx:lvx,localVy:lvy};"
          start=s.find(start_marker); end=s.find(end_marker,start)
          if start<0 or end<0: raise SystemExit('Could not find pre-45 parry block markers')
          end+=len(end_marker)
          replacement=base64.b64decode('').decode()
          s=s[:start]+replacement+s[end:]
          p.write_text(s)
          PY
          node --check runtime/continuous_match_core.js
          test "$(grep -c "function goalkeeperParryContactStage" runtime/continuous_match_core.js)" = "1"
          test "$(grep -c "const contactStage=goalkeeperParryContactStage" runtime/continuous_match_core.js)" = "1"
          test "$(grep -c "nearContactDistance" runtime/continuous_match_core.js || true)" = "0"
          test "$(grep -c "reachBefore" runtime/continuous_match_core.js || true)" = "0"
          grep -q "PARRY_SAFE.*sharedContactStage" runtime/continuous_match_core.js
          grep -q "PARRY_DANGER.*sharedContactStage" runtime/continuous_match_core.js
          grep -q "const lateral=Math.max(5.2,speed\*.56),outward=-Math.max(2.8,speed\*.18)" runtime/continuous_match_core.js
          grep -q "const forward=clamp(speed\*.22,3.8,6.0),central=clamp(speed\*.08,1.2,2.1)" runtime/continuous_match_core.js
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "runtime/continuous_match_core.js" || { echo "Unexpected changed files: $changed"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/continuous_match_core.js
          git commit -m "Unify GK safe-danger parry contact stage (TEST_ONLY)"
          git push origin HEAD:main
