name: Deploy V34 GK danger forward rebound semantics

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-v34-gk-danger-closer-contact.yml

permissions:
  contents: write

jobs:
  deploy-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed issue 44 forward rebound semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('runtime/continuous_match_core.js')
          s = p.read_text()

          old_vector = """    const forward=Math.max(3.8,speed*.22),central=Math.min(forward*.48,Math.max(1.2,speed*.10)),wx=gk.team===HOME?forward:-forward,wy=gk.team===HOME?side*central:-side*central;"""
          new_vector = """    // Local GK coordinates put the defended goal line at x=0 for both teams
    // (HOME: world +x; AWAY: world -x). Danger is therefore a short spill in
    // local +x, back into the field, with only a modest live-context side term.
    const forward=clamp(speed*.22,3.8,6.0),central=clamp(speed*.08,1.2,2.1),wx=gk.team===HOME?forward:-forward,wy=gk.team===HOME?side*central:-side*central;"""
          if s.count(old_vector) != 1:
              raise SystemExit(f'Expected one pre-44 danger vector, found {s.count(old_vector)}')
          s = s.replace(old_vector, new_vector, 1)

          old_text = "`${subjectName(gk.name)} 슈팅을 중앙 쪽으로 불안하게 쳐냈습니다.`"
          new_text = "`${subjectName(gk.name)} 슈팅을 중앙 앞 위험지대로 쳐냈습니다.`"
          if s.count(old_text) != 1:
              raise SystemExit(f'Expected one pre-44 danger event wording, found {s.count(old_text)}')
          s = s.replace(old_text, new_text, 1)
          p.write_text(s)
          PY

          node --check runtime/continuous_match_core.js
          grep -q "const forward=clamp(speed\*.22,3.8,6.0),central=clamp(speed\*.08,1.2,2.1)" runtime/continuous_match_core.js
          grep -q "중앙 앞 위험지대로 쳐냈습니다" runtime/continuous_match_core.js
          grep -q "gk.action='GK_SAVE_REACH'" runtime/continuous_match_core.js
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "runtime/continuous_match_core.js" || { echo "Unexpected changed files: $changed"; exit 1; }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/continuous_match_core.js
          git commit -m "Make GK danger parry rebound forward (TEST_ONLY)"
          git push origin HEAD:main
