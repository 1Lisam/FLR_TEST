<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FLR V43 사용자 Viewer 검증</title><link rel="stylesheet" href="user_viewer.css"></head>
<body><main><h1>V43 장면 사용자 검증 <small>TEST_ONLY</small></h1><p class="muted">각 장면을 먼저 직접 보고 정상/애매/축구 같지 않음을 선택하세요. 판정 전에는 내부 검증 정보가 표시되지 않습니다.</p><div id="caseList" class="case-list"></div><section id="viewerPanel" hidden><h2 id="caseTitle"></h2><iframe id="originalViewer" title="FLR original 2D Viewer" src="/FLR_TEST/index.html?flr_v43_user_viewer=1"></iframe><div class="controls"><button id="toggle" type="button">재생</button><button data-rate="1" type="button">1×</button><button data-rate="2" type="button">2×</button><input id="scrub" type="range" min="0" value="0" step="1"></div><div class="judgments"><button data-judge="정상" type="button">정상</button><button data-judge="애매" type="button">애매</button><button data-judge="축구 같지 않음" type="button">축구 같지 않음</button></div><label>선택 사항 메모<textarea id="note" placeholder="이 장면에 대한 메모"></textarea></label><p id="caseResult" aria-live="polite"></p></section><section id="aggregate" hidden><h2>저장된 전체 결과</h2><textarea id="summary" readonly></textarea><button id="copy" type="button">전체 결과 복사</button></section></main>
<script>
const $=id=>document.getElementById(id),frame=$('originalViewer');let data,current,index=0,playheadTime=0,rate=1,playing=false,last=0,raf=0,adapter=null;const BALANCED_NAMESPACE='v43-balanced-crosscheck-v1',judgments=JSON.parse(localStorage.getItem(`${BALANCED_NAMESPACE}-judgments`)||'{}'),notes=JSON.parse(localStorage.getItem(`${BALANCED_NAMESPACE}-notes`)||'{}'),casesFor=data=>data?.userCrossCheckCases||data?.cases||[],sourceTime=f=>Number(f?.time),MAX_SOURCE_PLAYER_SPEED=13;
const post=(type,payload)=>frame.contentWindow.postMessage({source:'FLR_V43_USER_VIEWER',type,...payload},'*');
function validateCaseSource(c){const fs=c?.frames||[];if(fs.length<2||fs.some(f=>f.players?.length!==22))throw Error('SOURCE_FRAME_COUNT_OR_ROSTER_INVALID');for(let i=1;i<fs.length;i++){const dt=sourceTime(fs[i])-sourceTime(fs[i-1]);if(!(dt>0))throw Error('SOURCE_TIMESTAMPS_NOT_STRICTLY_INCREASING');for(const p of fs[i].players){const q=fs[i-1].players.find(x=>x.id===p.id);if(!q)throw Error('SOURCE_PLAYER_ID_DISCONTINUITY');if(Math.hypot(p.x-q.x,p.y-q.y)/dt>MAX_SOURCE_PLAYER_SPEED)throw Error('SOURCE_PLAYER_SPEED_IMPLAUSIBLE');}}return true;}
function sourceIndexAt(t){let i=0;while(i<current.frames.length-1&&sourceTime(current.frames[i+1])<=t)i++;return i;}
function renderAt(t=playheadTime){if(!current||!adapter)return;index=sourceIndexAt(t);const a=current.frames[index],b=current.frames[Math.min(index+1,current.frames.length-1)],dt=sourceTime(b)-sourceTime(a),mix=index===current.frames.length-1?0:Math.max(0,Math.min(1,(t-sourceTime(a))/dt));adapter.render(index===current.frames.length-1?a:adapter.interpolate(a,b,mix));$('scrub').value=index;}
function stop(){playing=false;cancelAnimationFrame(raf);raf=0;$('toggle').textContent='재생'}
function tick(now){if(!playing)return;const elapsed=Math.min(.25,(now-last)/1000);last=now;const end=sourceTime(current.frames.at(-1));playheadTime=Math.min(end,playheadTime+elapsed*rate);renderAt(playheadTime);if(playheadTime>=end){stop();return}raf=requestAnimationFrame(tick)}
function showResult(){const j=judgments[current?.id];if(!j){$('caseResult').textContent='판정 전에는 내부 검증 정보를 공개하지 않습니다.';return}const f=current.frames[j.frameIndex??index],internal=current.internal||{classification:current.internalClass,reasons:[],detectorCategories:[]};$('caseResult').textContent=`저장됨 · 사용자 판단: ${j.judgment}. 내부 정보(이 판정 후 공개): ${internal.classification} · seed ${current.seed} · ${f.time}초 · 검출 종류 ${(internal.detectorCategories||[]).join(', ')||'없음'}`;}
function refresh(){if(!data)return;const saved=casesFor(data).filter(c=>judgments[c.id]?.judgment);$('aggregate').hidden=saved.length===0;$('copy').textContent='전체 결과 복사';$('summary').value=saved.map(c=>{const j=judgments[c.id],f=c.frames[j.frameIndex??0];return `${c.label}\n장면 식별: 실제 엔진 프레임 ${f.time}초\n사용자 판단: ${j.judgment}\n메모: ${notes[c.id]??j.note??'(없음)'}`}).join('\n\n');$('caseList').querySelectorAll('[data-case]').forEach(b=>b.textContent=`${b.dataset.label}${judgments[b.dataset.case]?' · 저장됨':''}`)}
function openCase(id){stop();current=casesFor(data).find(c=>String(c.id)===String(id));if(!current)return;try{validateCaseSource(current)}catch(e){$('caseResult').textContent=`기계적 연속성 HARD gate 실패: ${e.message}`;return}index=0;playheadTime=sourceTime(current.frames[0]);$('viewerPanel').hidden=false;$('caseTitle').textContent=current.label;$('scrub').max=current.frames.length-1;$('note').value=notes[id]??judgments[id]?.note??'';if(adapter)adapter.setFocus(current.heroPlayerId);post('LOAD_CASE',{heroPlayerId:current.heroPlayerId});renderAt();showResult()}
function prepareOriginalFrame(){const d=frame.contentDocument;if(!d)return;const style=d.createElement('style');style.textContent='.developer-info,.control-panel,#finalMatchTestDock,#heroChoicePanel,#heroResultPanel,.replay-history-panel,.log-panel,.developer-panel,#heroBugModal,.pitch-footer{display:none!important}.pitch-card{margin:0!important}';d.head.appendChild(style)}
frame.addEventListener('load',()=>{prepareOriginalFrame();adapter=frame.contentWindow.FLR_V43_ORIGINAL_VIEWER_ADAPTER;if(!adapter){$('caseResult').textContent='원본 Viewer TEST_ONLY adapter를 찾지 못했습니다.';return}adapter.setOffside(false);if(current){adapter.setFocus(current.heroPlayerId);post('LOAD_CASE',{heroPlayerId:current.heroPlayerId});renderAt()}});
$('scrub').oninput=e=>{stop();index=Number(e.target.value);playheadTime=sourceTime(current.frames[index]);renderAt()};$('toggle').onclick=()=>{if(!current)return;if(playing){stop();return}if(playheadTime>=sourceTime(current.frames.at(-1))){index=0;playheadTime=sourceTime(current.frames[0]);renderAt()}playing=true;$('toggle').textContent='일시정지';last=performance.now();raf=requestAnimationFrame(tick)};document.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>rate=Number(b.dataset.rate));$('note').oninput=()=>{if(current){notes[current.id]=$('note').value;localStorage.setItem(`${BALANCED_NAMESPACE}-notes`,JSON.stringify(notes))}};document.querySelectorAll('[data-judge]').forEach(b=>b.onclick=()=>{if(!current)return;judgments[current.id]={judgment:b.dataset.judge,note:$('note').value,frameIndex:index};localStorage.setItem(`${BALANCED_NAMESPACE}-judgments`,JSON.stringify(judgments));showResult();refresh()});$('copy').onclick=async()=>{$('summary').focus();$('summary').select();try{await navigator.clipboard.writeText($('summary').value);$('copy').textContent='복사됨'}catch(e){document.execCommand('copy');$('copy').textContent='선택됨 — Ctrl/Cmd+C로 복사'}};
fetch('../V43_FORMATION_RESPONSIBILITY_FOCUSED_USER_TEST.json').then(r=>r.json()).then(x=>{data=x;const cases=casesFor(x);$('caseList').innerHTML=cases.map(c=>`<button type="button" data-case="${c.id}" data-label="${c.label}">${c.label}</button>`).join('');document.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>openCase(b.dataset.case));refresh()});
</script></body></html>
