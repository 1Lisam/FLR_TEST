<script>(()=>{const seed=document.querySelector('#seed'),speed=document.querySelector('#speed'),targets=document.querySelector('#targets'),jt=document.querySelector('#jumpTime'),meta=document.querySelector('#meta');let timer=null,paused=true;const cfg=()=>({mode:'LEGACY_EXECUTE',scenario:'NATURAL',seed:seed.value,seconds:420,fps:20,showTargets:targets.checked,fixture:{kind:'NATURAL'}});function reset(){if(timer)clearInterval(timer);window.FLR_V57_FRAME_TICK_QA.init(cfg());paused=true}function sched(){if(timer)clearInterval(timer);timer=setInterval(()=>{if(!paused)window.FLR_V57_FRAME_TICK_QA.step()},Math.max(12,50/Number(speed.value||1)))}function jump(sec){reset();const t=Math.max(0,Number(sec)||0);meta.textContent='고속 계산 중… '+t+'초';setTimeout(()=>{try{const r=window.FLR_V57_FRAME_TICK_QA.fastForwardTo(t);meta.textContent='이동 완료 · 실제 t='+r.time.toFixed(2)+' · 일시정지'}catch(e){meta.textContent='ERROR: '+e.message}},0)}document.querySelector('#start').onclick=()=>{reset();paused=false;sched()};document.querySelector('#pause').onclick=()=>paused=true;document.querySelector('#resume').onclick=()=>{paused=false;sched()};document.querySelector('#jump').onclick=()=>jump(jt.value);document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{jt.value=b.dataset.jump;jump(b.dataset.jump)});seed.onchange=reset;speed.onchange=sched;targets.onchange=reset;window.addEventListener('load',()=>{const x=setInterval(()=>{if(window.FLR_V57_FRAME_TICK_QA?.engineReady?.()){clearInterval(x);reset()}},50)})})();</script></body></html>
