<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FLR · 움직이는 동료의 수신 공간 비교</title><link rel="stylesheet" href="../../style.css"><style>[hidden]{display:none!important}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pair article{padding:6px}.pair h2{padding:10px;margin:0}canvas{width:100%}@media(max-width:700px){.pair{grid-template-columns:1fr}}</style><main><h1>움직이는 동료가 받을 공간을 보고 연결</h1><p>패스길과 주변 여유를 같은 도착 지점에서 평가합니다. 이미 확보한 실제 공 출발점 판단과 지원 이동·압박·슛 규칙은 유지합니다.</p><div class="controls"><select id="scene" aria-label="장면"><option value="0">중앙 수비수 → 움직이는 윙어</option><option value="1">중원 동료의 열린 공간으로 연결</option><option value="2">처음12초 · 기존 시험판과 현재 후보</option></select><button id="play" class="primary">비교 재생</button><button id="reset">처음으로</button><label>재생 속도<select id="speed"><option value="0.25">천천히 · ¼</option><option value="0.5">½</option><option value="1">실제 속도</option></select></label><input id="time" type="range" min="0" max="6" step="0.1" value="0"><output id="clock">0.0초</output><a href="../../">실제 경기 열기</a></div><p id="note"></p><div class="pair"><article><h2>수정 전 · <span id="oldPhase"></span></h2><canvas id="before" width="1150" height="800"></canvas><p class="small detail-label">비교 선수 주변 확대 · 양쪽은 같은 영역</p><canvas id="detail-before" width="600" height="360"></canvas></article><article><h2>수정 후 · <span id="newPhase"></span></h2><canvas id="after" width="1150" height="800"></canvas><p class="small detail-label">비교 선수 주변 확대 · 양쪽은 같은 영역</p><canvas id="detail-after" width="600" height="360"></canvas></article></div><p class="small" id="status">같은 상태의6초 비교는 약0.1초, 처음12초 비교는0.2초 간격의 실현 좌표를 보간합니다.22명을 모두 보여 주는 지난 기록 재생이며30fps 녹화가 아닙니다. 반복 패스 전체나 모든 포메이션의 완료 판정은 아닙니다.</p></main><script type="module" src="app.mjs"></script></html>
