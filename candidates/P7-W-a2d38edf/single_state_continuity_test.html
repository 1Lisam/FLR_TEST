<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FLR V56 Single-State Continuity Test</title>
<style>
body{margin:0;background:#0b1117;color:#eef3f7;font-family:system-ui,sans-serif}.app{max-width:1180px;margin:auto;padding:16px}
.controls,.status,.panel{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#111b24;border:1px solid #263645;border-radius:10px;padding:12px;margin-bottom:12px}
button,select{background:#182734;color:#fff;border:1px solid #3d5568;border-radius:7px;padding:8px 10px}.tabbar{display:flex;gap:8px;margin-bottom:12px}.tabbar button.active{background:#2a4a60;border-color:#7bb7d9}.compare-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.compare-card{background:#111b24;border:1px solid #263645;border-radius:10px;padding:8px}.compare-grid.single{grid-template-columns:1fr}.compare-grid.single .compare-card{display:none}.compare-grid.single .compare-card.focused{display:block;max-width:980px;width:100%;margin:0 auto}.compare-grid.single .compare-card.focused canvas{max-height:620px}.viewMode.active{background:#2a4a60;border-color:#7bb7d9}.compare-title{font-weight:800;text-align:center;margin:2px 0 7px}.compare-card canvas{width:100%;height:auto;border-radius:7px;background:#315b37}.compare-state{font-size:12px;color:#b8c7d2;min-height:18px;padding-top:5px;text-align:center}@media(max-width:980px){.compare-grid{grid-template-columns:1fr}}.pitch{position:relative;background:#111b24;border:1px solid #263645;border-radius:10px;padding:10px}
canvas{width:100%;height:auto;display:block;background:#315b37}
.scene-notice{position:absolute;left:50%;top:12%;transform:translateX(-50%);max-width:82%;padding:10px 15px;border:1px solid rgba(218,241,250,.78);border-radius:10px;background:rgba(7,18,24,.90);box-shadow:0 8px 28px rgba(0,0,0,.34);color:#f3fbff;font-size:14px;font-weight:800;line-height:1.3;text-align:center;z-index:21;pointer-events:none;animation:sceneNoticeIn .16s ease-out}@keyframes sceneNoticeIn{from{opacity:0;transform:translate(-50%,-7px)}to{opacity:1;transform:translate(-50%,0)}}@media(max-width:760px){.scene-notice{top:9%;max-width:90%;font-size:12px;padding:8px 10px}}.muted{color:#9db0bf}.good{color:#8ee6a7}.warn{color:#ffd38a}
#choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;width:100%}#log{max-height:220px;overflow:auto;display:block;width:100%;font-size:14px}
.row{padding:4px 0;border-bottom:1px solid #20303c}.big{font-weight:700}.tag{padding:3px 7px;border-radius:99px;background:#20303c}
</style>
</head><body><main class="app">
<h2>FLR · 결정적 상황 연속 경기 테스트</h2>
<div class="tabbar"><button id="tabMain" class="active">결정적 상황 테스트</button><button id="tabCompare">오프더볼 3분할 비교</button></div>
<section id="mainTab">
<div class="controls">
<label>주인공 <select id="hero"><option value="H-ST">ST</option><option value="H-CM">CM</option><option value="H-LCB">CB</option><option value="H-GK">GK</option></select></label>
<label>오프더볼 정책 <select id="offballPolicy"><option value="CURRENT">A · 현재 방식</option><option value="LOCKED_MARK">B · 책임 고정형</option><option value="ZONAL_RELATION">C · 지역 우선형</option></select></label>
<button id="start">경기 시작</button><button id="same">같은 SEED</button><button id="new">새 SEED</button>
<span id="seed" class="muted"></span>
</div>
<div class="status"><span class="tag">Hybrid/V2 사용 안 함</span><span class="tag">P.create 1회</span><span class="tag">결정적 상황만 표시</span><strong id="clock">0'</strong><strong id="score">0 - 0</strong><span id="state">대기</span></div>
<div class="pitch"><canvas id="pitch" width="1050" height="680"></canvas><div id="sceneNotice" class="scene-notice" hidden>다음 상황까지 진행 중입니다…</div></div>
<div class="panel"><div id="choices" hidden></div><div id="result" class="big"></div></div>
<div class="panel"><div id="log"></div></div>
</section>
<section id="compareTab" hidden>
<div class="controls">
<label>강제 검증 상황 <select id="forcedScenario">
<option value="NATURAL">자연 경기</option>
<option value="CB_ST_HANDOFF">CB가 ST를 버리는지</option>
<option value="ST_DROP">ST가 내려올 때 CB 추종</option>
<option value="WIDE_HANDOFF">측면 WF 마킹 인계</option>
<option value="CM_RUNNER">상대 CM 2선 침투</option>
<option value="LINE_PUSH">후방 빌드업 · 라인 상승</option>
<option value="FAR_OFFBALL">공과 먼 공격진 움직임</option>
</select></label>
<button id="compareStart">같은 상황 20초 재생</button>
<button id="compareReplay" disabled>다시보기</button>
<button id="comparePause">일시정지</button>
<label>배속 <select id="compareSpeed"><option value="0.25">0.25x</option><option value="0.5">0.5x</option><option value="1" selected>1x</option></select></label>
<label><input id="showTrails" type="checkbox" checked> 3초 궤적</label>
<label><input id="showMarks" type="checkbox" checked> 마킹선</label>
<label><input id="showTargets" type="checkbox" checked> 목표점</label>
<label>집중 선수 <select id="focusPlayer"><option value="">없음</option></select></label>
<button id="compareReset">초기화</button>
<span id="compareSeed" class="muted"></span>
<span id="compareClock" class="tag">0.0 / 20.0초</span>
</div>
<div class="controls">
<span class="muted">확대 보기</span>
<button class="viewMode active" data-view="ALL">3분할</button>
<button class="viewMode" data-view="A">A 확대</button>
<button class="viewMode" data-view="B">B 확대</button>
<button class="viewMode" data-view="C">C 확대</button>
<span class="muted">선수를 화면에서 클릭해도 세 화면에서 같은 선수가 강조됩니다.</span>
</div>
<div class="compare-grid">
  <div class="compare-card"><div class="compare-title">A · 현재 방식</div><canvas id="compareA" width="420" height="270"></canvas><div id="compareAState" class="compare-state"></div></div>
  <div class="compare-card"><div class="compare-title">B · 책임 고정형</div><canvas id="compareB" width="420" height="270"></canvas><div id="compareBState" class="compare-state"></div></div>
  <div class="compare-card"><div class="compare-title">C · 지역 우선형</div><canvas id="compareC" width="420" height="270"></canvas><div id="compareCState" class="compare-state"></div></div>
</div>
<div class="panel"><div><strong id="scenarioTitle">자연 경기</strong><div id="scenarioHelp" class="muted">세 화면은 같은 SEED와 같은 시작 상태에서 동시에 진행되며, 오프더볼 정책만 다릅니다.</div></div></div>
</section>
</main>
<script src="runtime/match_flow_resolution.js"></script>
<script src="runtime/tactical_movement.js"></script>
<script src="runtime/restart_movement.js"></script>
<script src="runtime/free_kick_templates.js"></script>
<script src="runtime/free_kick_wall_model.js"></script>
<script src="runtime/corner_templates.js"></script>
<script src="runtime/v37_set_piece_liveliness_patch.js"></script>
<script src="runtime/match_choice_telemetry.js"></script>
<script src="runtime/attribute_match_adapter.js"></script>
<script src="runtime/action_candidate_engine.js"></script>
<script src="runtime/match_academy.js"></script>
<script src="runtime/aerial_contest.js"></script>
<script src="runtime/take_on_duel.js"></script>
<script src="runtime/ball_strike_model.js"></script>
<script src="runtime/continuous_match_core.js"></script>
<script src="runtime/v37_match_feel_patch.js"></script>
<script src="runtime/choice_action_resolver.js"></script>
<script src="runtime/choice_action_resolver_step38.js"></script>
<script src="runtime/manager_tendency_adapter.js"></script>
<script src="runtime/protagonist_match_controller.js"></script>
<script src="single_state_continuity_test.js"></script>
</body></html>
