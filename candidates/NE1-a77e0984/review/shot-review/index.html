<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FLR · 슛 판단 비교</title><link rel="stylesheet" href="../../style.css"><style>.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pair article{padding:6px}.pair h2{padding:10px;margin:0}canvas{width:100%}@media(max-width:700px){.pair{grid-template-columns:1fr}}</style><main><h1>슛할 기회 · 수정 전후</h1><p>골키퍼가 골문에 있다는 이유로 슛을 미루던 판단을 정리했습니다. 슛길을 보는 판단과 실제 선방을 구분합니다. 수비수의 차단과 골키퍼의 선방은 그대로 일어납니다.</p><div class="controls"><select id="scene" aria-label="장면"><option value="0">레드 공격수 · 약15m</option><option value="1">블루 측면 · 약18m</option></select><button id="play" class="primary">비교 재생</button><button id="reset">처음으로</button><label>재생 속도<select id="speed"><option value="0.25">천천히 · ¼</option><option value="0.5">½</option><option value="1">실제 속도</option></select></label><input id="time" type="range" min="0" max="6" step="0.1" value="0"><output id="clock">0.0초</output><a href="../../">실제 경기 열기</a></div><div class="pair"><article><h2>수정 전 · <span id="oldPhase"></span></h2><canvas id="before" width="1150" height="800"></canvas></article><article><h2>수정 후 · <span id="newPhase"></span></h2><canvas id="after" width="1150" height="800"></canvas></article></div><p class="small" id="status">같은 실제 상태에서 두 엔진이 자연스럽게 진행한6초 기록입니다.22명 모두 표시하며0.1초 간격의 실현 좌표를 보간합니다. 이것은 지난 기록의 비교 재생입니다. 반복 패스 전체가 해결됐다는 판정은 아닙니다.</p></main><script type="module" src="app.mjs"></script></html>
