<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FLR · 압박과 전진 비교</title><link rel="stylesheet" href="../../style.css"><style>.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pair article{padding:6px}.pair h2{padding:10px;margin:0}canvas{width:100%}@media(max-width:700px){.pair{grid-template-columns:1fr}}</style><main><h1>압박을 벗어난 뒤 · 수정 전후</h1><p>이미 상대를 따돌리고 전진 중인데도 거리만 보고 급하게 패스하던 판단을 정리했습니다. 실제로 접근하거나 앞길을 막는 상대에게는 기존 압박 대응을 유지합니다.</p><div class="controls"><select id="scene" aria-label="장면"><option value="0">레드 중앙 미드필더 · 압박을 벗어난 뒤</option><option value="1">레드 측면 미드필더 · 전진 가능 공간</option></select><button id="play" class="primary">비교 재생</button><button id="reset">처음으로</button><label>재생 속도<select id="speed"><option value="0.25">천천히 · ¼</option><option value="0.5">½</option><option value="1">실제 속도</option></select></label><input id="time" type="range" min="0" max="6" step="0.1" value="0"><output id="clock">0.0초</output><a href="../../">실제 경기 열기</a></div><div class="pair"><article><h2>수정 전 · <span id="oldPhase"></span></h2><canvas id="before" width="1150" height="800"></canvas></article><article><h2>수정 후 · <span id="newPhase"></span></h2><canvas id="after" width="1150" height="800"></canvas></article></div><p class="small" id="status">같은 실제 상태에서 두 엔진이 자연스럽게 진행한6초 기록입니다.22명 모두 표시하며0.1초 간격의 실현 좌표를 보간합니다. 이것은 지난 기록의 비교 재생입니다. 불필요한 급한 패스 한 원인을 고친 비교입니다. 반복 패스 전체나 모든 포메이션이 해결됐다는 판정은 아닙니다.</p></main><script type="module" src="app.mjs"></script></html>
