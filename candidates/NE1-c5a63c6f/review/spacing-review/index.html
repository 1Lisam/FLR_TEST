<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FLR · 지원과 전방 공간</title><link rel="stylesheet" href="../../style.css"><style>[hidden]{display:none!important}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pair article{padding:6px}.pair h2{padding:10px;margin:0}canvas{width:100%}@media(max-width:700px){.pair{grid-template-columns:1fr}}</style><main><h1>받으러 오는 선수와 앞에 남는 선수</h1><p>공을 뒤로 돌릴 때 전방 전체가 함께 내려오던 움직임을 조정했습니다. 가까운 지원·반대편 폭·전방 깊이를 비교해 보세요.</p><div class="controls"><select id="scene" aria-label="장면"><option value="0">신고 장면 직전 · 지원과 전방 깊이</option><option value="1">신고 사진의 상태에서 계속</option><option value="2">레드 4-4-2 · 두 공격수의 다른 움직임</option><option value="3">경기 1번 · 처음 40초</option></select><button id="play" class="primary">비교 재생</button><button id="reset">처음으로</button><label>재생 속도<select id="speed"><option value="0.25">천천히 · ¼</option><option value="0.5">½</option><option value="1">실제 속도</option></select></label><input id="time" type="range" min="0" max="6" step="0.1" value="0"><output id="clock">0.0초</output><a href="../../">실제 경기 열기</a></div><p id="note"></p><div class="pair"><article><h2>수정 전 · <span id="oldPhase"></span></h2><canvas id="before" width="1150" height="800"></canvas><p class="small detail-label">비교 선수 주변 확대 · 양쪽은 같은 영역</p><canvas id="detail-before" width="600" height="360"></canvas></article><article><h2>수정 후 · <span id="newPhase"></span></h2><canvas id="after" width="1150" height="800"></canvas><p class="small detail-label">비교 선수 주변 확대 · 양쪽은 같은 영역</p><canvas id="detail-after" width="600" height="360"></canvas></article></div><p class="small" id="status">같은 상태의10초 비교는0.1초, 처음40초 비교는0.2초 간격의 실현 좌표를 보간합니다.22명을 모두 보여 주는 지난 기록 재생이며30fps 녹화가 아닙니다. 반복 패스 전체나 모든 포메이션의 완료 판정은 아닙니다.</p></main><script type="module" src="app.mjs"></script></html>
