<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FLR · 움직임 전후 비교</title><link rel="stylesheet" href="style.css"></head><body><main>
<header><p>FOOTBALL LIFE RPG · 공 없는 공격 지원 수리 비교</p><h1>멈춘 전방 지원이 공과 연결되는가</h1><p id="scope">자료를 읽는 중입니다.</p><p id="verdict"></p><a href="../../index.html">직접 경기 실행하기</a></header>
<section class="controls"><label>장면<select id="scene"></select></label><button id="play">재생</button><button id="rewind">처음으로</button><label>속도<select id="speed"><option value="1">1배</option><option value="4">4배</option><option value="8">8배</option></select></label><label><input id="highlight" type="checkbox" checked>관찰 선수 표시</label><output id="clock"></output></section>
<label>살펴볼 구간<select id="window"><option value="whole">전체</option></select></label><input id="timeline" type="range" min="0" max="10" step="0.01" value="0" aria-label="비교 시각">
<div class="dual"><section><h2>수정 전</h2><canvas id="before" width="1150" height="800" aria-label="수정 전 양 팀 22명"></canvas></section><section><h2>수정 후</h2><canvas id="after" width="1150" height="800" aria-label="수정 후 양 팀 22명"></canvas></section></div>
<section class="controls"><button id="sheet">구간 비교 그림 저장</button><button id="capture">현재 비교 화면 저장</button><span id="saved"></span></section>
<section class="notes"><h2>이 장면에서 확인할 것</h2><p id="note"></p><p>두 화면은 이미 진행된 위치 기록을 재생합니다. 초당5개의 실현 좌표를 보간하며, 실제 경기 화면을 촬영한 영상과 구분합니다. 모든 경고를 없앴거나 경기 전체가 정상이라는 뜻은 아닙니다.</p><details><summary>남은 관찰 후보</summary><div id="findings"></div></details></section>
</main><script type="module" src="app.mjs"></script></body></html>
