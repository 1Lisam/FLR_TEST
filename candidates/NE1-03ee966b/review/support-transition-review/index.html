<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FLR · 지원 움직임의 전환</title><link rel="stylesheet" href="../../style.css"><style>[hidden]{display:none!important}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pair article{padding:6px}.pair h2{padding:10px;margin:0}canvas{width:100%}@media(max-width:700px){.pair{grid-template-columns:1fr}}</style><main><h1>패스에 따라 지원 방향을 바꾸는 움직임</h1><p>가까운 지원과 전방 지원을 너무 좁은 구간에서 급히 바꾸던 부분을 조정한 비교입니다. 같은 팀의 간격과 패스 뒤 움직임을 함께 봐 주세요.</p><div class="controls"><select id="scene" disabled data-loading="true" aria-label="장면"><option value="0">패스 뒤 중원 방향 전환</option><option value="1">신고 사진의 정확한 상태</option><option value="2">신고 장면에 이르는 패스</option><option value="3">레드 4-4-2의 지원 이동</option><option value="4">경기 1 처음 60초</option><option value="5">별도 경기 26785 처음 60초</option><option value="6">새 경기 2039161 처음 60초</option></select><button id="play" disabled data-loading="true" class="primary">비교 재생</button><button id="reset" disabled data-loading="true">처음으로</button><label>재생 속도<select id="speed" disabled data-loading="true"><option value="0.25">천천히 · ¼</option><option value="0.5">½</option><option value="1">실제 속도</option></select></label><input id="time" disabled data-loading="true" type="range" min="0" max="6" step="0.1" value="0"><output id="clock">0.0초</output><a href="../../">실제 경기 열기</a></div><p id="note">비교 장면을 불러오는 중입니다.</p><div class="pair"><article><h2>수정 전 · <span id="oldPhase"></span></h2><canvas id="before" width="1150" height="800"></canvas><p class="small detail-label">비교 선수 주변 확대 · 양쪽은 같은 영역</p><canvas id="detail-before" width="600" height="360"></canvas></article><article><h2>수정 후 · <span id="newPhase"></span></h2><canvas id="after" width="1150" height="800"></canvas><p class="small detail-label">비교 선수 주변 확대 · 양쪽은 같은 영역</p><canvas id="detail-after" width="600" height="360"></canvas></article></div><p class="small" id="status">실제 0.2초 간격 기록을 보간한 비교입니다. 30fps 녹화나 모든 경기의 자연스러움 인증은 아닙니다.</p></main><script type="module" src="app.mjs"></script></html>
