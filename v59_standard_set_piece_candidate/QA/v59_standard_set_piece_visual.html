<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FLR V59 Standard Set Piece Visual</title><style>

<div class="bar"><strong>V59 표준 세트피스 최종 테스트</strong><label>상황 <select id="scenario"><option value="DEEP">REST-02 깊은 프리킥</option><option value="ATTACK">공격지역 프리킥</option><option value="CORNER_TOP">코너킥 상단</option><option value="CORNER_BOTTOM">코너킥 하단</option><option value="REST03">REST-03 자연 경기</option><option value="REST04">REST-04 자연 경기</option></select></label><button id="start">시작/다시 시작</button><button id="pause">일시정지</button><button id="resume">계속</button><label>속도 <select id="speed"><option value=".5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option><option value="4">4x</option></select></label><label>시간 <input id="jumpTime" type="number" value="290"></label><button id="jump">해당 초로 이동</button></div>

<script>(()=>{const S=document.querySelector('#scenario'),speed=document.querySelector('#speed'),jt=document.querySelector('#jumpTime'),meta=document.querySelector('#meta');let timer=null,paused=true;
function cfg(){if(S.value==='DEEP')return{mode:'LEGACY_EXECUTE',scenario:'TEST_ONLY_DEEP_FREE_KICK',seed:'V59-FK-DEEP',seconds:60,fps:20,showTargets:false,fixture:{kind:'FREE_KICK_VISUAL',team:'AWAY',x:67.97,y:57.02,protagonistControllerId:'H-ST'}};if(S.value==='ATTACK')return{mode:'LEGACY_EXECUTE',scenario:'TEST_ONLY_ATTACK_FREE_KICK',seed:'V59-FK-ATTACK',seconds:60,fps:20,showTargets:false,fixture:{kind:'FREE_KICK_VISUAL',team:'AWAY',x:27,y:50,protagonistControllerId:'H-ST'}};if(S.value==='CORNER_TOP')return{mode:'LEGACY_EXECUTE',scenario:'TEST_ONLY_CORNER_TOP',seed:'V59-CORNER-TOP',seconds:60,fps:20,showTargets:false,fixture:{kind:'CORNER_VISUAL',team:'AWAY',x:0,y:0,protagonistControllerId:'H-ST'}};if(S.value==='CORNER_BOTTOM')return{mode:'LEGACY_EXECUTE',scenario:'TEST_ONLY_CORNER_BOTTOM',seed:'V59-CORNER-BOTTOM',seconds:60,fps:20,showTargets:false,fixture:{kind:'CORNER_VISUAL',team:'AWAY',x:0,y:68,protagonistControllerId:'H-ST'}};const seed=S.value==='REST04'?'V58-REST-04':'V58-REST-03';return{mode:'LEGACY_EXECUTE',scenario:'NATURAL',seed,seconds:420,fps:20,showTargets:false,fixture:{kind:'NATURAL'}}}
function sched(){if(timer)clearInterval(timer);timer=setInterval(()=>{if(!paused)window.FLR_V57_FRAME_TICK_QA.step()},Math.max(12,50/Number(speed.value||1)))}function reset(){if(timer)clearInterval(timer);window.FLR_V57_FRAME_TICK_QA.init(cfg());paused=false;sched()}
document.querySelector('#start').onclick=reset;document.querySelector('#pause').onclick=()=>paused=true;document.querySelector('#resume').onclick=()=>{paused=false;sched()};speed.onchange=sched;
document.querySelector('#jump').onclick=()=>{if(!['REST03','REST04'].includes(S.value)){meta.textContent='시간 이동은 자연 경기에서 사용합니다.';return}if(timer)clearInterval(timer);window.FLR_V57_FRAME_TICK_QA.init(cfg());const r=window.FLR_V57_FRAME_TICK_QA.fastForwardTo(Number(jt.value)||0);paused=true;meta.textContent='이동 완료 · t='+r.time.toFixed(2)+' · 일시정지'};
S.onchange=()=>{jt.value=S.value==='REST04'?118:S.value==='REST03'?290:0;reset()};window.addEventListener('load',()=>{const x=setInterval(()=>{if(window.FLR_V57_FRAME_TICK_QA?.engineReady?.()){clearInterval(x);reset()}},50)})})();</script></body></html>
