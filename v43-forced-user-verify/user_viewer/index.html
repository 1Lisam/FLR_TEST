<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FLR V43 사용자 Viewer 검증</title>
  <link rel="stylesheet" href="user_viewer.css">
</head>
<body>
  <main>
    <h1>V43 장면 사용자 검증 <small>TEST_ONLY</small></h1>
    <p class="muted">세 장면을 먼저 직접 보고 정상/애매/축구 같지 않음을 선택하세요. 판정 전에는 내부 검증 정보가 표시되지 않습니다.</p>
    <div id="caseList" class="case-list"></div>
    <section id="viewerPanel" hidden>
      <h2 id="caseTitle"></h2>
      <iframe id="originalViewer" title="FLR original 2D Viewer" src="../../index.html?flr_v43_user_viewer=1"></iframe>
      <div class="controls">
        <button id="toggle" type="button">재생</button>
        <button data-rate="1" type="button">1×</button>
        <button data-rate="2" type="button">2×</button>
        <input id="scrub" type="range" min="0" value="0" step="1">
      </div>
      <div class="judgments" aria-label="사용자 판정">
        <button data-judge="정상" type="button">정상</button>
        <button data-judge="애매" type="button">애매</button>
        <button data-judge="축구 같지 않음" type="button">축구 같지 않음</button>
      </div>
      <label>선택 사항 메모<textarea id="note" placeholder="이 장면에 대한 메모"></textarea></label>
      <p id="caseResult" aria-live="polite"></p>
    </section>
    <section id="aggregate" hidden>
      <h2>전체 검증 요약</h2>
      <textarea id="summary" readonly></textarea>
      <button id="copy" type="button">요약 복사</button>
    </section>
  </main>
  <script>
    const $=id=>document.getElementById(id), frame=$('originalViewer');
    let data,current,index=0,rate=1,playing=false,last=0,raf=0,adapter=null;
    const judgments=JSON.parse(localStorage.getItem('v43-original-viewer-judgments')||'{}');
    const notes=JSON.parse(localStorage.getItem('v43-original-viewer-notes')||'{}');
    const post=(type,payload)=>frame.contentWindow.postMessage({source:'FLR_V43_USER_VIEWER',type,...payload},'*');
    function showResult(){const j=judgments[current?.id];if(!j){$('caseResult').textContent='판정 전에는 내부 검증 정보를 공개하지 않습니다.';return}const f=current.frames[j.frameIndex??index];$('caseResult').textContent=`판정이 저장되었습니다. 내부 매핑: ${current.internalClass} · seed ${current.seed} · ${f.time}초 · detector ${JSON.stringify(f.detector)}`;}
    function render(){if(!current||!adapter)return;const source=current.frames[index];adapter.render(source);$('scrub').value=index;}
    function stop(){playing=false;cancelAnimationFrame(raf);raf=0;$('toggle').textContent='재생';}
    function tick(now){if(!playing)return;const elapsed=Math.min(.08,(now-last)/1000);last=now;const next=index+elapsed*rate*10;if(next>=current.frames.length-1){index=current.frames.length-1;render();stop();return}const lo=Math.floor(next),t=next-lo;adapter.render(adapter.interpolate(current.frames[lo],current.frames[lo+1],t));$('scrub').value=lo;raf=requestAnimationFrame(tick)}
    function prepareOriginalFrame(){const d=frame.contentDocument;if(!d)return;const style=d.createElement('style');style.textContent='.developer-info,.control-panel,#finalMatchTestDock,#heroChoicePanel,#heroResultPanel,.replay-history-panel,.log-panel,.developer-panel,#heroBugModal,.pitch-footer{display:none!important}.pitch-card{margin:0!important}';d.head.appendChild(style)}
    function openCase(id){stop();current=data.cases.find(c=>c.id===id);index=0;$('viewerPanel').hidden=false;$('caseTitle').textContent=current.label;$('scrub').max=current.frames.length-1;$('note').value=notes[id]??judgments[id]?.note??'';if(adapter)adapter.setFocus(current.heroPlayerId);post('LOAD_CASE',{heroPlayerId:current.heroPlayerId});render();showResult();}
    function refresh(){if(!data)return;const done=data.cases.every(c=>judgments[c.id]?.judgment);$('aggregate').hidden=!done;if(done)$('summary').value=data.cases.map(c=>{const j=judgments[c.id],f=c.frames[j.frameIndex??0];return `${c.label}\n사용자 판단: ${j.judgment}\n메모: ${notes[c.id]??j.note??'(없음)'}\n내부 분류: ${c.internalClass}\nseed: ${c.seed}\n정확한 현재 이벤트 시각: ${f.time}초\nrole: ${c.heroRole}\ndetector.flagged: ${JSON.stringify(f.detector.flagged)}\nsignals: ${JSON.stringify(f.detector.signals)}`}).join('\n\n');}
    frame.addEventListener('load',()=>{prepareOriginalFrame();adapter=frame.contentWindow.FLR_V43_ORIGINAL_VIEWER_ADAPTER;if(!adapter){$('caseResult').textContent='원본 Viewer TEST_ONLY adapter를 찾지 못했습니다.';return}adapter.setOffside(false);if(current){adapter.setFocus(current.heroPlayerId);post('LOAD_CASE',{heroPlayerId:current.heroPlayerId});render()}});
    $('scrub').oninput=e=>{stop();index=Number(e.target.value);render()};$('toggle').onclick=()=>{if(!current)return;if(playing){stop();return}if(index>=current.frames.length-1)index=0;playing=true;$('toggle').textContent='일시정지';last=performance.now();raf=requestAnimationFrame(tick)};
    document.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>rate=Number(b.dataset.rate));$('note').oninput=()=>{if(current){notes[current.id]=$('note').value;localStorage.setItem('v43-original-viewer-notes',JSON.stringify(notes))}};
    document.querySelectorAll('[data-judge]').forEach(b=>b.onclick=()=>{if(!current)return;judgments[current.id]={judgment:b.dataset.judge,note:$('note').value,frameIndex:index};localStorage.setItem('v43-original-viewer-judgments',JSON.stringify(judgments));showResult();refresh()});$('copy').onclick=async()=>{ $('summary').focus();$('summary').select();try{await navigator.clipboard.writeText($('summary').value);$('copy').textContent='복사됨'}catch(e){document.execCommand('copy');$('copy').textContent='선택됨 — Ctrl/Cmd+C로 복사'}};
    fetch('../V43_FORCED_USER_VERIFY_DATA.json').then(r=>r.json()).then(x=>{data=x;$('caseList').innerHTML=x.cases.map(c=>`<button type="button" data-case="${c.id}">${c.label}</button>`).join('');document.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>openCase(b.dataset.case));refresh()});
  </script>
</body>
</html>
